</div>

<div id="voile" class="voile cacher"><div class="panneau" id="panneau"></div></div>

<script>
const $ = s => document.querySelector(s);
const T = (s='') => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

let LEX = {};          // le lexique — chargé une fois, utilisé partout
let profilId = localStorage.getItem('align.profil');
let profils = [];
let lieuChoisi = null;
let editionDe = null;  // null = création, sinon l'id du profil qu'on modifie

// Enregistré une fois par chargement de page, quelle que soit la vue — sans
// lui, aucune notification push n'est possible (voir static/sw.js).
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

// Un rappel push touché pendant que l'app est DÉJÀ ouverte : le service worker
// nous transmet la carte à montrer (voir static/sw.js, notificationclick).
// L'app fermée, elle, lira le même choix dans l'URL au démarrage (voir demarrer).
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'rappel') ouvrirCartePourRappel(d.carte, d.domaine, d.profil);
  });
}

// Précharge les octets des images d'arrière-plan pour qu'elles soient prêtes
// avant les fondus, puis fait ÉMERGER du noir la tuile et le bandeau (fondu
// 1.6s — Martin, 2026-08-27, validé : « l'animation pour le fond d'écran
// général est parfait »). L'expérimentation « cacher header/fond jusqu'à la
// fermeture de l'écran plein écran » (même jour) a été ANNULÉE : elle
// cassait la barre de menu (restait cachée) — on revient au comportement
// simple : le header est visible dès le départ, le fond fond à l'ouverture.
function precharger_fonds() {
  const fondre = (el, url) => {
    if (!el) return;
    const marquer = () => requestAnimationFrame(() =>
      requestAnimationFrame(() => el.classList.add('chargee')));
    const img = new Image();
    img.onload = marquer;
    img.onerror = marquer;               // jamais coincé invisible si l'image échoue
    img.src = url;
    if (img.complete && img.naturalWidth) marquer();   // déjà en cache
  };
  fondre(document.getElementById('fond-app'), '/static/img/fond-defilement.webp');
  fondre(document.querySelector('.bandeau-marque'), '/static/img/trame-bandeau.jpg');
  // Le fond « métier » de l'accueil du jour : simple mise en cache anticipée,
  // son écran fond déjà par sa propre transition d'opacité (.ouvert).
  new Image().src = '/static/img/metierAtisser1.webp';
}
precharger_fonds();

/* ═══ JOURNAL D'ACTIVITÉ (tableau de bord admin, 2026-08-28) ═══
   Envoie au serveur des événements minimaux : 'ouverture' au démarrage,
   'nav' à chaque changement de section (popularité des sections), 'ping'
   toutes les 60 s tant que l'app est au PREMIER PLAN (durée des sessions).
   Fire-and-forget : jamais bloquant, les erreurs sont ignorées. Le serveur
   n'enregistre que si une session est déverrouillée (voir /api/activite). */
function journalActivite(type, vue) {
  try {
    fetch('/api/activite', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, vue: vue || '', profil: profilId || ''}),
      keepalive: true,
    }).catch(() => {});
  } catch {}
}
// Battement : seulement quand l'onglet/app est VISIBLE (sinon on gonflerait la
// durée pendant que l'app est en arrière-plan).
setInterval(() => {
  if (document.visibilityState === 'visible' && profilId) journalActivite('ping');
}, 60000);

// ⚠️ En PWA installée (« mode appli », iOS surtout), le système garde
// souvent l'app SUSPENDUE en mémoire entre deux ouvertures plutôt que de la
// recharger depuis le réseau — comme un onglet Safari mis en pause, pas
// fermé. Toucher l'icône ne re-télécharge alors RIEN : le code (HTML/JS/CSS,
// tout inline ici) reste celui de la dernière vraie visite, parfois vieux de
// plusieurs jours — d'où « mes changements ne semblent pas pris en compte »
// (Martin, 2026-08-27), alors qu'ils sont bien en ligne (un compte vierge,
// qui force un chargement réseau frais, les voit tout de suite).
// `pageshow` avec `event.persisted` signale PRÉCISÉMENT ce cas — une page
// restaurée depuis ce cache de navigation, pas un chargement réseau — sans
// se déclencher à chaque changement d'onglet ordinaire. On force alors un
// rechargement complet pour repartir sur le code à jour.
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

/* ═══════════════════════════════════════════════════════════
   VULGARISATION — aucun terme technique n'atteint l'écran nu.
   Chaque helper traduit une clé en français clair.
   ═══════════════════════════════════════════════════════════ */
const nomMaison = n => (LEX.maisons?.[n]?.nom) || `maison ${n}`;
const quoiMaison = n => (LEX.maisons?.[n]?.quoi) || '';
const nomPhase = p => (LEX.phases?.[p]?.nom) || String(p).replace(/_/g,' ');
const quoiPhase = p => (LEX.phases?.[p]?.quoi) || '';
const nomPlanete = p => (LEX.planetes?.[p]?.nom) || p;
const quoiPlanete = p => (LEX.planetes?.[p]?.quoi) || '';
const nomAspect = c => (LEX.aspects?.[c]?.nom) || c;
const terme = k => LEX.termes?.[k] || {};
const nomEtat = e => terme(e).court || e;

/* L'URL de la vignette d'un arcane — miroir JS de moteur.tarot.url_carte
   (22 ≡ 0 : Le Mat ferme la boucle ; format 00.jpg). La vignette ILLUSTRE un
   arcane calculé, elle ne tire jamais de carte au hasard. */
const urlCarte = n => `/static/cartes/${String(n === 22 ? 0 : n).padStart(2,'0')}.jpg`;

/* L'URL de la vignette d'une mineure (miroir JS de moteur.mineurs.url_carte_mineure).
   `onerror` replie sur le dos de carte si le fichier venait à manquer — la
   vignette illustre un calcul, elle ne doit jamais casser l'affichage. */
const urlCarteMineur = (suit, rang) => `/static/cartes/mineurs/${suit}_${rang}.jpg`;

/* Le « ? » repliable — la vulgarisation à la demande, jamais imposée. */
function aide(titre, texte, source) {
  if (!texte) return '';
  return `<details class="aide"><summary>${T(titre)}</summary>
    <p>${T(texte)}${source ? ' <em>' + T(source) + '</em>' : ''}</p></details>`;
}

/* L'anneau d'un cycle (année sur 9, mois sur 9…) : le chiffre au centre, la
   position dans le cycle en anneau autour — plus lisible d'un coup d'œil que
   « 3 sur 9 », et ça reste sobre : un simple contour, une seule section
   allumée, pas un graphique de jeu vidéo. */
function anneauCycle(valeur, total, taille = 60) {
  const cx = taille / 2, cy = taille / 2, r = taille / 2 - 6, epaisseur = 5;
  const pas = 360 / total, ecart = 3; // degrés de vide entre deux sections

  const polaire = (angle) => {
    const a = (angle - 90) * Math.PI / 180; // -90° : la section 1 commence en haut
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  };
  const arc = (debut, fin) => {
    const p1 = polaire(debut), p2 = polaire(fin);
    const grandArc = (fin - debut) > 180 ? 1 : 0;
    return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${grandArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  };

  let sections = '';
  for (let i = 0; i < total; i++) {
    const actif = (i + 1) === valeur;
    sections += `<path d="${arc(i * pas + ecart, (i + 1) * pas - ecart)}" fill="none"
      stroke="${actif ? 'var(--accent)' : 'var(--bord)'}"
      stroke-width="${actif ? epaisseur + 1.5 : epaisseur}" stroke-linecap="butt"/>`;
  }
  return `<svg viewBox="0 0 ${taille} ${taille}" width="${taille}" height="${taille}" class="anneau-cycle">
    ${sections}
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" class="anneau-cycle-chiffre">${valeur}</text>
  </svg>`;
}

/* ═══════════════════════════════════════════════════════════
   PROFILS — créer, changer, MODIFIER, supprimer.
   ═══════════════════════════════════════════════════════════ */
async function chargerProfils() {
  profils = await (await fetch('/api/profils')).json();
  return profils;
}

function dessinerPuce() {
  const p = profils.find(x => x.id === profilId);
  const puce = $('#puce-profil');
  if (!p) { puce.classList.add('cacher'); return; }
  puce.classList.remove('cacher');
  // Icône « personne » + nom : le profil rejoint la famille visuelle des deux
  // autres outils (Règles, Commentaire) — même pastille, plus la grosse pilule
  // dorée qui écrasait le titre (refonte en-tête, 2026-08-27).
  puce.innerHTML = `<svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg>
    <span>${T(p.nom_affiche)}</span><span class="fleche">▼</span>`;
  puce.onclick = () => montrer('profils');
}

/* Tableau de bord bêta, affiché DANS l'app via le plein écran générique
   (ouvrirAnglePlein) — alimenté par /api/admin/donnees (fetch = session OK).
   Aucune navigation de page : contourne le bug cookie des PWA iOS. */
async function ouvrirTableauBord() {
  ouvrirAnglePlein('Tableau de bord bêta', '<p class="quoi">Chargement…</p>');
  let d;
  try {
    const r = await fetch('/api/admin/donnees');
    if (!r.ok) { $('#angle-plein-corps').innerHTML = '<p class="quoi">Accès refusé — reconnecte-toi à ton compte.</p>'; return; }
    d = await r.json();
  } catch {
    $('#angle-plein-corps').innerHTML = '<p class="quoi">Impossible de charger (réseau).</p>'; return;
  }
  const testeurs = (d.testeurs || []).map(t =>
    `<div class="pont" style="display:flex;align-items:center;gap:8px;justify-content:space-between">
      <span>${t.en_ligne ? '🟢 ' : ''}<b>${T(t.nom)}</b><br><span class="quoi">${T(t.derniere)} · ${t.nb_sessions} session${t.nb_sessions > 1 ? 's' : ''}</span></span>
      <span class="cible">${T(t.total)}</span>
    </div>`).join('') || '<p class="quoi">Aucune activité enregistrée.</p>';
  const sections = (d.sections || []).map(s =>
    `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:13px">
      <span>${T(s.nom)}</span><span class="cible">${s.n}</span></div>
      <div style="background:var(--papier);border-radius:5px;height:8px;overflow:hidden">
        <span style="display:block;height:100%;width:${s.pct}%;background:var(--accent-doux)"></span></div></div>`).join('')
    || '<p class="quoi">Aucune navigation enregistrée.</p>';
  const coms = (d.commentaires || []).map(c =>
    `<div class="pont" style="display:block">
      <div class="quoi" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span>${T(c.nom_affiche || c.profil || 'anonyme')} · ${T(c.vue || '?')}</span>
        <button class="bouton discret" data-suppr-commentaire="${T(c.id)}"
          style="width:auto;margin:0;padding:4px 10px;font-size:12px">Supprimer</button>
      </div>
      <div style="white-space:pre-wrap">${T(c.texte)}</div></div>`).join('')
    || '<p class="quoi">Aucun commentaire.</p>';
  $('#angle-plein-corps').innerHTML =
    `<div class="chapo">Testeurs (${(d.testeurs || []).length})</div>${testeurs}
     <div class="chapo" style="margin-top:20px">Sections les plus visitées</div>${sections}
     <div class="chapo" style="margin-top:20px">Commentaires (${(d.commentaires || []).length})</div>${coms}`;
  // Suppression : le problème signalé est réglé, plus besoin de le garder —
  // confirmation d'abord (friction volontaire sur une action destructive).
  document.querySelectorAll('[data-suppr-commentaire]').forEach(b => b.onclick = async () => {
    if (!confirm('Supprimer ce commentaire ?')) return;
    b.disabled = true;
    await fetch(`/api/admin/commentaire/${encodeURIComponent(b.dataset.supprCommentaire)}`,
      {method: 'DELETE'});
    ouvrirTableauBord();
  });
}

function vueProfils() {
  let html = `<div class="carte">
    <div class="chapo">Tes profils</div>`;
  for (const p of profils) {
    const actif = p.id === profilId;
    // la racine du compte (elle-même pour un compte racine, le propriétaire pour
    // un thème) — sert à exiger le mot de passe quand on change de compte.
    const racine = p.proprietaire || p.id;
    html += `<div class="nombre" data-profil="${T(p.id)}" data-racine="${T(racine)}" style="align-items:center">
      <div style="flex:1">
        <div class="motcle" style="font-size:17px">${T(p.nom_affiche)}${actif ? ' ·' : ''}${p.secondaire ? ' <span style="font-size:11px;font-weight:400;color:var(--encre3)">· thème ajouté</span>' : ''}</div>
        <div class="txt">${T(p.naissance)}${p.complet ? ` · ${T(p.lieu)}` : ' · date seule'}</div>
      </div>
      <div class="plus">${actif ? 'affiché' : 'voir'}</div>
    </div>`;
  }
  html += `</div>
  <div class="carte">
    <div class="chapo">Le profil affiché</div>
    <button class="bouton" id="p-nouveau">+ Ajouter un profil</button>
    <button class="bouton discret" id="p-modifier">Modifier « ${T((profils.find(x=>x.id===profilId)||{}).nom_affiche || '')} »</button>
    <button class="bouton discret" id="p-connexion">Se connecter à un autre compte</button>
    <button class="bouton discret" id="p-deconnexion">Fermer ce compte sur cet appareil</button>
    <button class="bouton danger" id="p-supprimer">Supprimer ce profil</button>
    <p class="quoi" style="margin-top:14px">
      L'heure et le lieu de naissance changent l'Ascendant et les maisons.
      Si tu as un doute sur l'heure, tu peux la corriger ici — le thème se recalcule aussitôt.
    </p>
  </div>`;
  // Lien admin : visible UNIQUEMENT pour le compte de Martin (le serveur
  // re-vérifie l'accès de toute façon — voir _est_admin). ⚠️ MÊME fenêtre, PAS
  // target="_blank" : en PWA iOS installée (standalone), un nouvel onglet
  // s'ouvre dans un Safari SÉPARÉ, avec une session distincte — /admin ne
  // reconnaissait alors plus le compte connecté et réclamait le mot de passe
  // (Martin, 2026-08-28). En restant dans la même fenêtre, la session est
  // conservée : pas de mot de passe à saisir. /admin est dans le scope "/" de
  // la PWA, donc on ne quitte pas l'app ; un lien « retour » y ramène.
  if (profilId === 'martin-boucher') {
    html += `<div class="carte">
      <div class="chapo">Administration</div>
      <button class="bouton discret" id="p-tableau-bord">📊 Tableau de bord bêta</button>
    </div>`;
  }
  $('#vue-profils').innerHTML = html;

  // Tableau de bord admin : affiché DANS l'app (fetch + plein écran), pas une
  // page à naviguer — les `fetch` transmettent la session, contrairement aux
  // navigations de page en PWA iOS (Martin, 2026-08-28).
  const bTableau = $('#p-tableau-bord');
  if (bTableau) bTableau.onclick = () => ouvrirTableauBord();

  $('#vue-profils').querySelectorAll('[data-profil]').forEach(d => d.onclick = async () => {
    const cible = d.dataset.profil;
    const racineCible = d.dataset.racine;
    // Le profil affiché et le profil visé appartiennent-ils au MÊME compte ?
    // Les thèmes d'un même compte basculent librement ; changer de compte exige
    // le mot de passe de CE compte, même s'il a déjà été déverrouillé sur cet
    // appareil (sinon n'importe quel compte déjà ouvert se laisse lire sans mot
    // de passe — le trou signalé par Martin).
    const actuel = profils.find(x => x.id === profilId);
    const racineActuelle = actuel ? (actuel.proprietaire || actuel.id) : null;
    if (racineCible && racineCible !== racineActuelle) {
      const ok = await demanderMotDePasseCompte(racineCible, cible);
      if (!ok) return;
    }
    profilId = cible;
    localStorage.setItem('align.profil', profilId);
    await demarrer();
  });
  $('#p-nouveau').onclick = () => { editionDe = null; ouvrirFormulaire(); };
  $('#p-connexion').onclick = () => { vueConnexion(); };
  $('#p-deconnexion').onclick = async () => {
    // referme CE compte sur CET appareil : il disparaît de la liste « Tes profils »
    // et sa session locale est oubliée. Les autres comptes restent déverrouillés.
    const pid = profilId;
    await fetch('/api/deconnexion', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({profil: pid}),
    });
    if (localStorage.getItem('align.profil') === pid) localStorage.removeItem('align.profil');
    profilId = null;
    await chargerProfils();
    profils.length
      ? (profilId = profils[0].id, localStorage.setItem('align.profil', profilId), demarrer())
      : ouvrirFormulaire();
  };
  $('#p-modifier').onclick = async () => {
    editionDe = profilId;
    ouvrirFormulaire(await (await fetch(`/api/profil/${profilId}`)).json());
  };
  $('#p-supprimer').onclick = async () => {
    if (!confirm('Supprimer ce profil ? Les calculs ne sont pas conservés ailleurs.')) return;
    await fetch(`/api/profil/${profilId}`, {method:'DELETE'});
    localStorage.removeItem('align.profil');
    profilId = null;
    await chargerProfils();
    profils.length ? (profilId = profils[0].id,
      localStorage.setItem('align.profil', profilId), demarrer()) : ouvrirFormulaire();
  };
}

/* ── changer de compte = exiger son mot de passe ──
   Un compte déjà déverrouillé sur cet appareil reste lisible en session, mais
   on ne bascule PAS dessus sans son mot de passe : la liste « Tes profils »
   liste tous les comptes ouverts, et la simple lecture d'un autre compte ne
   doit pas être gratuite. On vérifie via /api/connexion (qui exige le bon mot
   de passe, et refuse après trop de tentatives). */
async function demanderMotDePasseCompte(racine, cible) {
  const entree = profils.find(x => x.id === racine)
              || profils.find(x => (x.proprietaire || x.id) === racine);
  const nom = entree ? entree.nom_affiche : racine;
  const aMdp = entree ? entree.a_mdp : true;
  $('#vue-profils').innerHTML = `<div class="carte">
    <div class="chapo">Compte « ${T(nom)} »</div>
    <p class="quoi" style="margin:-2px 0 12px">${aMdp
      ? 'Ce compte a son propre mot de passe. Entre-le pour le voir sur cet appareil.'
      : 'Ce compte n\'a pas encore de mot de passe. Le premier que tu entres deviendra le sien.'}</p>
    <label>Mot de passe</label>
    <input id="dc-mdp" type="password" autocomplete="current-password">
    <button class="bouton" id="dc-valider">Déverrouiller ce compte</button>
    <button class="bouton discret" id="dc-annuler">Annuler</button>
    <div id="dc-erreur" class="avis cacher" style="margin-top:14px"></div>
  </div>`;
  const err = m => { $('#dc-erreur').innerHTML = m; $('#dc-erreur').classList.remove('cacher'); };
  return new Promise(resolve => {
    const valider = async () => {
      const mdp = $('#dc-mdp').value;
      if (!mdp) return err('Le mot de passe est requis.');
      const r = await (await fetch('/api/connexion', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({nom, mot_de_passe: mdp}),
      })).json();
      if (r.erreur) return err(T(r.erreur));
      resolve(true);
    };
    $('#dc-valider').onclick = valider;
    $('#dc-mdp').addEventListener('keydown', e => { if (e.key === 'Enter') valider(); });
    $('#dc-annuler').onclick = () => { vueProfils(); resolve(false); };
  });
}

/* ── le formulaire, en création comme en modification ── */
function ouvrirFormulaire(profil = null) {
  const n = profil?.naissance || {};
  const deuxChiffres = v => v === undefined || v === null ? '' : String(v).padStart(2,'0');
  $('#vue-accueil').innerHTML = `<div class="carte">
    <div class="chapo">${profil ? 'Modifier le profil' : 'Pour commencer'}</div>
    ${profil ? '' : `<p style="font-family:var(--serif);font-size:18px;margin-bottom:6px">
        Ta Trame ne prédit rien. Elle tend un miroir.</p>
      <p style="font-size:14px;color:var(--encre2)">
        Ta date de naissance n'est pas un destin : c'est un point de départ.
        Ce que tu vas lire décrit un schéma que tu as reçu — non pour t'y enfermer,
        mais pour que tu le voies.</p>`}

    <label>Prénoms et nom de naissance</label>
    <input id="f-noms" placeholder="Marie Claire Tremblay" autocomplete="off"
           value="${T((profil?.prenoms_nom || []).join(' '))}">
    <p class="quoi">Tous tes prénoms d'état civil, et ton nom de naissance.
      Chaque lettre compte dans le calcul.</p>

    <label>Genre</label>
    <div id="f-genre" style="display:flex;flex-wrap:wrap;gap:6px" data-genre="${T(profil?.genre || 'x')}">
      ${[['f','Femme'],['m','Homme'],['x','Préfère ne pas préciser']].map(([v,l]) =>
        `<button type="button" class="bouton discret f-genre-b${(profil?.genre || 'x')===v ? ' actif' : ''}" data-genre="${v}" style="flex:none">${l}</button>`).join('')}
    </div>
    <p class="quoi">Facultatif — sert seulement à accorder les textes des Relations (« il »/« elle »)
      quand les deux personnes ont indiqué leur genre. Sinon, les textes restent neutres.</p>

    <label>Date de naissance</label>
    <div class="rangee">
      <input id="f-jour" placeholder="Jour" inputmode="numeric" value="${T(n.jour ?? '')}">
      <input id="f-mois" placeholder="Mois" inputmode="numeric" value="${T(n.mois ?? '')}">
      <input id="f-annee" placeholder="Année" inputmode="numeric" value="${T(n.annee ?? '')}">
    </div>

    <p class="quoi">Le reste est facultatif — si tu ne connais pas ton heure ou ton lieu
      de naissance, laisse-les vides et calcule quand même : la lecture s'en tiendra
      honnêtement aux nombres, aux cartes et à l'astrologie chinoise, sans Ascendant
      ni maisons.</p>

    <label>Heure de naissance</label>
    <div class="rangee">
      <input id="f-heure" placeholder="Heure" inputmode="numeric" value="${T(deuxChiffres(n.heure))}">
      <input id="f-minute" placeholder="Minute" inputmode="numeric" value="${T(deuxChiffres(n.minute))}">
    </div>
    <p class="quoi">Elle se trouve sur ton acte de naissance. À quelques minutes près,
      ça change peu ; à une heure près, ça change beaucoup.</p>

    <label>Lieu de naissance</label>
    <input id="f-lieu" placeholder="Trois-Pistoles" autocomplete="off" value="${T(n.lieu || '')}">
    <div id="f-suggestions" class="suggestions cacher"></div>

    ${!profil && !profils.length ? `
    <label>Code d'invitation</label>
    <input id="f-code" placeholder="Le code reçu avec ton invitation" autocomplete="off">
    <p class="quoi">Ta Trame est en bêta fermée : ce code, transmis avec ton invitation,
      débloque la création de ton compte.</p>` : ''}

    <button class="bouton" id="f-valider">${profil ? 'Enregistrer' : 'Calculer'}</button>
    ${profil || profils.length ? '<button class="bouton discret" id="f-annuler">Annuler</button>' : ''}
    ${!profil && !profils.length ? '<button class="bouton discret" id="f-connexion">J\'ai déjà un compte</button>' : ''}
    <div id="f-erreur" class="avis cacher" style="margin-top:14px"></div>
  </div>`;
  montrer('accueil');

  /* En modification, le lieu déjà enregistré reste valable tant qu'on n'y
     touche pas. Si son identifiant manque (profil d'une version antérieure
     que le serveur n'a pas su retrouver), on le dit et on force un nouveau
     choix — plutôt que d'échouer sur un message incompréhensible. */
  lieuChoisi = profil && n.lieu_id ? {id: n.lieu_id, nom: n.lieu} : null;
  câblerFormulaire(profil);
  if ($('#f-connexion')) $('#f-connexion').onclick = vueConnexion;
  if (profil && !n.lieu_id) {
    $('#f-erreur').innerHTML = `<b>Le lieu est à confirmer</b> — ce profil a été créé
      avec une version antérieure. Retape et rechoisis « ${T(n.lieu || '')} » dans la liste.`;
    $('#f-erreur').classList.remove('cacher');
  }
}

function câblerFormulaire(profil) {
  let minuteur;
  document.querySelectorAll('.f-genre-b').forEach(b => b.onclick = () => {
    $('#f-genre').dataset.genre = b.dataset.genre;
    document.querySelectorAll('.f-genre-b').forEach(x => x.classList.toggle('actif', x === b));
  });
  $('#f-lieu').addEventListener('input', e => {
    clearTimeout(minuteur); lieuChoisi = null;
    const q = e.target.value.trim();
    if (q.length < 2) { $('#f-suggestions').classList.add('cacher'); return; }
    minuteur = setTimeout(async () => {
      const r = await (await fetch('/api/lieux?q=' + encodeURIComponent(q))).json();
      const boite = $('#f-suggestions');
      if (!r.length) { boite.classList.add('cacher'); return; }
      /* On ne devine JAMAIS : trois « Saint-Fabien » existent, dont un dans une
         autre province. Un mauvais choix déplace l'Ascendant — à l'utilisateur
         de trancher. */
      boite.innerHTML = r.map((l,i) =>
        `<div data-i="${i}">${T(l.nom)}
          <small>${T(l.pays)}/${T(l.admin1||'—')} · ${l.lat.toFixed(2)}, ${l.lon.toFixed(2)}</small>
        </div>`).join('');
      boite.classList.remove('cacher');
      boite.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => {
        lieuChoisi = r[+d.dataset.i];
        $('#f-lieu').value = lieuChoisi.nom;
        boite.classList.add('cacher');
      });
    }, 180);
  });

  $('#f-valider').onclick = async () => {
    const err = m => { $('#f-erreur').innerHTML = m; $('#f-erreur').classList.remove('cacher'); };
    const noms = $('#f-noms').value.trim().split(/[\s-]+/).filter(Boolean);
    if (noms.length < 2) return err('Il faut au moins un prénom et un nom.');
    // Le lieu (et donc l'heure) sont FACULTATIFS — demande de Martin, 2026-08-23.
    // Si un lieu a été tapé mais pas choisi dans la liste, on le signale plutôt
    // que de l'ignorer en silence ; si le champ est resté vide, on continue sans.
    if ($('#f-lieu').value.trim() && !lieuChoisi) {
      return err('Choisis un lieu dans la liste — les homonymes sont fréquents. Ou vide le champ pour continuer sans.');
    }
    const nb = s => parseInt($(s).value, 10);
    const corps = {
      prenoms_nom: noms, nom_affiche: noms.join(' '),
      genre: $('#f-genre').dataset.genre || 'x',
      jour: nb('#f-jour'), mois: nb('#f-mois'), annee: nb('#f-annee'),
    };
    if (lieuChoisi) {
      corps.lieu_id = lieuChoisi.id;
      corps.heure = nb('#f-heure') || 0;
      corps.minute = nb('#f-minute') || 0;
    }
    if (!corps.jour || !corps.mois || !corps.annee) return err('La date est incomplète.');

    // Bêta fermée : le champ code n'existe que pour la création d'un PREMIER compte
    // (voir ouvrirFormulaire). S'il est là, on le joint — le serveur tranche (403 si faux).
    const codeEl = $('#f-code');
    if (codeEl) corps.code_invitation = codeEl.value.trim();

    const url = editionDe ? `/api/profil/${editionDe}` : '/api/profil';
    if (!editionDe) corps.id = noms.join('-').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const r = await (await fetch(url, {
      method: editionDe ? 'PUT' : 'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(corps),
    })).json();
    if (r.erreur) return err(T(r.erreur));
    // Un thème SECONDAIRE (créé alors qu'on est déjà connecté) n'a jamais son
    // propre mot de passe — c'est le compte qui l'a créé qui reste la seule
    // identité connectable (voir « proprietaire » posé côté serveur). Ne pas
    // confondre son nom avec celui du compte pour une future reconnexion.
    const nouveauCompte = !editionDe && !r.profil.proprietaire;
    profilId = r.profil.id;
    localStorage.setItem('align.profil', profilId);
    if (nouveauCompte) localStorage.setItem('align.nomAffiche', r.profil.nom_affiche || '');
    editionDe = null;
    // Un tout nouveau COMPTE n'a pas encore de mot de passe — l'inviter à en
    // choisir un tout de suite plutôt que de le laisser ouvert en silence.
    if (nouveauCompte) await vueChoisirMotDePasse(); else await demarrer();
  };
  const annuler = $('#f-annuler');
  if (annuler) annuler.onclick = () => { editionDe = null; montrer(profilId ? 'profils' : 'accueil'); };
}

function htmlUnivers(u, anneePerso) {
  /* Le croisement du monde et de toi. On montre les deux nombres côte à côte
     (le monde en tant, toi en tant), le climat collectif, puis l'écart
     constant qui te sépare de ton époque — le même toute ta vie. */
  if (!u) return '';
  let h = `<div class="section univers"><h4>L'année du monde</h4>`;
  h += `<p class="univers-nombres">Le monde est en année <b>${u.universelle}</b>`
     + `${u.en_un_mot ? ' · ' + T(u.en_un_mot) : ''}.`
     + `${anneePerso != null ? ` Toi, tu es en année <b>${anneePerso}</b>.` : ''}</p>`;
  if (u.climat) h += `<p>${T(u.climat)}</p>`;
  if (u.titre || u.texte) {
    h += `<h4 style="margin-top:18px">${T(u.titre || 'Ton décalage')}</h4>`;
    if (u.texte) h += `<p>${T(u.texte)}</p>`;
  }
  h += `</div>`;
  return h;
}
function ouvrirDetail({surtitre, titre, motcle, resume, intro, detail, court, extra, avant}) {
  /* Le panneau est opaque : le clic « à côté » pour fermer n'existe plus.
     Deux sorties explicites — la croix en haut, un retour en bas — pour ne
     pas piéger le lecteur au terme de 1 200 mots. */
  let html = `<div class="panneau-haut">
      <div class="detail-nombre">${T(surtitre || '')}</div>
      <button class="fermer" id="d-fermer">✕</button>
    </div>
    <h2 class="detail-titre">${T(motcle || titre)}</h2>
    ${motcle && titre !== motcle ? `<div class="detail-nombre">${T(titre)}</div>` : ''}
    ${intro ? `<p class="quoi" style="margin:2px 0 10px">${T(intro)}</p>` : ''}
    ${resume ? `<p class="detail-resume">${T(resume)}</p>` : ''}
    ${avant || ''}`;

  for (const [cle, libelle] of ORDRE_DETAIL) {
    const t = detail?.[cle];
    if (!t) continue;
    html += `<div class="section"><h4>${libelle}</h4><p>${T(t)}</p></div>`;
  }

  // le texte court garde sa place : il dit autre chose, plus ramassé
  if (court) {
    for (const [cle, libelle] of [['anime','Ce qui pousse'], ['alimenter',"Comment l'alimenter"],
                                  ['contrarie',"Quand ce n'est pas alimenté"],
                                  ['conditionnement','Le schéma']]) {
      if (court[cle]) html += `<div class="section"><h4>${libelle}</h4><p>${T(court[cle])}</p></div>`;
    }
  }
  if (extra) html += extra;

  // l'honnêteté d'Align, mise en valeur plutôt que planquée en bas
  const doux = detail?.si_tu_ne_te_reconnais_pas;
  if (doux) {
    html += `<div class="section douce"><h4>Et si tu ne t'y reconnais pas ?</h4><p>${T(doux)}</p></div>`;
  }
  if (!detail && !court) {
    html += `<div class="trou">Le texte détaillé n'est pas encore écrit pour cette entrée.
      Le corpus est en construction — l'app le dit plutôt que de faire semblant.</div>`;
  }

  html += `<button class="bouton discret" id="d-retour" style="margin-top:30px">← Revenir</button>`;

  $('#panneau').innerHTML = html;
  $('#voile').classList.remove('cacher');
  $('#voile').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  $('#d-fermer').onclick = fermerDetail;
  $('#d-retour').onclick = fermerDetail;
  // déplier un lien d'aspect au clic (délégation sur le panneau)
  $('#panneau').querySelectorAll('.lien[data-lien]').forEach(el => el.onclick = () => {
    const t = el.querySelector('.lien-texte');
    if (t) t.classList.toggle('cacher');
  });
  // toute vignette de carte incluse dans le panneau (via `extra`) se zoome au
  // clic — un seul geste, la même visionneuse que partout ailleurs dans l'app.
  $('#panneau').querySelectorAll('img.vignette-zoomable').forEach(img => {
    img.onclick = () => ouvrirLightbox(img.src,
      `${T(img.dataset.nom)}<span class="corr">côté ciel · ${T(img.dataset.signe)}</span>`);
  });
}
function fermerDetail() {
  $('#voile').classList.add('cacher');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fermerDetail(); fermerLightbox(); fermerAccueilJour(); fermerCartePlein(); } });

/* La visionneuse de carte : un clic sur une carte la montre en grand, en détail.
   Sert pour la carte de naissance (portrait), la carte de l'année et la carte
   du jour. Se ferme au clic sur le fond ou avec Échap. */
let fermetureLightboxEnCours = false;
function ouvrirLightbox(src, legende) {
  $('#lightbox-img').src = src;
  $('#lightbox-img').alt = (legende || '').replace(/<[^>]*>/g, '');
  $('#lightbox-leg').innerHTML = legende || '';
  const lb = $('#lightbox');
  lb.classList.remove('fermant');
  fermetureLightboxEnCours = false;
  lb.classList.add('ouvert');
  lb.setAttribute('aria-hidden', 'false');
}
function fermerLightbox() {
  const lb = $('#lightbox');
  if (!lb.classList.contains('ouvert') || fermetureLightboxEnCours) return;
  fermetureLightboxEnCours = true;
  lb.classList.add('fermant');
  // On retire `ouvert` (donc display:none) seulement APRÈS l'animation —
  // cf. la note CSS : l'overlay reste affiché 180 ms pour avaler le clic
  // fantôme post-touchend, et la fermeture est douce au lieu d'un clignotement.
  setTimeout(() => {
    lb.classList.remove('ouvert', 'fermant');
    lb.setAttribute('aria-hidden', 'true');
    $('#lightbox-img').src = '';
    fermetureLightboxEnCours = false;
  }, 180);
}
/* Clic ou toucher n'importe où dans la lightbox ferme — y compris sur
   l'image elle-même (« recliquer sur la carte zoomée » pour la réduire),
   à côté du bouton × et de l'Escape. `lb.contains(e.target)` protège du
   clic sur la vignette qui ouvre : si la cible est HORS de la lightbox
   (la vignette, dans le document), on ne ferme pas. */
document.addEventListener('click', e => {
  const lb = $('#lightbox');
  if (lb && lb.classList.contains('ouvert') && lb.contains(e.target))
    fermerLightbox();
});
document.addEventListener('touchend', e => {
  const lb = $('#lightbox');
  if (lb && lb.classList.contains('ouvert') && lb.contains(e.target))
    fermerLightbox();
});

/* ═══ L'ÉCRAN D'ACCUEIL DU JOUR ═══
   La carte « Aujourd'hui » seule, montrée UNE FOIS PAR JOUR à la première
   ouverture. Le contenu est rempli par chargerJour() (data-jour = la date du
   message). On ne montre que si : le message existe, et ce jour-là n'a pas
   déjà été vu (localStorage). Touche n'importe où → fermeture animée, la vue
   Jour (déjà chargée dessous) reste en place. */
const CLE_ACCUEIL_VU = 'trame.accueil.vu';
// ⚠️ TEMPORAIRE — mode test demandé par Martin (2026-08-22) : afficher la carte
// « Aujourd'hui » à CHAQUE chargement, même si déjà vue dans la journée, pour
// pouvoir vérifier le rendu sans vider le localStorage à la main. Repasser ce
// flag à false pour rétablir le comportement d'origine (une fois par jour).
const ACCUEIL_TEST_TOUJOURS = true;
let fermetureAccueilEnCours = false;

// De 20h à 3h du matin (heure locale de l'appareil, pas un fuseau serveur —
// c'est le moment où LA PERSONNE ouvre l'app qui compte), l'écran d'accueil
// montre « À méditer » plutôt que « Aujourd'hui » : demande de Martin
// (2026-08-27), pour clore la journée sur une pensée plutôt que de rouvrir
// le message du matin, déjà lu. La fenêtre traverse minuit — Martin l'a
// voulue ainsi : quelqu'un qui ouvre l'app à 1h ou 2h du matin (couché
// tard) vit encore « ce soir-là », pas déjà le lendemain. Voir chargerJour()
// pour la construction du contenu.
function estSoir() {
  const h = new Date().getHours();
  return h >= 20 || h < 3;
}

// La clé « déjà vu » distingue maintenant JOUR et SOIR (date + période) : les
// deux cartes d'accueil sont deux moments distincts, chacun montré une fois —
// avoir déjà vu « Aujourd'hui » le matin ne doit pas bloquer « À méditer » le
// soir. `carteAccueil.dataset.periode` est posé par chargerJour().
function cleAccueil(carte) {
  return carte.dataset.jour + '-' + (carte.dataset.periode || 'jour');
}

function montrerAccueilJour(force) {
  const acc = $('#accueil-jour');
  const carte = $('#accueil-jour .accueil-carte');
  const jour = carte && carte.dataset.jour;
  if (!jour) return false;                            // rien d'écrit pour ce moment
  // `force` (clic sur un rappel « message du jour ») rouvre même si déjà vu.
  if (!force && !ACCUEIL_TEST_TOUJOURS && localStorage.getItem(CLE_ACCUEIL_VU) === cleAccueil(carte)) return false;  // déjà vu
  fermetureAccueilEnCours = false;
  acc.classList.remove('fermant');
  acc.classList.add('ouvert');
  acc.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';            // pas de scroll derrière
  return true;
}

function fermerAccueilJour() {
  const acc = $('#accueil-jour');
  if (!acc.classList.contains('ouvert') || fermetureAccueilEnCours) return;
  fermetureAccueilEnCours = true;
  const carte = $('#accueil-jour .accueil-carte');
  if (carte && carte.dataset.jour) localStorage.setItem(CLE_ACCUEIL_VU, cleAccueil(carte));
  acc.classList.add('fermant');
  // Dès que l'écran COMMENCE à se refermer (encore opaque, en train de
  // (Révélation différée du fond/header : annulée 2026-08-27 après le retour
  // de Martin — revenu au comportement simple, header toujours visible. Voir
  // precharger_fonds.)
  // On retire `ouvert` après l'animation (même logique que la lightbox : ça
  // absorbe le clic fantôme post-touchend et rend la sortie douce).
  const fini = () => {
    acc.classList.remove('ouvert', 'fermant');
    acc.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    fermetureAccueilEnCours = false;
  };
  const reduit = matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(fini, reduit ? 200 : 720);  // doit couvrir le fondu .7s (voir .accueil-jour)
}

/* Délégation au niveau document (comme la lightbox) : ce script s'exécute
   AVANT que #accueil-jour existe dans le DOM (l'élément est plus bas dans le
   body), donc on n'attache pas directement dessus — sinon null.addEventListener
   planterait tout le script. On filtre par `closest('#accueil-jour')`. */
document.addEventListener('click', e => {
  const acc = $('#accueil-jour');
  if (acc && acc.classList.contains('ouvert') && e.target.closest('#accueil-jour'))
    fermerAccueilJour();
});
document.addEventListener('touchend', e => {
  const acc = $('#accueil-jour');
  if (acc && acc.classList.contains('ouvert') && e.target.closest('#accueil-jour')) {
    e.preventDefault();
    fermerAccueilJour();
  }
});

/* ═══════════════════════════════════════════════════════════
   VUE PLEIN ÉCRAN D'UNE CARTE DU JOUR (2e clic sur une carte déjà
   retournée) — même mode que l'accueil du jour (#carte-plein partage sa
   classe .accueil-jour : même fond métier à tisser + voile, même animation).
   ═══════════════════════════════════════════════════════════ */
let fermetureCartePleinEnCours = false;

function ouvrirCartePlein(zone) {
  const vue = $('#carte-plein');
  const img = $('#carte-plein-img');
  /* Flash de la carte précédente : le navigateur garde l'ancien bitmap affiché
     tant que la nouvelle image n'est pas décodée, donc on la masque au
     changement et on la réveille une fois chargée (ou en erreur — on ne la
     laisse jamais invisible en silence). */
  img.classList.add('img-chargement');
  img.onload = () => img.classList.remove('img-chargement');
  img.onerror = () => img.classList.remove('img-chargement');
  img.src = zone.dataset.src;
  if (img.complete) img.classList.remove('img-chargement'); // déjà en cache
  img.alt = zone.dataset.nom;
  $('#carte-plein-nom').textContent = zone.dataset.nom;
  $('#carte-plein-invitation').textContent = zone.dataset.invitation || '';
  fermetureCartePleinEnCours = false;
  vue.classList.remove('fermant');
  vue.classList.add('ouvert');
  vue.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  // Dès qu'on ouvre la carte en plein écran, elle est « consultée » : à la
  // fermeture, on la revoit DÉVOILÉE en petit dans le fil, plus un dos vierge
  // (Martin, 2026-08-27).
  zone.classList.add('revelee');
  $('#carte-plein-fermer').onclick = fermerCartePlein;
}

function fermerCartePlein() {
  const vue = $('#carte-plein');
  if (!vue.classList.contains('ouvert') || fermetureCartePleinEnCours) return;
  fermetureCartePleinEnCours = true;
  vue.classList.add('fermant');
  const fini = () => {
    vue.classList.remove('ouvert', 'fermant');
    vue.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    fermetureCartePleinEnCours = false;
    // Le texte n'existe qu'ici, jamais en ligne — pas de retour à faire sur la
    // zone d'origine : elle est déjà réduite à l'image seule (voir ligneCarte).
  };
  const reduit = matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(fini, reduit ? 200 : 720);  // doit couvrir le fondu .7s (voir .accueil-jour)
}

// Fermer en cliquant la carte/le texte a été retiré (Martin, 2026-08-29) :
// ça sortait du plein écran quand on essayait juste de faire défiler un texte
// trop long. Seuls le fond (hors .carte-plein-corps) ou le ✕ ferment
// maintenant — même patron que angle-plein ci-dessous.
document.addEventListener('click', e => {
  const vue = $('#carte-plein');
  if (vue && vue.classList.contains('ouvert') && e.target.closest('#carte-plein')
      && !e.target.closest('.carte-plein-corps'))
    fermerCartePlein();
});
document.addEventListener('touchend', e => {
  const vue = $('#carte-plein');
  if (vue && vue.classList.contains('ouvert') && e.target.closest('#carte-plein')
      && !e.target.closest('.carte-plein-corps')) {
    e.preventDefault();
    fermerCartePlein();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fermerCartePlein();
});

/* ═══════════════════════════════════════════════════════════
   VUE PLEIN ÉCRAN D'UN ANGLE DU JOUR (contenu texte — Ce qui domine, La
   Lune, Nuance, Le fil du jour, les domaines) : même mode que carte-plein
   (fond métier à tisser + voile + animation, classe .accueil-jour
   partagée), mais le contenu est interactif (aide, tout-lire) — donc un
   bouton Fermer explicite, et « clique pour fermer » actif SEULEMENT sur le
   fond (hors du panneau opaque), jamais sur le contenu lui-même.
   ═══════════════════════════════════════════════════════════ */
let fermetureAnglePleinEnCours = false;

function ouvrirAnglePlein(titre, corpsHTML) {
  const vue = $('#angle-plein');
  $('#angle-plein-titre').textContent = titre;
  $('#angle-plein-corps').innerHTML = corpsHTML;
  fermetureAnglePleinEnCours = false;
  vue.classList.remove('fermant');
  vue.classList.add('ouvert');
  vue.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  $('#angle-plein-fermer').onclick = fermerAnglePlein;
}

function fermerAnglePlein() {
  const vue = $('#angle-plein');
  if (!vue.classList.contains('ouvert') || fermetureAnglePleinEnCours) return;
  fermetureAnglePleinEnCours = true;
  vue.classList.add('fermant');
  const fini = () => {
    vue.classList.remove('ouvert', 'fermant');
    vue.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    fermetureAnglePleinEnCours = false;
  };
  const reduit = matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(fini, reduit ? 200 : 720);  // doit couvrir le fondu .7s (voir .accueil-jour)
}

// Contrairement à carte-plein (contenu pur affichage), ici SEUL un clic sur
// le fond (hors du panneau opaque .angle-plein-corps) ferme — sinon cliquer
// une « aide » ou « tout lire → » à l'intérieur fermerait la vue au passage.
document.addEventListener('click', e => {
  const vue = $('#angle-plein');
  if (vue && vue.classList.contains('ouvert') && e.target.closest('#angle-plein')
      && !e.target.closest('.angle-plein-corps'))
    fermerAnglePlein();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fermerAnglePlein();
});

/* ═══════════════════════════════════════════════════════════
   LE JOURNAL — un petit espace perso pour écrire, ouvert dans LE MÊME plein
   écran que les angles du jour (#angle-plein, ouvrirAnglePlein/fermerAnglePlein
   ci-dessus) : c'est déjà le geste « contempler un objet seul », le journal en
   est un de plus, pas une raison d'inventer un second mécanisme d'overlay.
   Accessible de deux façons : le crayon à côté de chaque « En action »
   (blocGeste, plus haut) et un lien « Écrire » sur Le jour. Zéro corpus, zéro
   calcul — juste des notes horodatées, voir /api/journal côté serveur. */
function formaterDateJournal(iso) {
  const d = new Date(iso);
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()} · ${h}h${m}`;
}

function rangeeJournal(e) {
  return `<div class="journal-entree">
    <div class="journal-entree-tete">
      <span class="journal-date">${formaterDateJournal(e.cree_le)}</span>
      <button type="button" class="journal-suppr" id="journal-suppr-${e.id}"
        title="Supprimer" aria-label="Supprimer cette note">✕</button>
    </div>
    <p class="journal-texte-lu">${T(e.texte)}</p>
  </div>`;
}

async function chargerEntreesJournal() {
  const liste = $('#journal-liste');
  if (!liste) return;
  const entrees = await (await fetch(`/api/journal/${profilId}`)).json();
  liste.innerHTML = entrees.length
    ? entrees.map(rangeeJournal).join('')
    : `<p class="quoi">Rien pour l'instant — le premier mot t'attend.</p>`;
  entrees.forEach(e => {
    const bouton = document.getElementById(`journal-suppr-${e.id}`);
    if (bouton) bouton.onclick = () => supprimerEntreeJournal(e.id);
  });
}

async function ajouterEntreeJournal() {
  const champ = $('#journal-texte');
  const texte = champ.value.trim();
  if (!texte) return;
  const bouton = $('#journal-ajouter');
  bouton.disabled = true;
  try {
    const r = await (await fetch(`/api/journal/${profilId}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({texte}),
    })).json();
    if (r.erreur) { alert(r.erreur); return; }
    champ.value = '';
    await chargerEntreesJournal();
  } finally {
    bouton.disabled = false;
  }
}

async function supprimerEntreeJournal(id) {
  if (!confirm('Supprimer cette note ?')) return;
  await fetch(`/api/journal/${profilId}/${id}`, {method: 'DELETE'});
  await chargerEntreesJournal();
}

function ouvrirJournal() {
  ouvrirAnglePlein('Ton journal', `
    <div class="journal-compose">
      <textarea id="journal-texte" placeholder="Écris ce qui te passe par la tête…"></textarea>
      <button class="bouton" id="journal-ajouter">Ajouter au journal</button>
    </div>
    <div id="journal-liste" class="journal-liste"><p class="quoi">Chargement…</p></div>`);
  $('#journal-ajouter').onclick = ajouterEntreeJournal;
  chargerEntreesJournal();
}

/* Une carte cliquable d'angle du jour : même bloc .pont que partout
   ailleurs (icône + titre + résumé), mais un clic ouvre le PLEIN ÉCRAN
   (titre + corps complet) au lieu de déplier un tiroir. */
function angleCarte({nom, resume, ico, corpsHTML}) {
  const id = 'ac-' + Math.random().toString(36).slice(2, 9);
  // Le plein écran doit montrer le message PRINCIPAL (resume, déjà visible
  // sur la tuile repliée) en plus des détails (corpsHTML, jusque-là
  // invisibles avant le clic) — sinon on perd le message en l'ouvrant.
  const corpsComplet = `${resume ? `<div class="miroir" style="font-size:19px;margin-bottom:18px">${resume}</div>` : ''}${corpsHTML}`;
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) el.onclick = () => ouvrirAnglePlein(nom, corpsComplet);
  }, 0);
  // Même rangée qu'un tiroir (padding, typo, hover) — clique = plein écran
  // au lieu d'un dépli inline. Se mêle donc sans couture à des tiroirs dans
  // le même groupe (voir « Explorer », chargerJour). Les tiroirs imbriqués
  // dans corpsHTML (ex. « Dans le ciel ») ne deviennent visibles/dépliables
  // qu'une fois là — jamais avant, dans la liste principale.
  return `<div class="rangee-angle" id="${id}">
    ${ico ? `<span class="tiroir-ico">${ico}</span>` : ''}
    <span class="tete">
      <span class="tiroir-nom">${T(nom)}</span>
      ${resume ? `<span class="tiroir-resume compact">${resume}</span>` : ''}
    </span>
    <span class="glyphe-plein" aria-hidden="true">⤢</span>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   LE JOUR
   ═══════════════════════════════════════════════════════════ */
/* Le libellé de l'action du jour. « En action » et non « le geste » : Le Geste
   est déjà une position numérologique d'Align (lexique) — un même mot ne peut
   pas nommer deux choses. « En action », c'est le passage à l'acte du miroir :
   l'observation du matin devient une action le soir. Changer de mot = changer
   cette constante.
   Le miroir (l'observation du jour) n'a plus de libellé : le texte se lit seul. */
const LBL_ACTION = 'En action';

/* Le trait du crayon du journal — même grammaire monoligne que ICONES_NAV/
   ICONES_JOUR plus bas (icono() est défini après, mais tout le script est
   évalué avant qu'aucune fonction ne s'exécute réellement : la référence
   ci-dessous, dans blocGeste(), est donc sûre). */
const ICONE_CRAYON = `<path d="M4 20l0.9-4.1L15.6 5.5a1.8 1.8 0 0 1 2.5 0l0.5 0.5a1.8 1.8 0 0 1 0 2.5L8.2 19.1 4 20Z"/>
  <path d="M13.7 7.3l3.1 3.1"/>`;

/* Le bloc « En action », PARTOUT où le corpus propose un geste (8 endroits :
   Aujourd'hui, Ce qui domine, la Lune, la phase, un domaine, le mois, l'année,
   la carte d'accueil). Un seul endroit pour ajouter le crayon du journal —
   discret, à côté du texte, jamais un bouton séparé qui surchargerait. */
function blocGeste(texte) {
  if (!texte) return '';
  return `<div class="geste"><strong>${LBL_ACTION} :</strong> ${T(texte)}
    <button type="button" class="crayon-journal" title="Écrire dans le journal"
      aria-label="Écrire dans le journal" onclick="event.stopPropagation(); ouvrirJournal();">${icono(ICONE_CRAYON, 14)}</button></div>`;
}

   (stroke:currentColor, pas de remplissage), un petit nœud doré ponctue
   certaines. Validées en maquette (MAQUETTE_ICONES.html) avant câblage ici.

  return `<svg viewBox="0 0 24 24" width="${taille}" height="${taille}" fill="none" stroke="currentColor"

}
