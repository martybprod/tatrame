<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Équivalent Android/Chrome de la balise Apple ci-dessus (Martin,
     2026-08-28 : « ça marche sur Safari, pas sur Android ») : sans elle,
     une icône lancée depuis l'écran d'accueil peut rouvrir un onglet avec
     barre d'adresse au lieu du mode standalone du manifest. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141110">
<!-- ⚠️ PIÈCE MANQUANTE (Martin, 2026-08-28 : « thème clair sur iPhone en
     thème clair système ») : les variables CSS ci-dessous fixent DÉJÀ les
     couleurs de l'app en sombre — mais sans cette balise, le NAVIGATEUR
     lui-même (pas l'app) continue de croire que la page supporte le clair,
     et applique SON PROPRE style clair aux zones qu'il contrôle : la zone de
     rebond du scroll (overscroll) en haut/bas sur iOS, les contrôles natifs
     (menus déroulants, etc.), et le tout premier pixel peint avant même que
     le CSS ne s'applique. `color-scheme` force le navigateur à traiter TOUTE
     la page comme sombre, indépendamment du réglage système. -->
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/ta-trame-icone-180.png">
<title>Ta Trame</title>
<style>
/* Align — sobre, chaud, sans kitsch ésotérique.
   Le ton visuel EST le positionnement : on n'est pas un oracle anxiogène.
   ⚠️ THÈME SOMBRE TOUJOURS, PAR DÉFAUT (Martin, 2026-08-26) : ne dépend plus
   de `prefers-color-scheme`. Sur un appareil réglé en thème clair système,
   les couleurs de l'app basculaient vers le jeu clair (fond de carte pâle
   au lieu de brun foncé, etc.) — non voulu, l'app n'a pas de bascule de
   thème manuelle et n'est pensée que pour le sombre (voile sur les images
   de fond, contrastes du bandeau…). Les valeurs sombres (ex-media query)
   sont maintenant les valeurs PAR DÉFAUT de :root, point final. Les
   anciennes valeurs claires ne sont plus utilisées nulle part — si un
   thème clair redevient souhaité un jour, ce sera une bascule volontaire
   (bouton + localStorage), pas une media query système subie. */
:root{
  --encre:#ece0bd; --encre2:#b3a68a; --encre3:#86795f;
  --papier:#141110; --papier2:#1e1a16; --bord:#372e1e;
  --accent:#d9b95c; --accent-doux:#e9d494;
  --resonance:#9db383; --tension:#dfa277; --neutre:#8a8078;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
/* Doublon volontaire de la balise <meta name="color-scheme"> du <head> —
   la propriété CSS ET la balise sont recommandées ensemble (la balise agit
   dès le tout premier paint, avant que ce <style> ne soit lu). Fond sur
   `html` (pas seulement `body`, déjà plus bas) : sans lui, la zone de rebond
   du scroll (overscroll) sur iOS pouvait flasher en blanc, la couleur par
   défaut du navigateur, avant que le fond de `body` ne prenne le relais. */
html{color-scheme:dark; background-color:var(--papier)}
/* Le fond de « Le jour » (et de toute la page) : une TUILE répétée
   (motif conçu pour se raccorder en boucle), pas une image unique recadrée
   en `cover` — Martin n'aimait plus le rendu précédent (2026-08-26).
   Largeur de tuile fixée en px (pas en %) : une taille de motif STABLE
   d'un appareil à l'autre, comme un vrai papier peint — en pourcentage, la
   densité du motif changerait du tout au tout entre mobile et bureau.
   Deux couches, chacune sa propre taille/répétition (l'ordre des valeurs
   suit l'ordre des images) : le dégradé COUVRE tout (`auto` = toute la
   boîte, jamais répété), la tuile, elle, se répète.
   ⚠️ POIDS (Martin, 2026-08-26 : « super longue à charger », surtout en
   web déployé) : la source livrée, metier2.png (1024×1024), pesait 1,9 Mo
   — un PNG compresse mal une texture bruitée (fils + étoiles), et ce poids,
   invisible tant qu'il ne chargeait qu'au clic (comme metierAtisser1.png,
   plein écran occasionnel), devient CRITIQUE sur un fond chargé à CHAQUE
   visite. Recompressée en metier2.webp, 720px (2× la taille d'affichage
   réelle de 360px — largement assez pour une texture, jamais un visuel
   net) : 127 Ko, contre 1 902 Ko pour l'original — 15× plus léger, sans
   perte visible. Format .webp : supporté par tous les navigateurs modernes
   ciblés par cette PWA, aucun repli nécessaire. Le fichier source
   (metier2.png) reste sur disque pour référence, mais n'est plus servi.
   → 2026-08-27 (1er remplacement) : fils_tendus.png (choix de Martin), tuile
   fils_tendus.webp, miroir vertical construit à partir d'une bande 1024×320
   (la photo, en éventail convergent vers la galaxie, n'avait aucune bande à
   raccord naturel simple — le miroir garantit une couture pixel-identique
   par construction).
   → 2026-08-27 (2e remplacement, même jour) : Martin a fourni une image
   PENSÉE pour le défilement continu — Ta-Trame-fond-defilement.png, déjà
   portrait (960×1728), fils verticaux PARALLÈLES (pas d'éventail) et galaxie
   centrée à 49 % de la hauteur, loin des bords.
   ⚠️ PIÈGE (Martin, 2026-08-27 : « une bande verticale complètement noire,
   pas de fil ») : le fichier source a une VRAIE marge quasi-noire native sur
   les bords gauche/droite (~85px/81px sur 960px) — la couture horizontale
   « brute » mesurait 1,28 (excellente !) mais c'était noir-contre-noir, pas
   une vraie continuité de motif : deux marges qui se rejoignent en tuile
   forment une bande morte deux fois plus large. Corrigé en RECADRANT ces
   marges avant tout traitement (crop 91→873, largeur 960→782), puis en
   traitant les DEUX raccords sur le vrai contenu (offset 50 % + fondu,
   vertical ET horizontal) : couture finale 4,45 (haut/bas) / 16,73
   (gauche/droite, plus dur à masquer que le vertical mais sans plus aucune
   zone vide). Recompressée fond-defilement.webp, 760×1680 (2× l'affichage
   380×840), 132 Ko contre 1 622 Ko pour le PNG source. Toujours vérifier
   qu'un bord d'image livrée n'a pas de marge morte AVANT de faire confiance
   à une mesure de couture basse — elle peut mentir (noir = noir).
   L'en-tête (.bandeau-marque, plus bas) N'EST PAS touché : sa propre image
   (trame-bandeau.jpg, déjà un JPEG léger) et sa propre
   `background-color:#141110` opaque le protègent déjà entièrement de ce
   qu'il y a dessous. */
/* ⚠️ PAS de background-color ici (retiré 2026-08-28) : tant que `html` n'avait
   pas de fond propre, celui de `body` était PROPAGÉ au canevas (règle CSS
   standard) — invisible, toujours derrière tout. Depuis que `html{background-
   color:...}` existe (plus haut, fix du flash blanc iOS), la propagation
   s'arrête : un fond ICI redeviendrait le fond RÉEL de la boîte `body`, qui se
   peint AU-DESSUS des couches à z-index négatif (#fond-app, .bandeau-marque)
   — les recouvrant entièrement, en permanence (vécu : fond/bandeau disparus
   partout dans l'app). Le fond de `html` suffit déjà, ne pas le dupliquer ici. */
body{
  color:var(--encre); font-family:var(--sans);
  line-height:1.62; -webkit-font-smoothing:antialiased;
  padding:0 20px env(safe-area-inset-bottom); min-height:100vh;
}
/* La tuile de fond vit sur une COUCHE fixe dédiée (#fond-app), pas sur `body`,
   pour pouvoir la faire ÉMERGER du noir en fondu au chargement (Martin,
   2026-08-27 : « des fondus pour l'affichage des images d'arrière-plan »). Un
   `background-image` sur body ne peut pas être fondu ; une couche à part, si.
   Fixe (couvre toujours le viewport), derrière tout (z-index -2, sous le
   bandeau à -1 et le contenu). Reste à opacity:0 jusqu'à ce que la tuile soit
   préchargée (voir precharger_fonds() côté JS), puis fond doucement. */
#fond-app{
  position:fixed; inset:0; z-index:-2;
  background-color:var(--papier);
  background-image:
    linear-gradient(to bottom,
      rgba(20,17,16,.62) 0%, rgba(20,17,16,.45) 55%, rgba(20,17,16,.62) 100%),
    url('/static/img/fond-defilement.webp');
  background-position:0 0, top left;
  /* Tuile 760×1680 (ratio ≈ 782:1728, portrait). Hauteur EXPLICITE (840px). */
  background-size:auto, 380px 840px;
  background-repeat:no-repeat, repeat;
  opacity:0; transition:opacity 1.6s ease;
}
#fond-app.chargee{opacity:1}
@media (prefers-reduced-motion:reduce){ #fond-app{transition-duration:.2s} }
.enveloppe{max-width:660px;margin:0 auto;padding:26px 0 90px}

/* Le bandeau — le métier à tisser cosmique. Descend maintenant DERRIÈRE
   le logo et la nav (hors du flux, z-index négatif) plutôt que de s'arrêter
   au-dessus : le dégradé continue de couler jusque sous les boutons, pour
   un fondu continu et doux, sans ajouter d'espace puisqu'il se superpose.
   Recadré sur le cœur doré du mandala (metierAtisser1.png, focal à
   x=564 y=488 sur 1024×1024). */
.bandeau-marque{
  position:absolute; top:0; left:0; right:0;
  height:200px; z-index:-1;
  background-color:#141110;
  /* Le dégradé fait DEUX choses à des rythmes différents : un voile sombre
     (rgba(20,17,16,…)) s'épaissit tôt pour garder le texte de l'en-tête
     lisible tout du long (texte clair fixe, voir plus bas) — puis, dès la
     barre d'onglets dépassée (~55 % de la hauteur), il redescend très
     graduellement, étiré sur presque toute la hauteur restante, jusqu'à
     var(--papier) à la toute limite inférieure de l'image. En mode sombre,
     papier == #141110 : la jonction est alors invisible. */
  background-image:
    linear-gradient(to bottom,
      rgba(20,17,16,0) 0%, rgba(20,17,16,.55) 45%,
      #141110 55%, var(--papier) 100%),
    url('/static/img/trame-bandeau.jpg');
  background-position:center 44%; background-size:cover; background-repeat:no-repeat;
  /* Émerge du noir en fondu à l'apparition (comme #fond-app) — le texte de
     l'en-tête, lui, est dans `header` au-dessus (z-index) et reste visible. */
  opacity:0; transition:opacity 1.6s ease;
}
.bandeau-marque.chargee{opacity:1}
@media (prefers-reduced-motion:reduce){ .bandeau-marque{transition-duration:.2s} }
/* La hauteur mobile (voir le media query plus bas) reste un peu plus
   généreuse qu'au bureau : « Les Règles » est sorti de #nav (icône seule,
   en haut à droite) et les 4 boutons restants passent en version compacte
   pour tenir sur UNE ligne, mais l'en-tête empile encore le logo et les
   outils du haut sur mobile (colonne, pas ligne), donc reste un peu plus
   haut qu'au bureau. */

/* en-tête — repose sur le bandeau, donc toujours en teintes claires fixes
   (celles du thème sombre, le seul thème de l'app) : le bandeau est une
   photo, son texte ne doit jamais s'inverser sous peine de devenir
   illisible, même si un thème clair devait revenir un jour. */
header{margin-bottom:26px; position:relative}
.rangee-haut{display:flex;align-items:center;justify-content:space-between;gap:14px}
.marque{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:24px;letter-spacing:.16em;font-weight:400;color:#ece0bd}
.marque-ico{flex:none;color:#e9d494}
.marque-texte::after{content:'';display:block;width:24px;height:1px;background:#e9d494;margin-top:6px}
/* La barre d'onglets — BANDE OPAQUE plein écran (Martin, 2026-08-26).
   L'image du bandeau (hauteur FIXE, 230/260px) et le fond de page en tuile
   (voile semi-transparent partout, jamais 100% opaque) ne couvrent, à eux
   deux, JAMAIS toute la hauteur réelle du header — sur mobile surtout, le
   logo et le sélecteur de profil s'empilent en colonne et dépassent
   largement la hauteur du bandeau. La nav retombait donc SUR le motif de
   fond, jamais sur du noir plein : « tout est dans l'image ».
   Plutôt qu'une bande de hauteur FIXE en px ajoutée au fond de page
   (fragile — un nombre à deviner, qui casse dès que le header change de
   hauteur : nom de profil plus long, police système agrandie…), la nav
   porte SON PROPRE fond opaque. La bande s'ajuste donc AUTOMATIQUEMENT à
   la hauteur réelle du header, quel que soit son contenu — jamais besoin
   de recalculer un chiffre.
   Étirée d'un bord à l'autre de l'écran (« full-bleed » : marges négatives
   égales à l'écart entre la largeur du viewport et celle du parent
   contraint .enveloppe, 660px), pas seulement la largeur du contenu —
   `overflow-x:hidden` sur html/body (déjà en place) protège contre tout
   débordement d'arrondi. Transition NETTE (demande de Martin) : le
   padding-top interne remplace l'ancien margin-top externe, pour que le
   fond opaque commence collé au contenu du dessus, sans zone transparente
   intermédiaire. */
nav{
  display:flex; gap:2px; flex-wrap:wrap;
  background:var(--papier);
  width:auto; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
  padding:14px 20px 10px;
}
nav button{
  background:none;border:0;font:inherit;font-size:13px;color:#b3a68a;
  padding:7px 11px;border-radius:8px;cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:6px;
}
nav button .ico{flex:none;opacity:.85}
nav button:hover{color:#e9d494;background:rgba(255,255,255,.08)}
nav button.actif{color:#f4ecd8;background:rgba(255,255,255,.12)}

/* ═══ La barre d'outils de l'en-tête (refonte 2026-08-27) ═══
   Les TROIS outils — Règles, Commentaire, Profil — partagent UNE seule famille
   de pastille (`.outil`), au lieu de deux icônes nues orphelines + une grosse
   pilule dorée qui écrasait le titre. Objectif (Fiche 1 du guide UX) : le titre
   reste le seul pic ; les outils forment un groupe discret, aligné, dés-accentué.
   Teintes fixes claires (repose sur la photo, ne s'inverse pas avec le thème). */
.outils-haut{display:flex;align-items:center;gap:8px}
.outil{
  position:relative;
  display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  border-radius:17px;color:#cdbf9a;font:inherit;font-size:13px;cursor:pointer;
  white-space:nowrap;transition:.15s;
}
.outil.ico-seule{width:34px;padding:0;justify-content:center}   /* Règles, Commentaire */
/* Taille uniforme des 3 icônes (Règles 19, Commentaire 18, Profil 17 à
   l'injection) : on force 17 ici pour qu'elles pèsent pareil dans le groupe. */
.outil .ico{flex:none;width:17px;height:17px}
.outil .fleche{font-size:9px;color:var(--encre3);margin-left:1px}
.outil:hover, .outil:focus-visible{
  color:#f4ecd8;border-color:var(--accent-doux);background:rgba(255,255,255,.1);
}
/* Le nom de l'outil-icône (Règles, Commentaire) au survol/focus clavier —
   inchangé dans son principe, juste rattaché à `.outil` plutôt qu'au bouton. */
.etiquette-survol{
  position:absolute; top:100%; right:0; margin-top:8px;
  font-size:12px; white-space:nowrap; background:#141110; color:#f4ecd8;
  border:1px solid rgba(255,255,255,.15); border-radius:6px; padding:4px 10px;
  opacity:0; transform:translateY(-4px); pointer-events:none; transition:.15s;
}
.outil:hover .etiquette-survol, .outil:focus-visible .etiquette-survol{
  opacity:1; transform:translateY(0);
}

/* blocs */
.carte{
  background:var(--papier2);border:1px solid var(--bord);border-radius:var(--r);
  padding:24px;margin-bottom:14px;
}
.chapo{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--encre3);margin-bottom:12px}
/* L'icône de chapô : trait net (opacity:1), jamais translucide — à 11-15px, un
   trait fin déjà + la transparence rend les motifs (ex. les deux mains de
   « Rappels du jour ») illisibles (retour Martin 2026-08-27). Reste secondaire
   par la taille, pas par l'opacité. */
.chapo-ico{display:inline-flex;vertical-align:-2px;margin-right:7px;color:var(--accent-doux);opacity:1}
.miroir{font-family:var(--serif);font-size:21px;line-height:1.5;margin-bottom:18px}
.geste{border-left:2px solid var(--accent-doux);padding-left:16px;color:var(--encre2);font-size:15px}
.geste strong{color:var(--encre);font-weight:600}
.crayon-journal{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;margin-left:6px;vertical-align:-5px;
  border:0;background:none;padding:0;border-radius:50%;
  color:var(--encre3);opacity:.6;cursor:pointer;
  transition:opacity .15s,color .15s,background-color .15s;
}
.crayon-journal:hover,.crayon-journal:focus-visible{opacity:1;color:var(--accent);background:var(--papier2)}

/* ═══ JOURNAL — ouvert dans #angle-plein (voir plus bas), même carte papier2
   que tout le reste. Rien de plus qu'une liste + un textarea. ═══ */
.journal-compose{margin-bottom:22px}
.journal-compose textarea{margin-bottom:0}
.journal-liste{display:flex;flex-direction:column;gap:14px}
.journal-entree{border-top:1px solid var(--bord);padding-top:14px}
.journal-entree:first-child{border-top:0;padding-top:0}
.journal-entree-tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.journal-date{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--encre3)}
.journal-texte-lu{font-family:var(--serif);font-size:16px;line-height:1.55;white-space:pre-wrap}
.journal-suppr{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border:0;background:none;padding:0;border-radius:50%;
  color:var(--encre3);opacity:.5;cursor:pointer;font-size:12px;line-height:1;flex:none;
  transition:opacity .15s,color .15s,background-color .15s;
}
.journal-suppr:hover,.journal-suppr:focus-visible{opacity:1;color:var(--tension);background:var(--papier2)}

.entete-jour{text-align:center;padding:6px 0 22px}
.date{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--encre3)}
.lune{font-family:var(--serif);font-size:15px;color:var(--encre2);margin-top:7px}

/* pastilles d'état */
.etat{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.09em}
.etat::before{content:'';width:6px;height:6px;border-radius:50%}
.etat.resonance{color:var(--resonance)} .etat.resonance::before{background:var(--resonance)}
.etat.tension{color:var(--tension)} .etat.tension::before{background:var(--tension)}
.etat.neutre{color:var(--neutre)} .etat.neutre::before{background:var(--neutre)}

/* Capture du tuto « Sur l'écran d'accueil » (ouvrirTutoAjoutEcranAccueil) :
   contrainte en HAUTEUR (dvh, pas en largeur) — ce sont des captures très
   hautes (portrait plein écran), une largeur seule les ferait déborder et
   exiger un scroll (Martin, 2026-08-28 : « il est impératif que l'on voit
   l'image au complet »). `max-width:100%` + `height:auto` PRÉSERVENT le
   ratio ensemble (jamais de déformation, jamais coupée) — le plus petit des
   deux plafonds (largeur de la carte ou 46dvh) gagne. Contour vert franc
   (#00fa00, prélevé sur les cercles d'annotation des captures elles-mêmes) :
   signale « ceci est un tuto, pas encore l'app » (demande de Martin). */
.tuto-pwa-img{
  display:block; margin:0 auto 16px;
  max-width:100%; max-height:46dvh; width:auto; height:auto;
  border-radius:12px; border:1px solid var(--bord);
}
/* Cadre volontairement SOBRE (1px, var(--bord)) et non plus le vert vif des
   annotations : le vert cadrait la capture comme un réglage Safari actif —
   confus à côté des vrais réglages montrés DANS l'image (Martin, 2026-08-28).
   Les repères verts DANS les captures restent : ce sont eux qui indiquent où
   toucher. */
.tuto-pwa-img.cacher{display:none}
/* Navigation du tuto : petits boutons ronds icon-only, ÉTEINTS (jamais
   cachés) aux bornes — la rangée ne bouge pas d'une étape à l'autre. */
.tuto-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.tuto-nav-b{
  display:inline-flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);
  background:var(--papier);color:var(--encre2);cursor:pointer;
}
.tuto-nav-b:hover{color:var(--encre);border-color:var(--accent-doux)}
.tuto-nav-b.inactif{opacity:.35;pointer-events:none}

/* un nombre — cliquable, JAMAIS nu */
.nombre{
  display:flex;align-items:flex-start;gap:16px;padding:16px;margin:0 -16px;
  border-radius:10px;cursor:pointer;transition:.15s;
  border-bottom:1px solid var(--bord);
}
.nombre:last-of-type{border-bottom:0}
.nombre:hover{background:var(--papier)}
.nombre .val{font-family:var(--serif);font-size:32px;min-width:46px;color:var(--accent);line-height:1.1}
.nombre .nom{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--encre3)}
.nombre .motcle{font-family:var(--serif);font-size:19px;color:var(--encre);margin:2px 0 4px}
.nombre .txt{font-size:13px;color:var(--encre2)}
.nombre .plus{color:var(--encre3);font-size:11px;align-self:center;white-space:nowrap}
.heritage{
  display:inline-block;font-size:11px;color:var(--encre2);background:var(--papier);
  border:1px solid var(--bord);border-radius:20px;padding:2px 10px;margin:4px 4px 0 0;
  text-transform:none;letter-spacing:0;
}

/* les tuiles de l'aperçu — tout le thème en un écran, rien de nu */
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
.tuile{
  background:var(--papier);border:1px solid var(--bord);border-radius:10px;
  padding:13px;transition:.15s;
}
.tuile[data-va]{cursor:pointer}
.tuile[data-va]:hover{border-color:var(--accent-doux)}
.tuile-haut{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--encre3)}
.tuile-gros{font-family:var(--serif);font-size:22px;color:var(--encre);margin:4px 0 2px;line-height:1.15}
.tuile-bas{font-size:12px;color:var(--encre2);line-height:1.35}
.anneau-cycle{display:block;margin:2px auto 4px}
.anneau-cycle-chiffre{font-family:var(--serif);font-size:20px;fill:var(--encre)}

/* le trio — l'essentiel en trois traits, cliquables */
.trio-bloc{
  flex:1;min-width:110px;background:var(--papier);border:1px solid var(--bord);
  border-radius:10px;padding:14px;cursor:pointer;transition:.15s;
}
.trio-bloc:hover{border-color:var(--accent-doux)}
.trio-nom{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--encre3)}
.trio-signe{font-family:var(--serif);font-size:21px;color:var(--encre);margin:3px 0}
.trio-quoi{font-size:12px;color:var(--encre2);line-height:1.4}
.trio-glyphe{display:flex;justify-content:center;color:var(--accent-doux);opacity:.85;margin:3px 0 1px}
.signe-ico{display:inline-flex;align-items:center;vertical-align:middle;color:var(--accent-doux);opacity:.85;flex:none}

/* La tuile « Ta carte » : la vignette ILLUSTRE l'arcane calculé, en accent.
   Sobriété : petit, encadré par --bord, sans la décoration criarde du jeu. */
.arcane{display:flex;align-items:center;gap:18px;text-align:left;padding:16px 0;cursor:pointer;border-radius:10px;transition:.15s}
.arcane:hover{background:var(--papier)}
.arcane .corps{flex:1;min-width:0}
.arcane .num{font-family:var(--serif);font-size:30px;color:var(--accent-doux);line-height:1}
.arcane .nom{font-family:var(--serif);font-size:21px;margin:4px 0 2px}
.arcane .corr{font-size:12px;color:var(--encre3)}
.vignette{width:56px;height:98px;object-fit:cover;border-radius:6px;border:1px solid var(--bord);flex:none;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:zoom-in}

/* La carte du jour affiche son DOS en grille ; le premier clic l'ouvre en
   PLEIN ÉCRAN (Martin, 2026-08-27). Une fois ouverte (.revelee), elle reste
   DÉVOILÉE en petit dans le fil — on revoit la carte déjà consultée, pas un
   dos vierge. Effet, pas oracle : la carte est CALCULÉE (date → arcane). */
.carte-jour{position:relative;display:inline-block;width:60px;height:105px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--bord);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.carte-jour img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s ease}
.carte-jour .face{opacity:0}
.carte-jour-zone.revelee .carte-jour .face{opacity:1}
.carte-jour-zone.revelee .carte-jour .dos{opacity:0}
.carte-jour-zone.revelee .carte-jour{cursor:zoom-in}
/* Les deux cartes côte à côte : chacune empile son image PUIS son texte
   (au lieu d'être côte à côte l'une dans l'autre), pour que la paire tienne
   sur une seule ligne même en mobile étroit. */
.carte-jour-paire{display:flex; gap:16px; align-items:flex-start}
.carte-jour-zone{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; cursor:pointer}
.carte-jour-zone .carte-jour{width:72px;height:126px}

/* La visionneuse : un clic sur une carte la montre en grand, en détail.
   Ouverte par ouvrirLightbox(), fermée par clic sur le fond ou Échap. */
.lightbox{position:fixed;inset:0;background:rgba(8,6,4,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:1100;padding:24px}
.lightbox.ouvert{display:flex}
/* L'animation de sortie n'est PAS qu'esthétique : la lightbox reste affichée
   pendant `lb-out` (180 ms), ce qui absorbe le « clic fantôme » du navigateur
   après un touchend — sinon, une fois l'overlay caché (display:none), ce clic
   synthétique retombe sur la carte du dessous et la re-zoome. */
.lightbox.ouvert{animation:lb-in .18s ease}
.lightbox.fermant{animation:lb-out .18s ease}
@keyframes lb-in{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:scale(1)}}
@keyframes lb-out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.965)}}
.lightbox img{max-width:86vw;max-height:80vh;border-radius:8px;border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 50px rgba(0,0,0,.6);cursor:pointer}
.lightbox-leg{color:#e8e0d4;font-family:var(--serif);font-size:19px;margin-top:18px;text-align:center;max-width:34ch}
.lightbox-leg .corr{display:block;font-family:var(--sans);font-size:11px;color:#b3a68a;margin-top:6px;text-transform:uppercase;letter-spacing:.12em}
.lightbox-fermer{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);border:0;color:#d4ccc0;font-size:22px;cursor:pointer;z-index:1110;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s;line-height:1}
.lightbox-fermer:hover{background:rgba(255,255,255,.2)}

/* ═══ L'ÉCRAN D'ACCUEIL DU JOUR ═══
   La carte « Aujourd'hui » seule, montrée une fois par jour à la première
   ouverture. Touche n'importe où → fondu, la vue Jour (déjà chargée dessous)
   apparaît. Mobile : plein écran. Bureau : grande carte centrée sur fond
   assombri (largeur contrainte, cf. .accueil-carte). */
.accueil-jour{
  /* TOUJOURS display:flex (jamais none) — voir le pavé « PREMIUM & DOUX »
     plus bas : c'est l'opacity + pointer-events qui cachent/désactivent,
     pas le display. `position:fixed` sort déjà l'élément du flux, donc le
     garder en flex en permanence ne coûte rien au reste de la page. */
  position:fixed; inset:0; z-index:1050; display:flex; cursor:pointer;
  flex-direction:column; align-items:center; justify-content:center;
  padding:28px; overflow:hidden;
  /* LARGEUR : `inset:0` (left:0 + right:0) cale déjà l'élément sur la largeur
     exacte du viewport. On NE met PAS `width:100vw` : sur mobile, 100vw peut
     dépasser la zone réellement visible de quelques pixels (il ignore certaines
     marges du navigateur), ce qui crée un débordement horizontal — l'app
     apparaît alors « zoomée » au démarrage, à recadrer à la main. Le bug était
     là. `inset:0` seul est correct.
     HAUTEUR : là, un vrai besoin — `inset:0` ne suffit pas toujours en mobile
     (la barre d'outils du navigateur rétrécit/agrandit la zone visible et
     laisse voir le fond derrière). 100dvh (hauteur DYNAMIQUE du viewport)
     referme l'écart ; 100vh reste en repli pour les navigateurs sans dvh. */
  height:100vh;
  height:100dvh;
  /* Le métier à tisser cosmique en fond de l'accueil du jour — la carte, elle,
     est opaque (papier), donc l'image est visible autour. Le voile sombre garde
     la carte lisible en toutes circonstances (même image, même logique que le
     bandeau-marque : la lecture passe avant l'ornement), ancrée sur le cœur
     doré du mandala (focal x=564 y=488 sur 1024×1024, le même que le bandeau).
     ⚠️ `background-size` en pourcentage UNIQUE (ex. 130%) ne fixe que la
     LARGEUR — la hauteur suit en `auto`, selon les proportions de l'image
     (carrée ici). Sur mobile (écran bien plus haut que large), l'image ne
     montait donc jamais assez pour couvrir tout l'écran, peu importe la
     hauteur du conteneur — vrai bug, pas un souci de viewport dynamique.
     `cover` est le seul réglage qui GARANTIT une couverture totale quel que
     soit le rapport largeur/hauteur de l'écran (il choisit lui-même le facteur
     d'agrandissement nécessaire, jamais moins).
     ⚠️ POIDS (Martin, 2026-08-26, même correctif que metier2.png) : la
     source PNG pesait 1 888 Ko — un PNG compresse mal ce type de texture.
     Recompressée en metierAtisser1.webp, MÊME résolution native 1024×1024
     (contrairement à metier2 : ici l'image couvre le plein écran en
     `cover`, donc étirée sur de grands moniteurs — réduire la résolution
     source aurait coûté de la netteté ; seul le format change) : 254 Ko,
     contre 1 888 Ko — 7,4× plus léger, sans perte visible. */
  background-image:
    linear-gradient(to bottom,
      rgba(20,17,16,.62) 0%, rgba(20,17,16,.45) 55%, rgba(20,17,16,.62) 100%),
    url('/static/img/metierAtisser1.webp');
  background-position:55% 48%; background-size:cover; background-repeat:no-repeat;
  padding-top:max(28px, env(safe-area-inset-top));
  padding-bottom:max(28px, env(safe-area-inset-bottom));
}
/* PREMIUM & DOUX (Martin, 2026-08-24 : « c'était glitchy »). Deux causes
   corrigées ensemble :
   1. `display:none→flex` ET `animation` démarraient dans la MÊME frame —
      le navigateur devait peindre le fond ET lancer l'animation d'un coup,
      d'où l'à-coup au premier rendu. Reste maintenant TOUJOURS display:flex
      (`position:fixed` le sort déjà du flux, aucun coût pour le reste de la
      page) ; `opacity` + `pointer-events` suffisent à cacher/désactiver.
   2. Une `@keyframes` SAUTE toujours à son `from{}`, même interrompue en
      cours de route (rouvrir pendant la fermeture papillote). Une
      `transition` interpole depuis l'état RÉEL courant — jamais de saut. */
.accueil-jour{
  opacity:0; pointer-events:none; will-change:opacity;
  /* Ralenti (0.38 → 0.7s, Martin 2026-08-27) : en fermant une carte plein
     écran, le fond « métier » se dissout doucement sur le fond de l'onglet —
     un vrai fondu entre deux images d'arrière-plan, plus un clignotement sec. */
  transition:opacity .7s cubic-bezier(.32,.72,0,1);
}
.accueil-jour.ouvert{opacity:1; pointer-events:auto}
.accueil-jour.fermant{transition-duration:.7s}
.accueil-carte{
  width:100%; max-width:560px;
  /* Centrage blindé : `margin:auto` centre sur les DEUX axes, indépendamment
     du flex parent — si align-items/justify-content venaient à être perdus
     ou surchargés, la carte reste centrée quoi qu'il arrive. */
  margin:auto;
  opacity:0; transform:translateY(14px) scale(.98); will-change:opacity, transform;
  /* Même durée que .accueil-jour (0.7s, Martin 2026-08-27) : la carte de
     texte et le fond « métier » doivent fondre EN PHASE — désynchronisés
     (0.38s vs 0.7s), ça se lisait comme un glitch. */
  transition:opacity .7s cubic-bezier(.32,.72,0,1),
             transform .7s cubic-bezier(.32,.72,0,1);
}
.accueil-jour.ouvert .accueil-carte{opacity:1; transform:none}
.accueil-jour.fermant .accueil-carte{
  opacity:0; transform:scale(1.02); transition-duration:.7s;
}
/* Le chapô, le miroir et « En action » réutilisent les styles existants
   (.chapo/.miroir/.geste) ; on grossit juste le miroir sur cet écran-là. */
.accueil-carte .chapo{margin-bottom:16px}
.accueil-carte .miroir{font-size:24px;line-height:1.55;margin-bottom:22px}
.accueil-carte .accueil-date{font-family:var(--serif);font-size:15px;color:var(--encre3);margin-bottom:20px}
.accueil-indice{
  position:absolute; bottom:max(22px, env(safe-area-inset-bottom));
  font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--encre3);
  opacity:0; animation:acc-indice 1s ease 1.1s forwards;
}
@keyframes acc-indice{to{opacity:.7}}
@media (max-width:480px){
  .accueil-carte .miroir{font-size:21px}
}
/* Respect du réglage système « animations réduites » : pas de glissement ni
   de zoom, juste une apparition/disparition franche mais courte. */
@media (prefers-reduced-motion:reduce){
  .accueil-jour, .accueil-jour.fermant,
  .accueil-carte, .accueil-jour.fermant .accueil-carte{
    transition-duration:.12s; transition-timing-function:linear;
  }
  .accueil-carte, .accueil-jour.fermant .accueil-carte{transform:none}
  .accueil-indice{animation-duration:.15s; animation-timing-function:linear}
}

/* ═══ FONDU D'ENTRÉE DES VUES (Martin, 2026-08-27 : « premium ») ═══
   Chaque vue (Le jour, Le ciel…) apparaît en fondu doux + légère montée,
   au lieu d'un « pop » sec. Ça masque la petite latence de mise en page et
   de chargement des images (cartes, fond) : le temps que le fondu joue, le
   contenu s'est posé. Même courbe que l'écran d'accueil, pour un geste
   cohérent. N'affecte PAS l'opacité des images de carte (le flip .face/.dos
   a sa propre transition d'opacité) : ici on anime le CONTENEUR de la vue,
   pas les images. Réappliqué à chaque `montrer()` via retrait/reflow/ajout
   de la classe. */
@keyframes vue-entre{ from{opacity:0} to{opacity:1} }
.vue-entre{animation:vue-entre .7s ease}

/* ═══ FONDU DES IMAGES AU CHARGEMENT (Martin, 2026-08-27) ═══
   Ce que Martin veut vraiment : que chaque image ÉMERGE du fond sombre au
   lieu de « popper ». L'image (ou, pour les cartes du jour, LE CONTENEUR)
   reste invisible tant qu'elle n'est pas chargée, puis apparaît en fondu.
   Comme le fond de l'app est déjà noir (#141110), invisible = fond noir :
   l'image se matérialise depuis le noir. Voir fondreImages() côté JS.
   ⚠️ Pour les cartes du jour on fond le CONTENEUR (.carte-jour), jamais les
   images .face/.dos — celles-ci gèrent déjà leur opacité pour le flip. */
.img-fondu{opacity:0; transition:opacity 1.6s ease}
.img-fondu.chargee{opacity:1}
@media (prefers-reduced-motion:reduce){
  .vue-entre{animation-duration:.12s}
  .img-fondu{transition-duration:.12s}
}

/* Vue plein écran d'une carte du jour (2e clic sur une carte déjà retournée) :
   RÉUTILISE la classe .accueil-jour (même fond métier à tisser + voile, même
   animation d'ouverture/fermeture) — « le même mode » demandé. #carte-plein
   est un id distinct, seul l'id change le comportement JS ; le fond vient
   entièrement du sélecteur de classe partagé. */
/* max-height + overflow-y : une invitation longue doit pouvoir défiler dans la
   carte plutôt que déborder hors de l'écran (Martin, 2026-08-29) — même
   recette que .angle-plein-corps plus bas. */
.carte-plein-corps{width:100%;max-width:420px;max-height:calc(100vh - 100px);overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:18px}
.carte-plein-corps img{width:100%;max-width:280px;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
/* Pendant l'échange d'image plein écran, l'image est masquée tant que la
   nouvelle n'est pas décodée : le navigateur garderait sinon l'ancien bitmap
   affiché, d'où un flash de la carte précédente (Martin, 2026-08-27). */
.carte-plein-corps img.img-chargement{opacity:0}
.carte-plein-corps .carte-plein-nom{font-family:var(--serif);font-size:22px;text-align:center}
.carte-plein-corps .carte-plein-invitation{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--encre2);text-align:center}
/* Angle du jour en plein écran : contenu texte (pas une carte image), donc
   pas centré/étroit comme carte-plein-corps — largeur normale, scrollable si
   long (le panneau .accueil-jour est overflow:hidden, mais SON contenu doit
   pouvoir défiler quand le texte + aide dépassent la hauteur d'écran). */
.angle-plein-corps{width:100%;max-width:560px;max-height:calc(100vh - 100px);overflow-y:auto}
.angle-plein-corps .chapo{margin-bottom:14px}
/* Bouton de fermeture rond — même patron que .lightbox-fermer (cohérence
   visuelle), positionné hors du panneau opaque pour rester à portée même
   quand le contenu défile (voir .angle-plein-corps overflow-y:auto). */
.angle-plein-fermer{
  position:absolute; top:max(16px, env(safe-area-inset-top));
  right:max(16px, env(safe-area-inset-right)); z-index:1110;
  width:40px;height:40px;border-radius:50%;border:0;
  background:rgba(255,255,255,.1);color:#d4ccc0;font-size:18px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.angle-plein-fermer:hover{background:rgba(255,255,255,.2)}
/* Les cartes cliquables des angles (remplacent les tiroirs <details> pour
   « Ce qui domine », « La Lune », « Nuance », le Fil du jour, les domaines) :
   même bloc .pont que partout ailleurs, juste rendu cliquable. */
.angle-carte{cursor:pointer}
.angle-carte .tete{display:flex;align-items:center;gap:10px}

.pont{background:var(--papier);border:1px solid var(--bord);border-radius:10px;padding:16px;margin-top:14px;font-size:14px;color:var(--encre2)}
/* La paire de cartes du jour, exception au fond ET au contour de .pont :
   fond aligné sur le conteneur parent (.jour-groupe, --papier2) au lieu de
   --papier (nettement plus foncé en thème sombre) — deux bruns superposés
   juste derrière les cartes faisaient une boîte dans la boîte (Martin,
   2026-08-24). Le contour de .pont (1px var(--bord)) restait visible même
   fond unifié — retiré ici pour que le rectangle se fonde complètement dans
   .jour-groupe (Martin : « uniformiser le tout »). Sélecteur composé
   (spécificité 0,2,0) pour l'emporter sur .pont sans dépendre de l'ordre
   dans la feuille de style ; .pont garde son fond ET son contour habituels
   PARTOUT ailleurs (contraste voulu, ex. Relations). */
.pont.carte-jour-paire{background:var(--papier2); border:0}
.pont .cible{color:var(--encre);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;border-bottom:1px solid var(--bord)}
td:first-child{color:var(--encre3);width:120px;font-size:13px}
td:last-child{text-align:right;color:var(--encre3);font-size:12px}
.retro{color:var(--tension);font-size:11px}

/* formulaire */
label{display:block;font-size:12px;color:var(--encre3);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.1em}
/* :not([type=checkbox]) — sinon une case à cocher hérite width:100%+padding
   de la règle des champs texte et devient un gros rectangle noir étiré sur
   toute la ligne (constaté sur iOS Safari, écrase le libellé à côté). */
input:not([type=checkbox]),textarea{
  width:100%;background:var(--papier);border:1px solid var(--bord);
  border-radius:9px;padding:11px 13px;font:inherit;font-size:15px;color:var(--encre);
}
input:focus,textarea:focus{outline:none;border-color:var(--accent-doux)}
textarea{resize:vertical;min-height:110px}
/* accent-color reteinte le rendu NATIF (coche, remplissage) sans réinventer
   un composant — simple, cohérent sur desktop et iOS Safari 15.4+. */
input[type=checkbox]{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
/* Menus déroulants : même boîte que les champs texte (fond/bordure/rayon), pour
   qu'un <select> ne retombe pas sur le rendu natif minimal du navigateur (vu
   trop petit / hors-thème sur iOS). Largeur laissée à chaque usage (certains
   pleins, d'autres compacts). */
select{
  background:var(--papier);border:1px solid var(--bord);border-radius:9px;
  padding:11px 13px;font:inherit;font-size:15px;color:var(--encre);cursor:pointer;
}
select:focus{outline:none;border-color:var(--accent-doux)}
/* Puce de choix : un petit bouton pilule (icône + libellé) qui se dimensionne à
   son contenu — remplace les gros boutons pleine largeur pour les listes de
   choix courtes (type de lien, rôle parent-enfant). Cible ≥ 40px de haut,
   espacées (Fitts) ; une seule emphase à la fois via .actif. */
.chip-choix{
  display:inline-flex;align-items:center;gap:7px;width:auto;
  padding:9px 14px;border-radius:999px;border:1px solid var(--bord);
  background:var(--papier);color:var(--encre2);
  font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.chip-choix .ico{opacity:.85}
.chip-choix:hover{color:var(--encre);border-color:var(--accent-doux)}
.chip-choix.actif{background:var(--accent-doux);color:var(--papier);border-color:var(--accent-doux)}
.chip-choix.actif .ico{opacity:1}
.rangee{display:flex;gap:10px}
.bouton{
  width:100%;background:var(--accent);color:var(--papier);border:0;
  border-radius:9px;padding:13px;font:inherit;font-size:15px;font-weight:600;
  cursor:pointer;margin-top:22px;
}
.bouton:hover{opacity:.92}
.bouton.discret{background:none;color:var(--encre3);border:1px solid var(--bord);margin-top:10px}
.bouton.discret:hover{color:var(--encre);border-color:var(--accent-doux)}
/* .actif : la seule règle de sélection existante (nav button.actif) ne
   couvrait pas les boutons discrets utilisés comme choix (genre, type de
   lien, rôle parent-enfant) — la classe se posait bien en JS, mais rien ne
   la rendait visible. */
.bouton.discret.actif{background:var(--accent-doux);color:var(--papier);border-color:var(--accent-doux)}
.bouton.danger{background:none;color:var(--tension);border:1px solid var(--bord);margin-top:10px}
.bouton.danger:hover{border-color:var(--tension)}
.suggestions{margin-top:6px;border:1px solid var(--bord);border-radius:9px;overflow:hidden}
.suggestions div{padding:10px 13px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--bord)}
.suggestions div:last-child{border-bottom:0}
.suggestions div:hover{background:var(--papier)}
.suggestions small{color:var(--encre3);display:block;font-size:11px}

/* réserves — visibles, jamais tues */
.avis{
  background:color-mix(in srgb, var(--tension) 8%, transparent);
  border:1px solid color-mix(in srgb, var(--tension) 26%, transparent);
  border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--encre2);
}
.avis b{color:var(--tension)}
.note{font-size:12px;color:var(--encre3);line-height:1.6;margin-top:24px;text-align:center}
.trou{border:1px dashed var(--bord);border-radius:10px;padding:14px;font-size:13px;color:var(--encre3);margin-top:12px}

/* le panneau de détail — plein écran, mobile d'abord */
/* opaque, pas translucide : on lit un texte long ici, la page du dessous ne
   doit pas transparaître derrière les mots */
.voile{
  position:fixed;inset:0;background:var(--papier);
  z-index:50;overflow-y:auto;padding:20px;
}
.panneau{max-width:660px;margin:0 auto;padding-bottom:70px}
.panneau-haut{
  position:sticky;top:-20px;background:var(--papier);margin:-20px -20px 0;padding:20px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--bord);z-index:2;
}
.fermer{background:none;border:0;font:inherit;font-size:22px;color:var(--encre3);cursor:pointer;padding:4px 10px;line-height:1}
.fermer:hover{color:var(--encre)}
.detail-titre{font-family:var(--serif);font-size:34px;margin:26px 0 4px;line-height:1.15}
.detail-nombre{font-family:var(--serif);font-size:15px;color:var(--accent);letter-spacing:.08em}
.detail-resume{font-family:var(--serif);font-size:19px;color:var(--encre2);margin:14px 0 8px;line-height:1.5}
.section{margin-top:26px}
.section.univers{border-left:2px solid var(--accent);padding-left:16px;margin-left:-2px}
.univers-nombres{font-family:var(--serif);font-size:18px;color:var(--encre2);margin-bottom:10px}
.univers-nombres b{color:var(--accent);font-weight:600}
.section h4{
  font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--encre3);
  font-weight:600;margin-bottom:8px;
}
.section p{font-size:15px;color:var(--encre2);line-height:1.7}
.section.douce{background:var(--papier2);border:1px solid var(--bord);border-radius:10px;padding:18px}
.section.douce h4{color:var(--accent)}

/* le « c'est quoi ? » — la vulgarisation, partout */
.quoi{font-size:13px;color:var(--encre3);line-height:1.55;margin-top:6px}
details.aide{margin-top:10px}
details.aide summary{
  font-size:11px;color:var(--encre3);cursor:pointer;text-transform:uppercase;letter-spacing:.1em;
  list-style:none;
}
details.aide summary::-webkit-details-marker{display:none}
details.aide summary::before{content:'⌄ ';color:var(--accent-doux);font-weight:700}
details.aide[open] summary::before{content:'⌃ '}
details.aide summary:hover{color:var(--encre2)}
details.aide p{font-size:13px;color:var(--encre3);margin-top:8px;line-height:1.6}

.lien[data-lien]{cursor:pointer;padding:8px;margin:0 -8px;border-radius:8px;transition:.15s}
.lien[data-lien]:hover{background:var(--papier)}

/* ═══ Le bandeau de synthèse du jour — l'essentiel d'un coup d'œil. ═══
   Date + Lune en haut (hérité de .entete-jour), puis une ligne d'état qui
   rassemble le transit dominant et la carte du jour — les deux faits-clés
   du ciel aujourd'hui, normalement dispersés plus bas dans la page. */
.synthese{background:var(--papier2);border:1px solid var(--bord);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.synthese .entete-jour{padding:2px 0 0;margin-bottom:0}
/* le transit dominant et la carte du jour s'empilent sous l'en-tête,
   séparés par un trait — un par ligne, pleine largeur, bien lisible. */
.synthese-transit{padding-top:14px;margin-top:14px;border-top:1px solid var(--bord)}
.synthese-transit .lib{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--encre3);display:block;margin-bottom:4px}
.synthese-transit .corps{font-family:var(--serif);font-size:17px;color:var(--encre);line-height:1.4}
.synthese-transit .corps b{font-weight:600}
.synthese .carte-jour-zone{padding-top:14px;margin-top:14px;border-top:1px solid var(--bord)}
.synthese details.aide{margin-top:10px}

/* ═══ PILOTE ÉPURE « Le jour » (2026-08-24) ═══
   Étoile polaire : une chose à la fois, le reste sur demande. DEUX gestes de
   divulgation, chacun un sens FIXE et un signifiant distinct — c'est ce qui
   les rend prévisibles plutôt qu'incohérents (Jakob, Norman) :
     · le tiroir (chevron ⌄) = EXPLORER un texte sans perdre sa place ;
     · le plein écran (glyphe ⤢) = CONTEMPLER un objet seul (carte, pensée). */

/* Le message du jour = le héros. Plus d'air, une légère élévation qui le
   détache, l'en-tête (date + Lune) fondu dedans en fine ligne dés-accentuée. */
.carte-jour-hero{padding:28px 26px 30px; box-shadow:0 10px 34px rgba(0,0,0,.16)}
.jour-entete{text-align:center; color:var(--encre3); margin-bottom:22px;
  padding-bottom:18px; border-bottom:1px solid var(--bord)}
.jour-entete .date{font-size:11px; letter-spacing:.16em; text-transform:uppercase}
.jour-entete .lune{font-family:var(--serif); font-size:14px; color:var(--encre2); margin-top:7px}
.carte-jour-hero .miroir{font-size:21px; line-height:1.62}

/* Une RANGÉE plein écran — visuellement identique à une rangée de tiroir
   (même padding, même hover, même typo), pour se mêler sans rupture aux
   tiroirs dans un même groupe « Explorer » (Martin, 2026-08-24 : « la Lune »
   et « Nuance » ouvrent en plein écran, PAS en dépli inline). Le glyphe ⤢,
   à la même place que le chevron ⌄ du tiroir, dit « ça s'ouvre en grand »
   plutôt que « ça se déplie ici ». N'EST PAS utilisé pour les tuiles de
   domaine (12 cartes dans « Le fil du jour ») : sur une grille aussi dense,
   l'icône répétée surchargeait pour rien — elles gardent l'ancien style
   .pont.angle-carte, SANS glyphe (rien à changer là, cette règle ne le
   posait déjà que via ce bloc, retiré). */
.rangee-angle{
  border-bottom:1px solid var(--bord); cursor:pointer;
  padding:15px 20px; display:flex; align-items:center; gap:14px;
  transition:background .15s;
}
.rangee-angle:last-child{border-bottom:0}
.rangee-angle:hover{background:var(--papier)}
.rangee-angle .glyphe-plein{flex:none; color:var(--accent-doux); opacity:.5; font-size:16px; line-height:1}

/* Rythme plus généreux entre les repères de premier niveau (on en a moins). */
.jour-section{margin-top:34px}

/* Les Rappels sortent du flux de lecture : un pied utilitaire discret, dés-
   accentué, séparé du contenu contemplatif par un trait fin et de l'air. */
.jour-pied{margin-top:40px; padding-top:22px; border-top:1px solid var(--bord);
  text-align:center}
.jour-pied .chapo{justify-content:center}
.jour-pied .quoi{max-width:46ch; margin-left:auto; margin-right:auto}

/* ═══ Les tiroirs — dépliables au clic, la divulgation progressive d'Align. ═══
   Version « section » du details.aide : un résumé toujours lisible dans
   l'en-tête, le geste et le détail au dépliage. Pas un discret « ? » : la
   première lecture se fait sans rien ouvrir. */
.jour-section{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--encre3);font-weight:600;margin:24px 0 8px}
.jour-groupe{background:var(--papier2);border:1px solid var(--bord);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
/* Le Fil du jour, PROMU (Martin, 2026-08-27) : liseré doré translucide + un
   peu d'air au-dessus pour le détacher, sans crier — c'est le seul élément
   doré de la liste, donc l'œil s'y pose (Von Restorff). Replié, ça reste une
   seule ligne : l'épure tient. */
.jour-groupe-fil{border-color:rgba(233,212,148,.55);margin-top:20px}
.jour-groupe-fil .tiroir-nom{color:var(--accent-doux)}
details.tiroir{border-bottom:1px solid var(--bord)}
details.tiroir:last-child{border-bottom:0}
details.tiroir>summary{
  list-style:none;cursor:pointer;padding:15px 20px;
  display:flex;align-items:center;gap:14px;transition:background .15s;
}
details.tiroir>summary::-webkit-details-marker{display:none}
details.tiroir>summary:hover{background:var(--papier)}
details.tiroir>summary .tete{flex:1;min-width:0}
.tiroir-ico{flex:none;display:flex;color:var(--accent-doux);opacity:.7}
.tiroir-nom{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--encre3);display:block}
.tiroir-resume{font-family:var(--serif);font-size:17px;color:var(--encre);line-height:1.4;display:block;margin-top:3px}
.tiroir-resume.compact{font-size:14.5px;color:var(--encre2);font-family:var(--sans)}
/* La partie « … quel fil suivre » du Fil du jour se lit comme un sous-titre :
   italique serif, légèrement dés-accentué (Martin, 2026-08-27). */
.tiroir-resume em{font-style:italic;color:var(--encre2)}
.tiroir-chev{flex:none;color:var(--accent-doux);font-size:18px;line-height:1;transition:transform .18s ease}
details.tiroir[open]>summary .tiroir-chev{transform:rotate(180deg)}
.tiroir-corps{padding:14px 20px 18px}
.tiroir-corps p{font-size:15px;color:var(--encre2);line-height:1.65}
.tiroir-corps p + p{margin-top:10px}
.tiroir-corps .geste{margin-top:12px}
/* Une ligne de liste — pour du contenu RÉPÉTÉ (mêmes formes qui se suivent :
   un élément par point, un aspect par ligne). Reprend l'idiome déjà en place
   dans .tiroir (séparateur fin), pas un composant nouveau. */
.tiroir-corps .ligne-rel{font-size:15px;color:var(--encre2);line-height:1.65;padding:10px 0;border-top:1px solid var(--bord)}
.tiroir-corps .ligne-rel:first-child{border-top:0;padding-top:0}
/* le « tout lire → » d'un cycle ouvre le panneau de détail, sans conflit
   avec le summary qui, lui, déplie/replie le tiroir. */
.tout-lire{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
.tout-lire:hover{text-decoration:underline;text-underline-offset:3px}

.cacher{display:none}

@media (max-width:480px){
  /* Titre sur sa ligne, barre d'outils juste dessous ALIGNÉE À DROITE (refonte
     en-tête 2026-08-27) — plus les deux icônes orphelines calées à gauche : le
     groupe d'outils est posé à droite, en un seul bloc net. */
  .rangee-haut{flex-direction:column;align-items:stretch;gap:14px}
  .outils-haut{justify-content:flex-end}
  /* `width:100%` retiré : la nav est désormais en pleine largeur d'écran
     par elle-même (voir la règle de base, marges négatives) — imposer
     100% ici annulerait ce débordement volontaire. */
  /* Compacté pour que les 4 boutons tiennent sur une seule ligne même sur
     les petits téléphones. */
  nav button{padding:6px 5px;gap:3px;font-size:11.5px}
  nav button .ico{width:14px;height:14px}
  /* Bandeau resserré (260 → 210) : titre + outils tiennent dans le tiers haut,
     l'image respire dessous au lieu d'un grand vide au milieu. */
  .bandeau-marque{height:210px}
  .enveloppe{padding:22px 0 70px}
  .carte{padding:20px}
  .miroir{font-size:19px}
  .detail-titre{font-size:27px}
}
</style>
</head>
<body>
<div id="fond-app" role="presentation"></div>
<div class="bandeau-marque" role="presentation"></div>
<div class="enveloppe">
  <header>
    <div class="rangee-haut">
      <div class="marque">
        <svg class="marque-ico" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4.5h16"/>
          <path d="M5 11h3M16 11h3" opacity="0.55"/>
          <path d="M12 5.6V14"/>
          <path d="M12 14l2.1 2.6L12 21l-2.1-4.4Z"/>
          <circle cx="12" cy="4.5" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="marque-texte">TA TRAME</span>
      </div>
      <div class="outils-haut">
        <button id="bouton-regles" class="outil ico-seule cacher" data-vue="regles" aria-label="Les Règles">
          <span class="etiquette-survol">Les Règles</span>
        </button>
        <button id="bouton-feedback" class="outil ico-seule cacher" aria-label="Un commentaire pour Martin ?">
          <span class="etiquette-survol">Un commentaire ?</span>

  <section id="vue-accueil" class="cacher"></section>
  <section id="vue-jour" class="cacher"></section>
  <section id="vue-apercu" class="cacher"></section>
  <section id="vue-portrait" class="cacher"></section>
  <section id="vue-ciel" class="cacher"></section>
