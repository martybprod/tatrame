/* ═══════════════════════════════════════════════════════════
   LES AUTRES DOMAINES DE TA VIE — le domaine se choisit, la nuance continue
   de tourner. Le Fil du jour impose UN domaine (la maison de la Lune) ; ici,
   la personne choisit elle-même (Famille, Argent, Couple…) — à l'intérieur,
   le transit dominant et la phase ou la tonalité du jour choisissent
   l'entrée, le même domaine donne un texte différent d'un jour à l'autre,
   jamais un texte figé. Sous-tiroirs imbriqués dans « Le fil du jour »,
   chargés au clic (aucun appel réseau tant qu'on n'ouvre pas). Doit rester
   synchro avec DOMAINE_LABELS et MAISON_DOMAINE côté app.py/jour.py.
   ═══════════════════════════════════════════════════════════ */
const DOMAINES_JOUR = [
  ['soi', 'Toi'], ['ressources', 'Argent'], ['echanges', 'Mots'],
  ['racines', 'Famille'], ['creation', 'Créativité'], ['quotidien', 'Habitudes'],
  ['autre', 'Couple'], ['traversee', 'Traversées'], ['sens', 'Sens'],
  ['metier', 'Métier'], ['communaute', 'Communauté'], ['retrait', 'Solitude'],
];

/* Une carte cliquable de domaine (remplace l'ancien sous-tiroir <details> imbriqué
   dans « Les sphères de ta vie », maintenant fusionné dans « Le fil du jour ») : le
   texte est chargé à la demande au clic (jamais avant, jamais deux fois — cache
   _cacheDomaines), puis affiché dans le plein écran générique des angles. */
const _cacheDomaines = {};
async function ouvrirDomainePlein(domaine, label) {
  if (!_cacheDomaines[domaine]) {
    const r = await (await fetch(`/api/explorer/${profilId}/${domaine}`)).json();
    const c = r.texte;
    _cacheDomaines[domaine] = c
      ? `<div class="miroir" style="font-size:16px;margin-bottom:8px">${T(c.miroir)}</div>
         ${blocGeste(c.geste)}
         ${aide("D'où vient ce conseil ?", "Une strate de coaching distillée de nombreux ouvrages de développement personnel, réécrite dans la voix de Ta Trame. Tu choisis le domaine ; le transit dominant du jour et la phase ou la tonalité choisissent l'entrée à l'intérieur. C'est le ciel qui décide — reviens demain, ce ne sera pas la même.")}`
      : `<p class="quoi">Le corpus n'a pas encore d'entrée pour cette configuration du ciel, ${T(label).toLowerCase()}.</p>`;
  }
  ouvrirAnglePlein(label, _cacheDomaines[domaine]);
}
function domaineCarte(domaine, label) {
  const ico = ICONES_DOM[domaine] ? `<span class="tiroir-ico">${icono(ICONES_DOM[domaine], 20)}</span>` : '';
  const id = 'dc-' + domaine;
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) el.onclick = () => ouvrirDomainePlein(domaine, label);
  }, 0);
  return `<div class="pont angle-carte" id="${id}" style="margin-top:6px">
    <span class="tete">${ico}<span class="tiroir-nom" style="flex:1">${T(label)}</span></span>
  </div>`;
}

// Message partagé des onglets qui exigent un thème complet (heure + lieu de
// naissance) — Le Jour, Le Ciel, L'Aperçu. Le Portrait, lui, garde les
// nombres et n'affiche jamais ce message (voir vuePortrait).
function msgThemeIncomplet() {
  return `<div class="carte">
    <p class="quoi">Cette lecture demande l'heure et le lieu de naissance
      (Ascendant, maisons) — pour l'instant, seule la date est connue.</p>
    <button class="bouton discret" id="mti-completer">Ajouter l'heure et le lieu</button>
  </div>`;
}
function câblerMsgThemeIncomplet() {
  const b = $('#mti-completer');
  if (b) b.onclick = async () => {
    editionDe = profilId;
    ouvrirFormulaire(await (await fetch(`/api/profil/${profilId}`)).json());
  };
}

async function chargerJour() {
  const j = await (await fetch(`/api/jour/${profilId}`)).json();
  if (j.complet === false) {
    $('#vue-jour').innerHTML = msgThemeIncomplet();
    câblerMsgThemeIncomplet();
    return;
  }
  const d = new Date(j.date + 'T12:00:00');
  const t = j.textes || {};
  const dom = j.jour.dominante;
  const lune = j.jour.lune, phase = j.jour.phase.phase;

  // Le titre du jour, élu par le routeur : le ciel par défaut, la voix chinoise
  // quand sa relation est plus saillante (avec le sous-titre qui nomme les animaux).
  const titre = j.titre || t.transit;
  // Quand le ciel mène, « Aujourd'hui » ET « Ce qui domine aujourd'hui » racontent
  // le même transit — on ne le dit qu'une fois, dans la première carte.
  const cielMene = !titre || titre.source !== 'chinois';

  let domPhrase = '', domTempo = '', domCalc = '', domRetourAide = '';
  if (dom) {
    const estRetour = dom.transit === dom.natal && dom.classe === 'conjonction';
    domPhrase = estRetour
      ? `${T(nomPlanete(dom.transit))} revient exactement où il était à ta naissance.`
      : `Dans le ciel, <b style="color:var(--encre)">${T(nomPlanete(dom.transit))}</b>
         (${T(quoiPlanete(dom.transit))}) ${T(nomAspect(dom.classe))}
         <b style="color:var(--encre)">${T(nomPlanete(dom.natal))}</b>
         de ton thème${dom.applicatif ? ', et ça se resserre encore' : ''}.`;
    domTempo = dom.etage === 'declencheur'
      ? 'Un mouvement rapide : il donne le tempo du jour, à un jour ou deux près.'
      : 'Un mouvement lent : il dit le climat de fond, pas la journée.';
    domCalc = aide('Le calcul',
      `${dom.transit} ${dom.aspect} ${dom.natal} natal · orbe ${dom.orbe.toFixed(2)}° · exactitude ${(dom.exactitude*100).toFixed(0)} %`);
    domRetourAide = estRetour ? aide("Pourquoi ce jour précisément ?",
      "Un retour se calcule sur l'instant exact de ta naissance, pas sur la date civile seule. Si tu es né tard en soirée, cet instant peut tomber, une fois ramené au temps universel, sur le jour civil suivant. Le calcul reste précis — il peut juste sembler décalé d'un jour par rapport à ton anniversaire.") : '';
  }

  /* ═══ AUJOURD'HUI — le héros de la page. Le bandeau de synthèse d'avant est
     FONDU ici : date + Lune deviennent une fine ligne d'en-tête, dés-accentuée,
     à l'intérieur même de la carte du message. Un seul bloc primaire, un seul
     foyer d'attention (protéger le pic). Les faits-ciel ne vivent QUE dans
     cette carte quand le ciel mène, ou dans « Explorer » quand le chinois mène
     — plus jamais dupliqués dans un bandeau. ═══ */
  const enteteJour = `<div class="jour-entete">
      <div class="date">${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}</div>
      <div class="lune">La Lune éclaire ${T(nomMaison(lune.maison))} · ${T(nomPhase(phase))}</div>
    </div>`;

  let html = '';
  if (titre && titre.miroir) {
    html += `<div class="carte carte-jour-hero">
      ${enteteJour}
      <div class="chapo">Aujourd'hui</div>
      ${titre.sous_titre ? `<p class="quoi" style="margin:-4px 0 12px">${T(titre.sous_titre)}</p>` : ''}
      ${cielMene && dom ? `<p style="font-size:15px;color:var(--encre2)">${domPhrase}</p>
      <p class="quoi" style="margin:4px 0 12px">${domTempo}</p>` : ''}
      <div class="miroir">${T(titre.miroir)}</div>
      ${blocGeste(titre.geste)}
      ${cielMene && dom ? domCalc : aide("D'où vient ce message ?", "Chaque jour, plusieurs voix se disputent la place : le ciel du jour (une planète qui touche ton thème de naissance) et ton signe chinois (la relation entre l'animal du jour et le tien). Ta Trame calcule laquelle est la plus marquante aujourd'hui et retient son message, différent pour chacun selon ton thème.")}
      ${cielMene ? domRetourAide : ''}
    </div>`;
  } else {
    /* Pas de message écrit ce jour-là : on garde au moins l'en-tête date/Lune,
       sans le trait ni l'air du dessous, pour ne pas ouvrir sur du vide. */
    html += `<div class="carte carte-jour-hero"><div class="jour-entete"
        style="margin-bottom:0;padding-bottom:0;border-bottom:0">
        <div class="date">${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}</div>
        <div class="lune">La Lune éclaire ${T(nomMaison(lune.maison))} · ${T(nomPhase(phase))}</div>
      </div></div>`;
  }

  /* Tes cartes du jour — les DEUX cartes réunies, sous le message, présentées
     CÔTE À CÔTE (« Toi » vs « Le pouls du monde »). TOUJOURS affichées, plus
     de tiroir à déplier (demande de Martin, 2026-08-22) : chaque carte affiche
     son DOS par défaut et s'ouvre en plein écran au premier clic (2026-08-27). */
  if (j.carte_min || j.carte_jour) {
    const cm = j.carte_min, cj = j.carte_jour;
    /* Chaque carte affiche son dos en grille (le dos seul, jamais de texte en
       ligne) et s'ouvre en PLEIN ÉCRAN au PREMIER clic (Martin, 2026-08-27) —
       plus de dévoilement en deux temps. Nom et invitation vivent SEULEMENT
       en data-attributs, lus par ouvrirCartePlein : ils ne sont lisibles
       qu'en plein écran. */
    const ligneCarte = (zoneId, src, badge, badgeCol, nom, invitation, alt) => `
      <div class="carte-jour-zone" id="${zoneId}" title="Clique pour l'agrandir"
           data-src="${src}" data-nom="${T(nom)}" data-invitation="${T(invitation || '')}">
        <span class="carte-jour">
          <img class="face" src="${src}" alt="${alt}"
               onerror="this.onerror=null;this.src='/static/cartes/dos.jpg'">
          <img class="dos" src="/static/cartes/dos.jpg" alt="">
        </span>
        <span style="display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:${badgeCol};border:1px solid ${badgeCol};border-radius:10px;padding:1px 7px">${badge}</span>
      </div>`;
    html += `<div class="jour-section">Tes cartes du jour</div>
      <div class="jour-groupe" style="padding:2px 2px 8px">
        <div class="pont carte-jour-paire" style="margin-top:14px">
          ${cj ? ligneCarte('z-carte-maj', urlCarte(cj.numero), 'Le pouls du monde', 'var(--accent)', cj.nom, cj.invitation, T(cj.nom)) : ''}
          ${cm ? ligneCarte('z-carte-min', urlCarteMineur(cm.suit, cm.rang), 'Toi', 'var(--accent)', cm.nom, cm.invitation, 'arcane mineur') : ''}
        </div>
        ${aide("Deux cartes, pourquoi ?", "La carte « Le pouls du monde » se calcule sur la date du jour seule (le même climat pour tout le monde). La carte « Toi » se calcule sur ton thème (couleur = la Lune du jour, rang = l'écart entre le Soleil du jour et ton Ascendant de naissance) : elle n'appartient qu'à toi. Les deux sont toujours calculées, jamais tirées.")}
      </div>`;
  }

  /* ═══ LES ANGLES DU JOUR — tiroirs : la pensée reste visible dans l'en-tête,
     l'action et le détail se déploient au clic. On balaye les angles d'un coup
     d'œil sans scroller une longue liste de cartes identiques. ═══ */
  let angles = '';

  // Le transit dominant, quand il n'est pas déjà dans « Aujourd'hui » (chinois mène).
  if (dom && !cielMene) {
    angles += tiroir({
      nom: "Ce qui domine aujourd'hui",
      resume: t.transit?.miroir ? T(t.transit.miroir) : domPhrase.replace(/<[^>]*>/g, ''),
      ico: icono(ICONES_JOUR.domine),
      // domPhrase contient du HTML (des <b> pour les noms de planètes) — on ne
      // passe PAS par aide() ici, elle échapperait ces balises via T(). On
      // reprend directement la classe .aide (même rendu discret replié) pour
      // garder le HTML intact. Demande de Martin (2026-08-22) : la mécanique
      // du ciel repliée par défaut, discrète — le mouvement (domTempo) et le
      // geste restent visibles, eux.
      corps: `<details class="aide"><summary>Dans le ciel</summary><p>${domPhrase}</p></details>
        <p class="quoi">${domTempo}</p>
        ${blocGeste(t.transit?.geste)}
        ${domCalc}${domRetourAide}`
    });
  }

  /* La Lune aujourd'hui — « où ça se joue » (sa maison) ET « le moment du
     cycle » (sa phase) réunis : c'est le même astre, deux facettes. Fusion de
     deux ex-tiroirs en un (guide UX : morceler, moins de rangées). Le sous-bloc
     « le moment du cycle » se déplie à l'intérieur pour ne pas tout empiler. */
  const lm = t.lune_maison, ph = t.phase;
  if ((lm && lm.miroir) || (ph && ph.miroir)) {
    const blocPhase = (ph && ph.miroir) ? `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bord)">
        <span class="lib" style="display:block;font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--encre3);margin-bottom:4px">Le moment du cycle</span>
        <div class="miroir" style="font-size:16px">${T(ph.miroir)}</div>
        <p class="quoi" style="margin:4px 0 10px">${nomPhase(phase)} — ${quoiPhase(phase)}</p>
        ${blocGeste(ph.geste)}
        ${aide("D'où vient la phase ?", "L'écart entre la Lune et le Soleil dans le ciel du jour, divisé en huit parts égales — un calcul purement astronomique, le même pour tout le monde, qui donne les huit phases classiques (nouvelle, premier quartier, pleine…).")}
      </div>` : '';
    angles += angleCarte({
      nom: 'La Lune aujourd\'hui',
      resume: T((lm && lm.miroir) || ph.miroir),
      ico: icono(ICONES_JOUR.lune_maison),
      corpsHTML: `${(lm && lm.miroir) ? `
        <details class="aide"><summary>Dans le ciel</summary><p>La Lune traverse ta maison ${lune.maison} aujourd'hui.</p></details>
        <p class="quoi" style="margin:4px 0 12px">${nomMaison(lune.maison)} — ${quoiMaison(lune.maison)}</p>
        ${blocGeste(lm.geste)}
        ${aide("D'où vient ce calcul ?", "La Lune du jour traverse une maison de ton thème de naissance — précise à ta carte, elle seule dit sur quel terrain de ta vie ça se joue aujourd'hui. Elle change de maison environ tous les deux jours et demi.")}` : ''}
        ${blocPhase}`
    });
  }

  /* Le Fil du jour — un domaine de vie, rythmé par le ciel : la maison de la
     Lune donne le domaine, le transit dominant et la phase donnent la nuance.
     FUSIONNÉ avec « Les sphères de ta vie ». Un TIROIR, comme tous les angles
     textuels depuis le pilote épure (2026-08-24) : ils s'explorent en place,
     sans plein écran. Les 12 domaines à l'intérieur, EUX, s'ouvrent en plein
     écran (contempler un domaine à la fois) — via domaineCarte.
     ⚠️ PLUS de domaine choisi par défaut (demande de Martin, 2026-08-22) : le
     domaine du ciel (maison de la Lune, t.fil) n'est PLUS affiché d'office au
     dépli — le tiroir montre directement les 12 domaines, sur un pied
     d'égalité ; celui du ciel n'est qu'une carte parmi les douze, comme les
     autres. `t.fil` reste utilisé comme simple GARDE (si le jour ne résout
     rien du tout côté ciel, improbable depuis que les 12 domaines sont
     complets, on ne montre pas un tiroir vide). */
  // Le Fil du jour est PROMU (Martin, 2026-08-27) : sorti d'« Explorer » où il
  // se noyait, il devient un bloc à part, remonté juste après « Tes cartes du
  // jour » (donc visible dès l'ouverture) et distingué par un liseré doré
  // (.jour-groupe-fil) — c'est LE contenu riche du jour, on veut que l'œil s'y
  // pose (Von Restorff : un seul élément saillant). Calculé ici, inséré plus
  // bas dans `html` AVANT le groupe Explorer. Le tiroir DÉPLIÉ ne change pas
  // (Martin : « déplié, c'est parfait »).
  let filDuJour = '';
  if (t.fil && t.fil.miroir) {
    filDuJour = tiroir({
      nom: 'Le fil du jour',
      resume: '<em>Choisis quel fil tu veux suivre aujourd\'hui.</em>',
      ico: icono(ICONES_JOUR.fil),
      corps: `
        ${DOMAINES_JOUR.map(([d, l]) => domaineCarte(d, l)).join('')}
        ${aide("D'où vient ce fil ?", "Une strate de coaching distillée de nombreux ouvrages de développement personnel, réécrite dans la voix de Ta Trame. Choisis un domaine ; le transit dominant du jour et la phase ou la tonalité choisissent l'entrée à l'intérieur. C'est le ciel qui décide — reviens demain, ce ne sera pas la même.")}`
    });
  }

  /* La nuance — le ton de la Lune contrarié : un angle qui demande plus d'appui. */
  if (j.jour.ton_lunaire_annule) {
    const nu = j.jour.nuance;
    const nuPhrase = nu
      ? `La Lune du jour ${T(nomAspect(nu.classe))} <b style="color:var(--encre)">${T(nomPlanete(nu.natal))}</b> de ton thème.`
      : '';
    angles += angleCarte({
      nom: 'Nuance',
      resume: "Le ton de la Lune est contrarié aujourd'hui — ce qui semble facile demande un peu plus d'effort.",
      ico: icono(ICONES_JOUR.nuance),
      corpsHTML: `${nuPhrase ? `<p style="font-size:15px;color:var(--encre2)">${nuPhrase}</p>` : ''}
        ${aide("D'où vient cette nuance ?", "Le signe et la maison de la Lune donnent en général le ton du jour — mais quand la Lune du jour fait elle-même un aspect dur (carré ou opposition) très exact à une planète de ton thème de naissance, cet aspect prend le dessus. Le ton habituel de la Lune ne disparaît pas : il se complique, et demande plus d'effort que d'habitude.")}`
    });
  }

  /* (Les angles ci-dessus rejoignent le groupe « Explorer » plus bas, avec les
     cycles du fond du temps — un seul groupe pour tout le secondaire textuel.) */

  /* ═══ LE FOND DU TEMPS — les cycles lents (mois, année, traversée de vie).
     Ils changent rarement : repliés par défaut, dépliables au clic, avec un
     « tout lire → » qui ouvre le panneau de détail complet. Ils ne polluent
     plus la lecture du jour, tout en restant à portée. ═══ */
  let cycles = '';

  /* Le mois — la saison, entre le chapitre et la journée. */
  if (t.mois_perso) {
    const m = t.mois_perso;
    cycles += tiroir({
      nom: `Ton mois ${j.jour.mois_personnel}${m.en_un_mot ? ' · ' + T(m.en_un_mot) : ''}`,
      resume: T(m.miroir || ''),
      ico: icono(ICONES_JOUR.cycle),
      corps: `${blocGeste(m.geste)}
        <span class="tout-lire" data-cible="mois">tout lire →</span>
        ${aide("C'est quoi, « ton mois » ?", terme('mois_personnel').quoi, terme('mois_personnel').quand)}`
    });
  }

  /* L'année — un nombre nu ne dit RIEN. On le nomme, et on peut tout lire. */
  if (t.annee_perso) {
    const motcle = t.annee_perso.detail?.en_un_mot;
    cycles += tiroir({
      nom: `Ton année ${j.jour.annee_personnelle}${motcle ? ' · ' + T(motcle) : ''}`,
      resume: T(t.annee_perso.miroir || ''),
      ico: icono(ICONES_JOUR.cycle),
      corps: `${blocGeste(t.annee_perso.geste)}
        ${t.annee_perso.univers ? `<div class="pont" style="margin-top:14px">
          <span>Le monde, lui, est en année <span class="cible">${t.annee_perso.univers.universelle}</span>${t.annee_perso.univers.titre ? ` — ${T(t.annee_perso.univers.titre.toLowerCase())}` : ''}.</span></div>` : ''}
        <div class="pont carte-annee" style="margin-top:14px;display:flex;align-items:center;gap:14px">
          <img class="vignette" src="${urlCarte(j.carte_annee.numero)}" alt="${T(j.carte_annee.nom)}">
          <span style="flex:1">Carte de l'année : <span class="cible">${T(j.carte_annee.nom)}</span></span>
        </div>
        ${t.annee_perso.detail ? `<span class="tout-lire" data-cible="annee">tout lire →</span>` : ''}
        ${aide("C'est quoi, « ton année » ?", terme('annee_personnelle').quoi, terme('annee_personnelle').quand)}`
    });
  }

  /* La traversée de vie — l'échelle la plus lente, la même pour tout le monde. */
  if (j.vie && j.vie.corpus) {
    const v = j.vie.corpus;
    cycles += tiroir({
      nom: `Ta traversée · ${j.vie.age_ans} ans${v.en_un_mot ? ' · ' + T(v.en_un_mot) : ''}`,
      resume: T(v.resume || ''),
      ico: icono(ICONES_JOUR.cycle),
      corps: `<div class="pont" style="margin-top:0">Une étape que tout le monde traverse au même âge.</div>
        <span class="tout-lire" data-cible="vie">tout lire →</span>
        ${aide("D'où vient cette étape ?", "Elle ne dépend que de ton âge — le même passage pour tout le monde au même moment de la vie (le premier bilan vers 29 ans, le grand réveil vers 42…), quel que soit ton thème. C'est la seule échelle de temps de Ta Trame qui ne varie pas d'une personne à l'autre.")}`
    });
  }

  /* ═══ EXPLORER — UN seul groupe pour tout ce qui s'explore, au geste unique
     du tiroir ⌄ : les angles du ciel (ce qui domine, la Lune, la nuance), le
     fil des domaines, et le fond du temps (mois, année, traversée) niché dans
     son propre tiroir. Fusionne les ex-« angles du jour » et « fond du temps »
     — moins de repères de premier niveau (Miller), une seule grammaire de
     divulgation textuelle. ═══ */
  // Le Fil du jour, PROMU : inséré ICI (juste après « Tes cartes du jour »,
  // avant « Explorer ») pour être vu dès l'ouverture. Son propre groupe au
  // liseré doré (.jour-groupe-fil) le distingue des tiroirs neutres d'Explorer.
  if (filDuJour) {
    html += `<div class="jour-groupe jour-groupe-fil">${filDuJour}</div>`;
  }

  if (angles || cycles) {
    const fondDuTemps = cycles ? tiroir({
      nom: 'Le fond du temps',
      resume: 'Les cycles plus lents — ton mois, ton année, ta traversée de vie.',
      ico: icono(ICONES_JOUR.cycle),
      corps: cycles,
    }) : '';
    html += `<div class="jour-section">Explorer</div>
      <div class="jour-groupe">${angles}${fondDuTemps}</div>`;
  }

  /* ═══ À MÉDITER — la clôture du jour, à CONTEMPLER : plein écran (angleCarte,
     glyphe ⤢), le texte caché tant qu'on ne clique pas, pour ne pas y jeter un
     œil dès le matin par réflexe. Placée après Explorer, avant le pied. C'est,
     avec les deux cartes, le seul usage du plein écran : contempler un objet
     seul, jamais explorer du texte (ça, c'est le tiroir). ═══ */
  if (t.transit?.pensee_soir) {
    html += `<div class="jour-groupe" id="c-mediter">${angleCarte({
      nom: 'À méditer',
      resume: 'à lire en fin de journée',
      ico: icono(ICONES_JOUR.mediter),
      corpsHTML: `<div class="miroir" style="margin-bottom:0">${T(t.transit.pensee_soir)}</div>
        ${aide("D'où vient cette pensée ?", "Elle prolonge le ciel du jour — le transit dominant qui a coloré ta journée. Là où le matin invitait à agir, celle-ci invite à regarder en arrière, une fois la journée passée. Toujours calculée sur ton thème, différente d'un jour à l'autre.")}`,
    })}</div>`;
  }

  /* ═══ TON JOURNAL — même registre utilitaire/dés-accentué que Rappels
     ci-dessous : l'app suggère souvent d'écrire (les « En action »), ce lien
     est le point d'entrée permanent vers cet espace, pas juste le crayon à
     côté de chaque geste (blocGeste). ═══ */
  html += `<div class="jour-pied" id="c-journal">
    <div class="chapo"><span class="chapo-ico">${icono(ICONE_CRAYON, 15)}</span>Ton journal</div>
    <p class="quoi" style="margin:-4px 0 14px">Un petit espace à toi pour écrire ce que
      la journée t'inspire.</p>
    <button class="bouton discret" id="bouton-journal">Écrire</button>
  </div>`;

  /* ═══ RAPPELS — un utilitaire, PAS du contenu : sorti du flux de lecture, en
     pied de page discret et dés-accentué. Un matin (l'observation), un soir (le
     geste), aux mêmes heures pour tout le monde — jamais réglés pour maximiser
     les ouvertures (sobriété plutôt que manipulation). ═══ */
  html += `<div class="jour-pied" id="c-notifs">
    <div class="chapo"><span class="chapo-ico">${icono(ICONES_JOUR.rappel, 15)}</span>Rappels du jour</div>
    <p class="quoi" style="margin:-4px 0 14px">Le matin, le midi, le soir — chacun réglable,
      jamais optimisés pour te faire ouvrir l'app plus souvent.</p>
    <button class="bouton discret" id="bouton-notifs">Configurer les rappels</button>
  </div>`;

  if (j.manque && j.manque.length) {
    html += `<div class="trou">Corpus en construction — rien d'écrit pour :
      ${j.manque.map(T).join(', ')}.</div>`;
  }

  $('#vue-jour').innerHTML = html;
  $('#bouton-journal').onclick = ouvrirJournal;

  /* Le contenu de l'écran d'accueil : l'essentiel seulement (date, chapô,
     miroir, éventuellement En action) — les dépliants secondaires restent
     dans la vue Jour ci-dessus. Rempli ici tant qu'on a les données ;
     l'affichage (une fois par moment, jour OU soir) est décidé par
     montrerAccueilJour(). À partir de 20h (estSoir()), « À méditer »
     remplace « Aujourd'hui » — SI le corpus a une pensée du soir pour le
     transit dominant ; sinon on retombe sur « Aujourd'hui » (jamais un
     écran d'accueil vide faute de contenu du soir). */
  const carteAccueil = $('#accueil-jour .accueil-carte');
  if (carteAccueil) {
    if (estSoir() && t.transit?.pensee_soir) {
      carteAccueil.dataset.jour = j.date;
      carteAccueil.dataset.periode = 'soir';
      carteAccueil.innerHTML = `<div class="carte">
        <div class="accueil-date">${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}</div>
        <div class="chapo">À méditer</div>
        <div class="miroir">${T(t.transit.pensee_soir)}</div>
      </div>`;
    } else if (titre && titre.miroir) {
      carteAccueil.dataset.jour = j.date;   // clé « une fois par moment »
      carteAccueil.dataset.periode = 'jour';
      carteAccueil.innerHTML = `<div class="carte">
        <div class="accueil-date">${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}</div>
        <div class="chapo">Aujourd'hui</div>
        ${titre.sous_titre ? `<p class="quoi" style="margin:-4px 0 12px">${T(titre.sous_titre)}</p>` : ''}
        <div class="miroir">${T(titre.miroir)}</div>
        ${blocGeste(titre.geste)}
      </div>`;
    } else {
      delete carteAccueil.dataset.jour;   // rien à montrer, ni jour ni soir
      delete carteAccueil.dataset.periode;
      carteAccueil.innerHTML = '';
    }
  }

  /* Les deux cartes du jour : le premier clic ouvre directement le plein
     écran (Martin, 2026-08-27) — la carte est montrée agrandie d'emblée,
     jamais dévoilée en petit dans la grille. Même câblage pour les deux
     (voir ouvrirCartePlein). */
  [$('#z-carte-maj'), $('#z-carte-min')].forEach(zone => {
    if (!zone) return;
    zone.onclick = () => ouvrirCartePlein(zone);
  });
  /* La carte de l'année : un clic sur sa vignette (dans le tiroir) la zoome. */
  const vignetteAn = $('#vue-jour .carte-annee .vignette');
  if (vignetteAn) {
    const ca = j.carte_annee;
    vignetteAn.onclick = e => {
      e.stopPropagation();
      ouvrirLightbox(urlCarte(ca.numero), `${T(ca.nom)}<span class="corr">côté ciel · ${T(ca.correspondance[1])}</span>`);
    };
  }

  /* Les cycles du fond du temps : « tout lire → » ouvre le panneau de détail
     complet. Séparé du summary du tiroir, qui, lui, déplie/replie le résumé. */
  const ouvrirCycle = cible => {
    if (cible === 'mois' && t.mois_perso) ouvrirDetail({
      surtitre: `Ton mois ${j.jour.mois_personnel}`,
      titre: `Mois ${j.jour.mois_personnel}`,
      motcle: t.mois_perso.en_un_mot,
      resume: t.mois_perso.miroir,
      detail: t.mois_perso.detail,
    });
    if (cible === 'annee' && t.annee_perso?.detail) ouvrirDetail({
      surtitre: `Ton année ${j.jour.annee_personnelle}`,
      titre: `Année ${j.jour.annee_personnelle}`,
      motcle: t.annee_perso.detail.en_un_mot,
      resume: t.annee_perso.detail.resume,
      detail: t.annee_perso.detail,
      extra: `<div class="section" style="display:flex;gap:16px;align-items:flex-start">
          <img class="vignette-zoomable" src="${urlCarte(j.carte_annee.numero)}" alt="${T(j.carte_annee.nom)}"
               data-nom="${T(j.carte_annee.nom)}" data-signe="${T(j.carte_annee.correspondance[1])}"
               style="width:72px;height:126px;object-fit:cover;border-radius:8px;border:1px solid var(--bord);flex:none;cursor:zoom-in">
          <div><h4 style="margin-top:0">La carte de l'année</h4>
          ${j.carte_annee.message ? `<p>${T(j.carte_annee.message)}</p>` : ''}
          <p class="quoi" style="margin-top:8px">${T(j.carte_annee.nom)} — elle change au 1er janvier, comme ton année.</p></div>
        </div>` + htmlUnivers(t.annee_perso.univers, j.jour.annee_personnelle),
    });
    if (cible === 'vie' && j.vie?.corpus) ouvrirDetail({
      surtitre: `Ta traversée · ${j.vie.age_ans} ans`,
      titre: j.vie.corpus.en_un_mot || 'Ce passage',
      motcle: j.vie.corpus.en_un_mot,
      resume: j.vie.corpus.resume,
      detail: j.vie.corpus,
    });
  };
  $('#vue-jour').querySelectorAll('.tout-lire[data-cible]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); ouvrirCycle(el.dataset.cible); };
  });

  initCarteNotifications();
}

/* ═══════════════════════════════════════════════════════════
   RÉGLAGES DES RAPPELS — trois créneaux (matin/midi/soir), chacun
   activable séparément, avec une heure de base réglable ; le midi porte en
   plus le choix du domaine du « fil du jour ». Réutilisé tel quel par
   l'onboarding (voir ouvrirEtapeRappels) — un seul panneau, deux points
   d'entrée. ═══════════════════════════════════════════════════════════ */
const CRENEAUX_ORDRE = ['matin', 'midi', 'soir'];
const LABEL_CRENEAU = { matin: 'Le matin', midi: 'Le midi', soir: 'Le soir' };
const DESCRIPTION_CRENEAU = {
  matin: 'ton message du jour — seulement si tu n\'as pas déjà ouvert l\'app.',
  midi: 'le fil du jour, sur le domaine que tu choisis.',
  soir: 'à méditer, pour clore la journée.',
};
/* Les défauts d'affichage si le profil n'a encore rien réglé — mêmes valeurs
   que moteur/notifications.py::_creneaux_defaut (dupliquées côté client :
   pur affichage, la vérité vit côté serveur qui les applique de toute façon
   si rien n'est envoyé). */
function creneauxParDefaut() {
  return {
    matin: { actif: true, heure: 8 },
    midi: { actif: true, heure: 12, domaine: 'soi' },
    soir: { actif: false, heure: 20 },
  };
}

function urlBase64VersUint8Array(base64) {
  const remplissage = '='.repeat((4 - base64.length % 4) % 4);
  const brut = atob((base64 + remplissage).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...brut].map(c => c.charCodeAt(0)));
}

/* Demande la permission puis abonne le navigateur — ne fait RIEN d'autre
   (pas d'appel serveur ici : l'appelant décide quoi enregistrer et quand). */
async function _obtenirAbonnementPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert("Ton navigateur ne supporte pas les notifications push.");
    return null;
  }
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return null;
  const reg = await navigator.serviceWorker.ready;
  const dejaAbonne = await reg.pushManager.getSubscription();
  if (dejaAbonne) return dejaAbonne.toJSON();
  const { cle } = await (await fetch('/api/notifications/cle-publique')).json();
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64VersUint8Array(cle),
  });
  return sub.toJSON();
}

async function _desabonnerPush() {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub) await sub.unsubscribe();
}

/* Plages d'heures RESTREINTES par créneau (loi de Hick : moins de choix, plus
   vite décidé) — évite aussi un réglage absurde (« le soir » à 3h du matin).
   L'heure déjà enregistrée reste toujours proposée même si elle tombe hors
   plage (un réglage existant ne doit jamais disparaître silencieusement). */
const PLAGE_HEURE = { matin: [5, 11], midi: [10, 14], soir: [17, 23] };

function _optionsHeure(heureChoisie, min, max) {
  const heures = [];
  for (let h = min; h <= max; h++) heures.push(h);
  if (!heures.includes(heureChoisie)) heures.push(heureChoisie);
  heures.sort((a, b) => a - b);
  return heures.map(h =>
    `<option value="${h}"${h === heureChoisie ? ' selected' : ''}>${h} h</option>`).join('');
}

function _optionsDomaine(domaineChoisi) {
  return DOMAINES_JOUR.map(([cle, label]) =>
    `<option value="${cle}"${cle === domaineChoisi ? ' selected' : ''}>${T(label)}</option>`).join('');
}

/* Le domaine du midi reçoit le MÊME langage visuel que les champs texte de
   l'app (fond/bordure/padding/taille — voir `input,textarea` plus haut) :
   c'est un vrai choix de CONTENU, pas un réglage accessoire comme l'heure —
   poids visuel proportionnel à son importance (Fiche 1 du guide UX). */
const STYLE_CHAMP = 'background:var(--papier);border:1px solid var(--bord);border-radius:9px;'
  + 'padding:11px 13px;font:inherit;font-size:15px;color:var(--encre)';

function _ligneCreneauHTML(creneau, c) {
  const [min, max] = PLAGE_HEURE[creneau];
  const domaineHTML = creneau === 'midi'
    ? `<select id="rr-domaine" style="margin-top:8px;width:100%;${STYLE_CHAMP}">${_optionsDomaine(c.domaine)}</select>`
    : '';
  return `<div class="rr-ligne" style="margin-bottom:16px">
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;
      text-transform:none;font-size:15px;color:var(--encre);margin:0">
      <input type="checkbox" id="rr-${creneau}-actif" ${c.actif ? 'checked' : ''}>
      <span style="flex:1">
        <strong>${LABEL_CRENEAU[creneau]}</strong>
        <span style="display:block;font-size:13px;color:var(--encre3)">${DESCRIPTION_CRENEAU[creneau]}</span>
      </span>
      <select id="rr-${creneau}-heure" style="flex:none">${_optionsHeure(c.heure, min, max)}</select>
    </label>
    ${domaineHTML}
  </div>`;
}

/* Construit le panneau à partir des réglages COURANTS (déjà chargés) — sert
   à la fois au panneau générique (#voile/#panneau) et à l'étape d'onboarding. */
function _rappelsFormulaireHTML(creneaux) {
  return CRENEAUX_ORDRE.map(c => _ligneCreneauHTML(c, creneaux[c])).join('');
}

function _lireCreneauxDuFormulaire() {
  const creneaux = {};
  for (const c of CRENEAUX_ORDRE) {
    creneaux[c] = {
      actif: $(`#rr-${c}-actif`).checked,
      heure: parseInt($(`#rr-${c}-heure`).value, 10),
    };
    if (c === 'midi') creneaux[c].domaine = $('#rr-domaine').value;
  }
  return creneaux;
}

async function _enregistrerRappels(etat) {
  const creneaux = _lireCreneauxDuFormulaire();
  const unActif = CRENEAUX_ORDRE.some(c => creneaux[c].actif);
  let subscription = null;
  if (unActif) {
    subscription = await _obtenirAbonnementPush();
    if (!subscription) {
      if (etat) etat.textContent = 'Permission refusée — les rappels restent éteints.';
      return false;
    }
  } else {
    await _desabonnerPush();
  }
  const fuseau = Intl.DateTimeFormat().resolvedOptions().timeZone;
  await fetch(`/api/notifications/${profilId}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({creneaux, subscription, fuseau_notif: fuseau}),
  });
  return true;
}

async function initCarteNotifications() {
  const bouton = $('#bouton-notifs');
  if (!bouton) return;
  bouton.onclick = ouvrirReglagesRappels;
}

async function ouvrirReglagesRappels() {
  let creneaux = creneauxParDefaut();
  try {
    const r = await (await fetch(`/api/notifications/${profilId}`)).json();
    if (r.creneaux) creneaux = r.creneaux;
  } catch (e) { /* pas encore de réglages : les défauts suffisent */ }

  $('#panneau').innerHTML = `<div class="panneau-haut">
      <div class="chapo" style="margin-bottom:0">Configurer les rappels</div>
      <button class="fermer" id="rr-fermer">✕</button>
    </div>
    <p class="quoi" style="margin:14px 0 16px">Trois moments possibles, chacun réglable
      séparément — jamais optimisés pour te faire ouvrir l'app plus souvent.</p>
    <div id="rr-corps">${_rappelsFormulaireHTML(creneaux)}</div>
    <button class="bouton" id="rr-enregistrer">Enregistrer</button>
    <div id="rr-etat" style="margin-top:10px;font-size:13px;color:var(--encre3)"></div>`;
  $('#voile').classList.remove('cacher');
  $('#voile').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  $('#rr-fermer').onclick = fermerReglagesRappels;
  $('#rr-enregistrer').onclick = async () => {
    const etat = $('#rr-etat');
    $('#rr-enregistrer').disabled = true;
    etat.textContent = 'Enregistrement…';
    try {
      const ok = await _enregistrerRappels(etat);
      if (ok) { etat.textContent = 'C\'est enregistré.'; setTimeout(fermerReglagesRappels, 700); }
    } catch (e) {
      etat.textContent = 'La connexion a échoué — réessaie.';
    } finally {
      $('#rr-enregistrer').disabled = false;
    }
  };
}

function fermerReglagesRappels() {
  $('#voile').classList.add('cacher');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════════════════════════════
   TOUT — le thème entier d'un coup d'œil.
   « Il faut pouvoir bien comprendre facilement tout son thème, tous ces
   chiffres, numéros, et sa carte du ciel. »
   Une seule vue, rien de nu, tout cliquable.
   ═══════════════════════════════════════════════════════════ */
async function chargerApercu() {
  const d = await (await fetch(`/api/apercu/${profilId}`)).json();
  if (d.complet === false) {
    $('#vue-apercu').innerHTML = msgThemeIncomplet();
    câblerMsgThemeIncomplet();
    return;
  }
  const p = d.profil;

  const tuile = (haut, gros, bas, action, grosBrut = false) => `
    <div class="tuile"${action ? ` data-va="${action}"` : ''}>
      <div class="tuile-haut">${T(haut)}</div>
      <div class="tuile-gros">${grosBrut ? gros : T(gros)}</div>
      <div class="tuile-bas">${T(bas || '')}</div>
    </div>`;

  // La position dans un cycle de 9 (année, mois) se voit d'un coup d'œil dans
  // l'anneau plutôt que de se lire dans « 3 sur 9 ».
  const tuileCycle = (haut, valeur, total, bas, action) => `
    <div class="tuile"${action ? ` data-va="${action}"` : ''}>
      <div class="tuile-haut">${T(haut)}</div>
      ${anneauCycle(valeur, total)}
      <div class="tuile-bas">${T(bas || '')}</div>
    </div>`;

  let html = `<div class="carte">
    <div class="chapo">${T(p.nom)}</div>
    <p class="quoi" style="margin:-6px 0 0">${T(p.naissance)} à ${T(p.heure)} · ${T(p.lieu)}</p>
  </div>`;

  /* Les échelles de temps — de la plus lente à la plus rapide.
     C'est ce qui bouge, donc ce qu'on regarde en premier. */
  const t = d.temps;
  const vieMot = t.vie?.corpus?.en_un_mot;
  html += `<div class="carte">
    <div class="chapo">Où tu en es</div>
    <div class="grille">
      ${t.vie ? tuile('Ta traversée', t.vie.age_ans + ' ans', vieMot || '—', 'vie') : ''}
      ${tuileCycle('Ton année', t.annee.valeur, 9, t.annee.en_un_mot, 'annee')}
      ${tuileCycle('Ton mois', t.mois.valeur, 9, t.mois.en_un_mot || '—', 'mois')}
      ${tuile('Ta carte', d.cartes.naissance.nom, 'depuis toujours', 'carte')}
    </div>
    <p class="quoi" style="margin-top:12px">La traversée donne l'âge de la vie, l'année le chapitre,
      le mois la saison. Le jour, lui, vient du ciel — il change tout seul.</p>
  </div>`;

  /* Les nombres — jamais nus. */
  html += `<div class="carte">
    <div class="chapo">Tes nombres</div>
    <div class="grille">
      ${['cap','voix','foyer','elan'].map(c => {
        const n = d.nombres[c], nom = (LEX.termes?.[c]?.nom) || c;
        return tuile(nom, n.valeur + (n.maitre ? '' : ''), n.en_un_mot || '—', 'nombre:' + c);
      }).join('')}
    </div>
    ${d.chantiers.length ? `<p class="quoi" style="margin-top:12px">
      Tes chantiers : ${d.chantiers.join(', ')} — les qualités à bâtir plutôt qu'à déplorer.</p>` : ''}
  </div>`;

  /* Le ciel — l'essentiel, pas le tableau. */
  html += `<div class="carte">
    <div class="chapo">Ton ciel</div>
    <div class="grille">
      ${tuile('Le Soleil', signeOrne(d.trio.soleil.signe, 22), 'ce que tu es', 'astre:soleil', true)}
      ${tuile('La Lune', signeOrne(d.trio.lune.signe, 22), 'ce dont tu as besoin', 'astre:lune', true)}
      ${tuile('Ascendant', signeOrne(d.trio.asc.signe, 22), 'ta porte d\'entrée', 'astre:asc', true)}
    </div>
    <table style="margin-top:16px">
      ${d.element_dominant ? `<tr><td>Ce qui domine</td><td><b>${T(d.element_dominant)}</b></td>
        <td>ta couleur de fond</td></tr>` : ''}
      ${d.element_creux ? `<tr><td>En creux</td><td><b>${T(d.element_creux)}</b></td>
        <td>moins spontané, pas absent</td></tr>` : ''}
      ${d.equilibre ? `<tr><td>Équilibre</td><td><b>réparti</b></td>
        <td>aucune couleur ne domine</td></tr>` : ''}
      ${d.modalite ? `<tr><td>Ta façon</td><td><b>${T(d.modalite)}</b></td>
        <td>${T({Cardinal:'lancer', Fixe:'tenir', Mutable:'s\'adapter'}[d.modalite] || '')}</td></tr>` : ''}
      ${d.maitre_theme ? `<tr><td>Qui mène</td><td><b>${T(nomPlanete(d.maitre_theme.planete))}</b></td>
        <td>${T({solide: 'un appui solide', moyen: 'un appui correct, sans plus',
                 'en peine': 'un appui qui peine, pas un mauvais signe'}[d.maitre_theme.etat]
                 || d.maitre_theme.etat)}</td></tr>` : ''}
      ${d.en_vue ? `<tr><td>Ce qui se voit</td><td><b>${T(nomPlanete(d.en_vue.planete))}</b></td>
        <td>le plus fort du thème</td></tr>` : ''}
    </table>
  </div>`;

  /* Le signe chinois — 4e axe d'identité, après le ciel. */
  if (d.chinois) {
    const ch = d.chinois, mot = ch.portrait?.en_un_mot;
    html += `<div class="carte" id="c-chinois"${ch.portrait ? ' style="cursor:pointer"' : ''}>
      <div class="chapo">Ton signe chinois</div>
      <div style="font-family:var(--serif);font-size:26px;margin:6px 0 2px">${T(ch.signe)}</div>
      ${mot ? `<div class="motcle">${T(mot)}</div>` : ''}
      <p class="quoi" style="margin-top:10px">L'animal vient de ton année de naissance, l'élément le colore.${ch.portrait ? ' Touche pour le portrait.' : ''}</p>
    </div>`;
  }

  /* Le croisement — le seul endroit où les trois se parlent. */
  if (d.pont) {
    html += `<div class="carte">
      <div class="chapo">Le croisement</div>
      <p style="font-size:15px;color:var(--encre2)">
        Ta carte <b style="color:var(--encre)">${T(d.cartes.naissance.nom)}</b>
        pointe vers <b style="color:var(--encre)">${T(d.pont.cible)}</b>,
        et dans ton ciel réel : <span class="etat ${T(d.pont.etat)}">${T(nomEtat(d.pont.etat))}</span></p>
      <p class="quoi" style="margin-top:10px">C'est le seul endroit où tes nombres, tes cartes
        et ton ciel se parlent au lieu d'être posés côte à côte.</p>
      ${aide(`« ${nomEtat(d.pont.etat)} », ça veut dire quoi ?`, terme(d.pont.etat).quoi)}
    </div>`;
  }

  for (const av of (d.avis || [])) {
    html += `<div class="avis"><b>À trancher</b> — ${T(av.message)}</div>`;
  }
  $('#vue-apercu').innerHTML = html;

  $('#vue-apercu').querySelectorAll('[data-va]').forEach(el => el.onclick = () => {
    const [quoi, cle] = el.dataset.va.split(':');
    if (quoi === 'astre') { montrerVue('ciel'); setTimeout(() => ouvrirAstre(cle), 120); }
    else if (quoi === 'nombre') { montrerVue('portrait'); setTimeout(() =>
      $(`#vue-portrait [data-nombre="${cle}"]`)?.click(), 120); }
    else if (quoi === 'carte') { montrerVue('portrait'); setTimeout(() =>
      $('#vue-portrait #c-arcane')?.click(), 120); }
    else if (quoi === 'vie' || quoi === 'annee' || quoi === 'mois') { montrerVue('jour'); setTimeout(() =>
      $(`#vue-jour .tout-lire[data-cible="${quoi}"]`)?.click(), 120); }
    else { montrerVue('jour'); }
  });

  const cch = $('#c-chinois');
  if (cch && d.chinois?.portrait) cch.onclick = () => {
    const ch = d.chinois;
    ouvrirDetail({
      surtitre: 'Ton signe chinois',
      titre: ch.signe,
      motcle: ch.portrait.en_un_mot,
      resume: ch.portrait.resume,
      extra: `<div class="section"><h4>Le portrait</h4><p>${T(ch.portrait.portrait)}</p></div>`
        + (ch.nuance ? `<div class="section"><h4>L'élément ${T(ch.element)}${ch.nuance.en_un_mot ? ' · ' + T(ch.nuance.en_un_mot) : ''}</h4><p>${T(ch.nuance.nuance)}</p></div>` : ''),
    });
  };
}

/* ═══════════════════════════════════════════════════════════
   LE PORTRAIT
   ═══════════════════════════════════════════════════════════ */
async function chargerPortrait() {
  const p = await (await fetch(`/api/portrait/${profilId}`)).json();
  const tx = p.textes || {};
  let html = '';

  for (const av of (p.theme?.avis || [])) {
    html += `<div class="avis"><b>À trancher</b> — ${T(av.message)}</div>`;
  }
  if (p.complet === false) {
    html += `<div class="avis"><b>Lecture partielle</b> — sans heure ni lieu de naissance,
      pas d'Ascendant ni de maisons : ce portrait s'en tient aux nombres et aux cartes.
      <button class="bouton discret" id="pf-completer" style="margin-top:8px">Ajouter l'heure et le lieu</button></div>`;
  }

  /* La carte */
  const na = p.cartes.naissance, pont = p.ponts.naissance;
  html += `<div class="carte">
    <div class="chapo">Ta carte</div>
    <div class="arcane" id="c-arcane">
      <img class="vignette" src="${urlCarte(na.numero)}" alt="${T(na.nom)}">
      <div class="corps">
        <div class="num">${na.numero === 22 ? 0 : na.numero}</div>
        <div class="nom">${T(na.nom)}</div>
        <div class="corr">côté ciel : ${T(na.correspondance[1])}</div>
        <div class="plus" style="margin-top:10px">tout lire →</div>
      </div>
    </div>
    ${aide("C'est quoi, « ta carte » ?", terme('carte_naissance').quoi, terme('carte_naissance').d_ou)}`;

  if (pont) {
    html += `<div class="pont">
      <span class="etat ${T(pont.etat)}">${T(nomEtat(pont.etat))}</span>
      <p style="margin-top:8px">Ta carte pointe vers <span class="cible">${T(pont.cible)}</span>.
        Dans ton ciel de naissance : ${T(traduireRaisons(pont.raisons))}.</p>
      ${tx.arcane_naissance?.lecture_etat
        ? `<p style="margin-top:10px">${T(tx.arcane_naissance.lecture_etat)}</p>` : ''}
      ${aide(`« ${nomEtat(pont.etat)} », ça veut dire quoi ?`, terme(pont.etat).quoi)}
    </div>`;
  }
  html += `</div>`;

  /* Les nombres — chacun nommé, chacun cliquable */
  html += `<div class="carte"><div class="chapo">Tes nombres</div>`;
  for (const cle of ['cap','voix','foyer','elan']) {
    const n = p.nombres[cle], a = p.accords[cle], t = terme(cle);
    const det = tx[cle]?.detail;
    const motcle = det?.en_un_mot;
    const her = (n.heritages || []).map(h =>
      `<span class="heritage">héritage ${h}</span>`).join('');
    html += `<div class="nombre" data-nombre="${cle}">
      <div class="val">${n.valeur}</div>
      <div style="flex:1">
        <div class="nom">${T(t.nom || cle)}</div>
        ${motcle ? `<div class="motcle">${T(motcle)}</div>` : ''}
        <div class="txt">${T(t.quoi || '')}</div>
        ${n.maitre ? `<div class="txt" style="margin-top:4px">Ce nombre vibre fort :
          il se lit ${n.maitre}, et se ramène à ${n.base}.</div>` : ''}
        <div style="margin-top:8px">
          ${a ? `<span class="etat ${T(a.etat)}">${T(nomEtat(a.etat))}</span>` : ''}
          ${her}
        </div>
      </div>
      <div class="plus">${det ? 'tout lire →' : ''}</div>
    </div>`;
  }
  html += `${aide("C'est quoi, ces nombres ?",
    "Ils se calculent à partir de ta date de naissance et des lettres de ton nom. Chacun éclaire une facette : ta direction, ta façon de t'exprimer, ton centre, ton énergie d'ensemble.")}
    ${aide("Et le petit badge « ton ciel appuie » ?",
      "À côté de chaque nombre, Ta Trame regarde ton ciel de naissance et dit s'il le renforce (il appuie), le complique (il te bouscule), ou reste neutre. Aucun des trois n'est un verdict. C'est juste là qu'il y a du travail, donc là que c'est intéressant.")}
  </div>`;

  /* Les héritages — jamais un nombre nu */
  const tousHeritages = [...new Set(['cap','voix','foyer','elan']
    .flatMap(c => p.nombres[c].heritages || []))];
  if (tousHeritages.length) {
    const th = terme('heritages');
    html += `<div class="carte">
      <div class="chapo">${T(th.nom)}</div>
      <p style="font-size:15px;color:var(--encre2)">${T(th.quoi)}</p>
      <p class="quoi" style="margin-top:8px">${T(th.pourquoi_ce_mot || '')}</p>
      <div style="margin-top:14px">`;
    for (const h of tousHeritages) {
      const ht = tx.heritages?.[h];
      html += `<div class="nombre" data-heritage="${h}"${ht ? ' style="cursor:pointer"' : ''}>
        <div class="val">${h}</div>
        <div style="flex:1">
          <div class="nom">Héritage ${h}</div>
          ${ht?.en_un_mot ? `<div class="motcle">${T(ht.en_un_mot)}</div>` : ''}
          ${ht?.resume ? `<div class="txt">${T(ht.resume)}</div>` : ''}
        </div>
        <div class="plus">${ht ? 'tout lire →' : ''}</div>
      </div>`;
    }
    html += `</div>`;
    if (!tx.heritages || !Object.keys(tx.heritages).length)
      html += `<div class="trou">Le détail de chaque héritage n'est pas encore écrit.</div>`;
    html += `</div>`;
  }

  /* Ta période — le Soleil affiné en 48 sous-périodes (additif au signe) */
  const per = tx.periode_soleil;
  if (per) {
    html += `<div class="carte" data-periode="1" style="cursor:pointer">
      <div class="chapo">Ta période</div>
      <div class="nombre">
        <div style="flex:1">
          <div class="nom">${T(per.nom)}</div>
          <div class="txt">${T(per.essence)}</div>
        </div>
        <div class="plus">tout lire →</div>
      </div>
    </div>`;
  }

  /* Ton axe — d'où tu viens (nœud sud) vers où tu vas (nœud nord) */
  const ax = tx.noeuds;
  if (ax && ax.sud?.texte && ax.nord?.texte) {
    html += `<div class="carte" data-axe="1" style="cursor:pointer">
      <div class="chapo">Ton axe</div>
      <div class="nombre">
        <div style="flex:1">
          <div class="nom">${signeOrne(ax.sud.signe)} → ${signeOrne(ax.nord.signe)}</div>
          <div class="txt">D'où tu viens, où tu vas.</div>
        </div>
        <div class="plus">tout lire →</div>
      </div>
    </div>`;
  }

  /* Tes leviers — les lois-appuis du but de vie (distillées de Millman),
     routées par la base du Cap. Ce ne sont pas des règles : des points sur
     lesquels agir quand le moment s'y prête. */
  const lois = tx.lois || [];
  if (lois.length) {
    html += `<div class="carte">
      <div class="chapo">Tes leviers</div>
      <p style="font-size:15px;color:var(--encre2)">Des points de repère qui
        travaillent ta direction de fond. On les actionne quand on veut, ce ne
        sont pas des consignes.</p>
      <div style="margin-top:14px">`;
    lois.forEach((L, i) => {
      html += `<div class="nombre" data-loi="${i}" style="cursor:pointer">
        <div style="flex:1">
          <div class="nom">${T(L.nom)}</div>
          <div class="txt">${T(L.en_un_mot)}</div>
        </div>
        <div class="plus">tout lire →</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  /* Les chantiers — chacun nommé, jamais un chiffre nu */
  const ch = p.nombres.appuis.chantiers, tc = terme('chantiers');
  if (ch.length) {
    html += `<div class="carte">
      <div class="chapo">${T(tc.nom)}</div>
      <p style="font-size:15px;color:var(--encre2)">${T(tc.quoi)}</p>
      <div style="margin-top:14px">`;
    for (const v of ch) {
      const q = LEX.qualites?.[v] || {};
      html += `<div class="nombre">
        <div class="val">${v}</div>
        <div style="flex:1">
          <div class="nom">${T(q.nom || v)}</div>
          ${q.quoi ? `<div class="txt">${T(q.quoi)}</div>` : ''}
        </div>
      </div>`;
    }
    html += `</div>
      <p class="quoi" style="margin-top:10px">${T(tc.pourquoi_ce_mot || '')}</p>
      ${aide("D'où ça vient ?", tc.d_ou)}
    </div>`;
  }

  html += `<div class="note">${T(p.attribution)}<br>
    Ta Trame ne prédit pas. L'astrologie n'a aucune validité prédictive démontrée —
    ce que tu lis est un miroir pour t'examiner, et sa valeur est dans la
    réflexion qu'il déclenche.</div>`;

  $('#vue-portrait').innerHTML = html;

  const pfCompleter = $('#pf-completer');
  if (pfCompleter) pfCompleter.onclick = async () => {
    editionDe = profilId;
    ouvrirFormulaire(await (await fetch(`/api/profil/${profilId}`)).json());
  };

  /* les clics */
  $('#vue-portrait').querySelectorAll('[data-nombre]').forEach(el => el.onclick = () => {
    const cle = el.dataset.nombre, n = p.nombres[cle], t = terme(cle);
    const d = tx[cle];
    ouvrirDetail({
      surtitre: `${t.nom} · ${n.valeur}`,
      titre: t.nom,
      motcle: d?.detail?.en_un_mot,
      intro: t.quoi,
      resume: d?.detail?.resume,
      detail: d?.detail,
      court: d?.court,
      avant: `<div class="section douce"><h4>D'où vient ce nombre</h4><p>${T(t.d_ou || '')}</p></div>`,
    });
  });
  $('#vue-portrait').querySelectorAll('[data-heritage]').forEach(el => el.onclick = () => {
    const ht = tx.heritages?.[el.dataset.heritage];
    if (!ht) return;
    ouvrirDetail({
      surtitre: `Héritage ${el.dataset.heritage}`,
      titre: `Héritage ${el.dataset.heritage}`,
      motcle: ht.en_un_mot,
      resume: ht.resume,
      detail: ht,
      extra: `<div class="section douce"><h4>Un héritage, pas une dette</h4>
        <p>${T(terme('heritages').pourquoi_ce_mot || '')}</p></div>`,
    });
  });
  const carPeriode = $('#vue-portrait [data-periode]');
  if (carPeriode) carPeriode.onclick = () => ouvrirDetail({
    surtitre: 'Ta période',
    titre: per.nom,
    motcle: per.nom,
    intro: per.essence,
    resume: per.texte,
    detail: {},
    extra: `<div class="section douce"><h4>D'où vient cette lecture</h4>
      <p>Le Soleil ne dit pas qu'un signe : sa position précise le place dans
      l'une des 48 sous-périodes du zodiaque, qui affine ton signe sans le
      remplacer. Ce n'est jamais un remplacement du portrait de ton signe,
      seulement un cran de plus.</p></div>`,
  });
  const carAxe = $('#vue-portrait [data-axe]');
  if (carAxe) carAxe.onclick = () => ouvrirDetail({
    surtitre: 'Ton axe',
    titre: `${T(ax.sud.signe)} → ${T(ax.nord.signe)}`,
    motcle: `${T(ax.sud.signe)} → ${T(ax.nord.signe)}`,
    intro: "D'où tu viens, où tu vas.",
    detail: {},
    extra: `<div class="section douce"><h4>D'où tu viens (${T(ax.sud.signe)})</h4>
        <p>${T(ax.sud.texte)}</p></div>
      <div class="section douce"><h4>Où tu vas (${T(ax.nord.signe)})</h4>
        <p>${T(ax.nord.texte)}</p></div>
      <div class="section douce"><h4>C'est quoi, cet axe ?</h4>
        <p>Deux points opposés du ciel, calculés à ta naissance. Le premier
        est un acquis, un sillon déjà creusé et confortable. Le second est un
        cap, pas une obligation : une direction où grandir. Les deux
        comptent — on n'abandonne pas l'un pour l'autre, on les tient
        ensemble.</p></div>`,
  });
  $('#vue-portrait').querySelectorAll('[data-loi]').forEach(el => el.onclick = () => {
    const L = (tx.lois || [])[el.dataset.loi];
    if (!L) return;
    ouvrirDetail({
      surtitre: 'Ton levier',
      titre: L.nom,
      motcle: L.en_un_mot,
      extra: `<div class="section"><h4>Le principe</h4><p>${T(L.le_principe)}</p></div>
        <div class="section"><h4>Le pas</h4><p>${T(L.le_pas)}</p></div>
        <div class="section douce"><h4>D'où vient cette lecture</h4>
          <p>Ces leviers relient ta date de naissance à ta direction de fond.
          Ce ne sont pas des consignes, seulement des appuis à essayer quand le

  const arc = $('#c-arcane');
  if (arc) arc.onclick = () => ouvrirDetail({

    titre: na.nom,

    court: tx.arcane_naissance,

/* Les raisons viennent du moteur en langage technique — on les traduit. */
function traduireRaisons(raisons) {
  return (raisons || []).map(r => r
    .replace(/\bson maître (\w+)\b/g, (_, p) => `sa planète maîtresse, ${nomPlanete(p)},`)
    .replace(/\bhabité par (\w+)\b/g, (_, p) => `${nomPlanete(p)} s'y trouve`)
    .replace(/\b(soleil|lune|mercure|venus|mars|jupiter|saturne|uranus|neptune|pluton)\b/g,
             (_, p) => nomPlanete(p))
  ).join(' · ');
}

/* ═══════════════════════════════════════════════════════════
   LE CIEL — l'idée globale d'abord, le détail à la demande.
   « Une idée globale, mais qu'on peut facilement aller en demander plus. »
   Le tableau seul ne disait rien : treize lignes de chiffres, aucun sens.
   ═══════════════════════════════════════════════════════════ */
let CIEL = null;

async function chargerCiel() {
  const d = await (await fetch(`/api/ciel/${profilId}`)).json();
  if (d.complet === false) {
    $('#vue-ciel').innerHTML = msgThemeIncomplet();
    câblerMsgThemeIncomplet();
    return;
  }
  CIEL = d;
  const t = d.theme, s = d.synthese, g = d.globaux || {};
  let html = '';

  /* 1 — LE TRIO. Le plus parlant, donc le premier. */
  const tr = s.trio;
  html += `<div class="carte">
    <div class="chapo">L'essentiel, en trois traits</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      ${[['soleil', tr.soleil.signe, 'ce que tu es au fond'],
         ['lune', tr.lune.signe, 'ce dont tu as besoin'],
         ['asc', tr.asc.signe, 'la porte que les autres voient']].map(([cle, signe, quoi]) =>
        `<div class="trio-bloc" data-astre="${cle}">
          <div class="trio-nom">${T(nomPlanete(cle))}</div>
          ${iconoSigne(signe, 28) ? `<div class="trio-glyphe">${iconoSigne(signe, 28)}</div>` : ''}
          <div class="trio-signe">${T(signe)}</div>
          <div class="trio-quoi">${T(quoi)}</div>
        </div>`).join('')}
    </div>
    ${g.trio ? `<p style="font-size:14px;color:var(--encre2)">${T(g.trio.texte)}</p>` : ''}
  </div>`;

  /* 2 — CE QUI DOMINE, CE QUI MANQUE. */
  for (const [cle, bloc] of Object.entries(g)) {
    if (!bloc || !cle.includes('.')) continue;
    html += `<div class="carte">
      <div class="chapo">${T(bloc.titre || '')}</div>
      <p style="font-size:15px;color:var(--encre2)">${T(bloc.texte)}</p>
    </div>`;
  }

  /* 3 — LES CONCENTRATIONS. */
  if (s.stelliums.length && g.stellium) {
    html += `<div class="carte">
      <div class="chapo">${T(g.stellium.titre || 'Une concentration')}</div>
      ${s.stelliums.map(st => `<p style="font-family:var(--serif);font-size:18px;margin-bottom:8px">
        ${st.corps.map(c => T(nomPlanete(c))).join(', ')} — tous en ${T(st.signe)}</p>`).join('')}
      <p style="font-size:14px;color:var(--encre2)">${T(g.stellium.texte)}</p>
    </div>`;
  }

  /* 4 — QUI MÈNE, QUI SE VOIT. */
  if (s.maitre && g.maitre) {
    html += `<div class="carte" data-astre="${T(s.maitre.planete)}" style="cursor:pointer">
      <div class="chapo">${T(g.maitre.titre || 'Qui mène')}</div>
      <p style="font-family:var(--serif);font-size:18px;margin-bottom:8px">
        ${T(nomPlanete(s.maitre.planete))}, en ${T(s.maitre.signe)},
        dans ${T(nomMaison(s.maitre.maison))} — ${T(s.maitre.etat)}</p>
      <p style="font-size:14px;color:var(--encre2)">${T(g.maitre.texte)}</p>
      <div class="plus" style="margin-top:10px">tout lire →</div>
    </div>`;
  }
  if (s.en_vue && g.en_vue) {
    html += `<div class="carte" data-astre="${T(s.en_vue.planete)}" style="cursor:pointer">
      <div class="chapo">${T(g.en_vue.titre || 'Ce qui se voit le plus')}</div>
      <p style="font-family:var(--serif);font-size:18px;margin-bottom:8px">
        ${T(nomPlanete(s.en_vue.planete))}, en ${T(s.en_vue.signe)},
        dans ${T(nomMaison(s.en_vue.maison))}</p>
      <p style="font-size:14px;color:var(--encre2)">${T(g.en_vue.texte)}</p>
      <div class="plus" style="margin-top:10px">tout lire →</div>
    </div>`;
  }

  /* 5 — LE DÉTAIL, à la demande. Chaque ligne se lit. */
  html += `<div class="carte">
    <div class="chapo">Chaque astre, un par un</div>
    <p class="quoi" style="margin:-4px 0 14px">Touche une ligne pour la lire en entier.</p>`;
  for (const [nom, a] of Object.entries(d.astres)) {
    const dispo = a.textes.signe || a.textes.maison;
    html += `<div class="nombre" data-astre="${T(nom)}" style="gap:12px;padding:12px;margin:0 -12px">
      <div style="flex:1">
        <div class="motcle" style="font-size:16px">${T(nomPlanete(nom))} en ${T(a.signe)}
          ${a.retrograde ? '<span class="retro">℞</span>' : ''}</div>
        <div class="txt">${T(quoiPlanete(nom))}${a.maison ? ' · ' + T(nomMaison(a.maison)) : ''}</div>
      </div>
      <div class="plus">${dispo ? 'lire →' : ''}</div>
    </div>`;
  }
  html += `${aide('Comment lire cette liste ?',
    "Chaque ligne dit trois choses : l'astre (la fonction), son signe (comment elle s'exprime) et le domaine de ta vie où elle se joue. Le signe ℞ veut dire que l'astre semblait reculer dans le ciel ce jour-là.")}
  </div>`;

  if (d.manque && d.manque.length) {
    html += `<div class="trou">Corpus en construction — rien d'écrit pour : ${d.manque.map(T).join(', ')}.</div>`;
  }
  if (t.maisons.repli) {
    html += `<div class="avis"><b>Découpage dégradé</b> — ${T(t.maisons.repli)}.
      Ton lieu de naissance est trop au nord : le découpage habituel n'y est pas
      défini mathématiquement. On a basculé sur une méthode toujours valide —
      les angles, eux, restent exacts.</div>`;
  }
  for (const l of (t.limites || [])) html += `<div class="trou">${T(l)}</div>`;
  html += `<div class="note">${T(d.attribution)}</div>`;

  $('#vue-ciel').innerHTML = html;
  $('#vue-ciel').querySelectorAll('[data-astre]').forEach(el =>
    el.onclick = e => { if (!e.target.closest('details')) ouvrirAstre(el.dataset.astre); });
}

/* Le panneau d'un astre : ses DEUX lectures additionnées, puis ses liens.
   Signe = comment · Maison = où. Jamais leur produit — ce serait 120 × 120. */
function ouvrirAstre(nom) {
  const a = CIEL.astres[nom];
  if (!a) return;
  const ts = a.textes.signe, tm = a.textes.maison;

  let html = '';
  if (ts) {
    html += `<div class="section"><h4>Comment ça s'exprime — en ${signeOrne(a.signe)}</h4>
      <p>${T(ts.comment_ca_marche)}</p></div>`;
    if (ts.au_quotidien) html += `<div class="section"><h4>Au quotidien</h4><p>${T(ts.au_quotidien)}</p></div>`;
    if (ts.le_revers) html += `<div class="section"><h4>Le revers</h4><p>${T(ts.le_revers)}</p></div>`;
    if (ts.generationnel) {
      html += `<div class="section douce"><h4>À savoir : ce n'est pas personnel</h4>
        <p>${T(ts.generationnel)}</p></div>`;
    }
  }
  if (tm) {
    html += `<div class="section" style="border-top:1px solid var(--bord);padding-top:22px">
      <h4>Où ça se joue — ${T(nomMaison(a.maison))}</h4><p>${T(tm.ou_ca_se_joue)}</p></div>`;
    if (tm.au_quotidien) html += `<div class="section"><h4>Au quotidien, sur ce terrain</h4><p>${T(tm.au_quotidien)}</p></div>`;
    if (tm.le_revers) html += `<div class="section"><h4>Quand ce terrain sature</h4><p>${T(tm.le_revers)}</p></div>`;
    if (tm.pourquoi_c_est_personnel) {
      html += `<div class="section douce"><h4>Pourquoi ceci, c'est vraiment à toi</h4>
        <p>${T(tm.pourquoi_c_est_personnel)}</p></div>`;
    }
  }

  /* Les liens — additifs eux aussi : on nomme, on n'invente pas un récit. */
  const liens = a.textes.aspects || [];
  if (liens.length) {
    html += `<div class="section"><h4>Ses liens dans ton ciel</h4>
      ${liens.map(l => {
        const titre = `${T(nomPlanete(nom))} <b style="color:var(--encre)">${T(nomAspect(l.classe))}</b> ${T(nomPlanete(l.autre))}`;
        // Un lien avec texte de corpus se déplie ; sinon la ligne courte du lexique.
        if (l.corpus) {
          return `<div class="lien" data-lien="1" style="margin-bottom:8px">
            <div>${titre} <span style="color:var(--encre3)">· ${T(l.corpus.en_bref || '')}</span></div>
            <p class="lien-texte cacher" style="font-size:14px;color:var(--encre2);margin-top:6px">${T(l.corpus.texte)}</p>
          </div>`;
        }
        return `<p style="margin-bottom:6px">${titre}
          <span style="color:var(--encre3)">· ${T((LEX.aspects?.[l.classe]?.quoi) || '')}</span></p>`;
      }).join('')}
      <p class="quoi" style="margin-top:10px">Touche un lien pour le lire en entier.
        Ta Trame ne les fond pas en un récit unique. Chaque lecture s'additionne, aucune n'écrase l'autre.</p>
    </div>`;
  }

  if (!ts && !tm) {
    html += `<div class="trou">Le texte détaillé n'est pas encore écrit pour cet astre.
      Le corpus se construit par vagues — l'app le dit plutôt que de faire semblant.</div>`;
  }

  ouvrirDetail({
    surtitre: `${nomPlanete(nom)} · ${a.degre}° ${a.signe} ${a.minute}'`,
    titre: nomPlanete(nom),
    motcle: `${nomPlanete(nom)} en ${a.signe}`,
    resume: ts?.resume || quoiPlanete(nom),
    extra: html,
  });
}

/* ═══════════════════════════════════════════════════════════
   LES RÈGLES
   ═══════════════════════════════════════════════════════════ */
async function chargerRegles() {
  const c = await (await fetch('/api/conventions')).json();
  const ORDRE = ['determinisme','accents','trait_union','apostrophes',
                 'particules','annee_personnelle','mois_personnel','jour_personnel',
                 'maisons','ephemerides'];
  const TITRE = {
    determinisme:'Toujours le même calcul', accents:'Les accents', trait_union:"Le trait d'union",
    apostrophes:'Les apostrophes', particules:'Les particules',
    annee_personnelle:"L'année personnelle", mois_personnel:'Le mois personnel',
    jour_personnel:'Le jour personnel', maisons:'Les maisons', ephemerides:'Les éphémérides',
  };
  const SOURCE = {
    'imprimé':'Documenté dans nos ouvrages de référence',
    'tranché par Ta Trame':'Tranché par Ta Trame — non documenté ailleurs',
    'tranché par Ta Trame, appuyé sur les sources':'Tranché par Ta Trame, appuyé sur nos ouvrages de référence',
    'consensus des ouvrages':'Consensus des ouvrages',
    'domaine public':'Donnée publique', 'conception':'Choix de conception',
  };
  let html = `<div class="carte">
    <div class="chapo">Pourquoi cette page existe</div>
    <p style="font-size:15px;color:var(--encre2)">
      Deux numérologues peuvent donner deux résultats différents pour
      ton nom — et aucune app ne dit laquelle des règles elle applique.
      Ta Trame dit les siennes. Même profil, même date, même lecture, toujours —
      et les publier est ce qui rend cette promesse vérifiable.
    </p></div>`;
  for (const cle of ORDRE) {
    const r = c[cle]; if (!r) continue;
    const tranche = r.source.startsWith('tranché');
    html += `<div class="carte">
      <div class="chapo">${TITRE[cle]}</div>
      <p style="font-family:var(--serif);font-size:17px;margin-bottom:10px">${T(r.regle)}</p>
      <p style="font-size:14px;color:var(--encre2)">${T(r.detail)}</p>
      <div style="margin-top:12px">
        <span class="etat ${tranche ? 'tension' : 'resonance'}">${T(SOURCE[r.source] || r.source)}</span>
      </div>
    </div>`;
  }
  $('#vue-regles').innerHTML = html;
}

      <input id="rc-nom" placeholder="Nom" style="flex:1;min-width:110px">
      <select id="rc-genre" style="flex:none;width:auto" title="Facultatif — accorde les textes des Relations">

      <p class="quoi" style="width:100%;margin:6px 0 0">Le reste est facultatif — sans lui, la lecture s'en tient aux nombres et au signe chinois.</p>
      <input id="rc-heure" type="number" placeholder="Heure" min="0" max="23" style="width:70px">

function câblerLieuContact() {
  lieuChoisiRC = null;
  let minuteur;
  $('#rc-lieu').addEventListener('input', e => {
    clearTimeout(minuteur); lieuChoisiRC = null;
    const q = e.target.value.trim();
    if (q.length < 2) { $('#rc-suggestions').classList.add('cacher'); return; }
    minuteur = setTimeout(async () => {
      const r = await (await fetch('/api/lieux?q=' + encodeURIComponent(q))).json();
      const boite = $('#rc-suggestions');
      if (!r.length) { boite.classList.add('cacher'); return; }
      boite.innerHTML = r.map((l, i) =>
        `<div data-i="${i}">${T(l.nom)}
          <small>${T(l.pays)}/${T(l.admin1 || '—')} · ${l.lat.toFixed(2)}, ${l.lon.toFixed(2)}</small>
        </div>`).join('');
      boite.classList.remove('cacher');
      boite.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => {
        lieuChoisiRC = r[+d.dataset.i];
        $('#rc-lieu').value = lieuChoisiRC.nom;
        boite.classList.add('cacher');
      });
    }, 180);
  });
}

async function creerContactRelation() {
  const jo = parseInt($('#rc-jour').value, 10), mo = parseInt($('#rc-mois').value, 10),
        an = parseInt($('#rc-annee').value, 10);
  if (!jo || !mo || !an) { alert('Jour, mois et année sont nécessaires.'); return; }
  if ($('#rc-lieu').value.trim() && !lieuChoisiRC) {
    alert('Choisis un lieu dans la liste, ou laisse le champ vide — les homonymes sont fréquents.');
    return;
  }
  const id = 'c-' + Date.now().toString(36);
  const prenoms_nom = [$('#rc-prenom').value, $('#rc-nom').value].map(s => s.trim()).filter(Boolean);
  const corps = { id, jour: jo, mois: mo, annee: an, prenoms_nom, genre: $('#rc-genre').value || 'x' };
  if (lieuChoisiRC) {
    corps.lieu_id = lieuChoisiRC.id;
    corps.heure = parseInt($('#rc-heure').value, 10) || 0;
    corps.minute = parseInt($('#rc-minute').value, 10) || 0;
  }
  const r = await fetch('/api/contact', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corps),
  });
  const d = await r.json();
  if (!r.ok) { alert(d.erreur || 'La création a échoué.'); return; }
  relContacts = null;
  relB = { genre: 'contact', id };
  vueRelations();
}

async function chargerRelationsResultat() {
  const zone = $('#rel-resultat');
  if (!relB) { zone.innerHTML = ''; return; }
  zone.innerHTML = `<div class="carte"><p class="quoi">Ça se calcule…</p></div>`;
  const roleParam = relType === 'parent_enfant' ? `&role=${relRole}` : '';
  const r = await fetch(`/api/relations/${encodeURIComponent(profilId)}/${relB.genre}/${encodeURIComponent(relB.id)}?type=${relType}${roleParam}`);
  const d = await r.json();
  if (!r.ok) { zone.innerHTML = `<div class="carte"><p class="quoi">${T(d.erreur || "Cette lecture n'est pas disponible.")}</p></div>`; return; }

  const ax = d.resultat.axes, tx = d.textes, synth = d.resultat.synthese;
  const LABEL_ETAT_REL = { resonance: 'appui', tension: 'bouscule', neutre: 'neutre', mixte: 'mixte' };
  const badge = etat => `<span class="etat ${T(etat)}">${T(LABEL_ETAT_REL[etat] || etat)}</span>`;

  /* La synthèse d'intro : l'amorce du climat, puis les points les plus forts
     NOMMÉS (top appui, top bouscule choisis par le moteur), avec leur contenu
     précis. Déterministe : rien n'est rédigé à la volée, on cite les en_bref
     déjà calculés. Étiquettes d'axe dans rel_synthese.json::axes. */
  const labelsAxe = (tx.synthese || {}).axes || {};
  const clauseAxe = (nom, etat) => {
    if (nom === 'nombres') return (tx.nombres.paire || {}).en_bref || '';
    if (nom === 'chinois') return (tx.chinois.branche || {}).en_bref || '';
    if (nom === 'synastrie') {
      const n = (tx.synastrie || []).length;
      return `${n} lien${n > 1 ? 's' : ''} serré${n > 1 ? 's' : ''} entre vos deux thèmes`;
    }
    if (nom === 'elements') {
      const n = (tx.elements || []).filter(p => p.etat === etat).length;
      return etat === 'resonance'
        ? `${n} de vos fonctions vont dans le même sens`
        : `${n} de vos fonctions tirent chacune de leur côté`;
    }
    return '';
  };
  const pointLigne = (amorce, nom, etat) => {
    if (!nom || !labelsAxe[nom]) return '';
    let c = clauseAxe(nom, etat);
    if (!c) return '';
    c = c.replace(/\s*\.\s*$/, '');               // pas de double point final
    c = c.charAt(0).toLowerCase() + c.slice(1);   // s'enchaîne après la virgule
    return `<p style="margin:2px 0;font-size:15px;color:var(--encre2)"><strong>${amorce} :</strong> ${T(labelsAxe[nom])}, ${T(c)}.</p>`;
  };
  // Pur appui (aucun relief) : on nomme un second appui pour rester à 2-3 phrases.
  const secondAppui = (!synth.top_bouscule && (synth.appuis || [])[1]) ? synth.appuis[1] : null;

  let html = `<div class="carte">
    <div class="chapo">${T(d.nom_a)} — ${T(d.nom_b)}</div>
    <p style="font-family:var(--serif);font-size:17px;margin-bottom:8px">${T((tx.synthese.dominante || {}).note || tx.synthese.dominante || '')}</p>
    <div style="margin:0 0 8px">${badge(synth.climat)}</div>
    ${pointLigne('En appui', synth.top_appui, 'resonance')}
    ${secondAppui ? pointLigne('Et aussi', secondAppui, 'resonance') : ''}
    ${pointLigne('Ça bouscule', synth.top_bouscule, 'tension')}
    ${tx.type ? `<p class="quoi" style="margin-top:10px">${T(tx.type.cadrage)}</p>` : ''}
    ${!d.complet_b ? `<p class="quoi">Sans heure ni lieu de naissance de ${T(d.nom_b)}, le ciel entre vous n'est pas calculable — cette lecture reste aux nombres et au signe chinois.</p>` : ''}
  </div>`;

  if (tx.pouls) {
    const pl = tx.pouls;
    html += `<div class="carte" style="border-left:3px solid var(--accent-doux)">
      <div class="chapo">Le pouls du jour</div>
      <p class="quoi" style="margin:-2px 0 8px">${T(pl.cadre)}</p>
      <p style="font-family:var(--serif);font-size:17px;margin-bottom:6px">Aujourd'hui, ${T(pl.planete_jour)} touche ${T(pl.point)}.</p>
      <p style="font-size:15px;color:var(--encre2)">${T(pl.climat)}</p>
      <p class="quoi">${T(pl.pied)}</p>
    </div>`;
  }

  html += `<div class="jour-groupe">${tiroir({
    nom: 'Vos nombres', resume: (tx.nombres.paire || {}).en_bref || '',
    corps: `
      ${ax.nombres.identiques
        ? `<p>${T((tx.nombres.paire || {}).meme || '')}</p>`
        : `<p><strong>${T(d.nom_a)} :</strong> ${T((tx.nombres.paire || {}).vers_min || '')}</p>
           <p><strong>${T(d.nom_b)} :</strong> ${T((tx.nombres.paire || {}).vers_max || '')}</p>`}
      ${(tx.nombres.paire || {}).atouts ? `<p><strong>Ça porte :</strong> ${T(tx.nombres.paire.atouts)}</p>` : ''}
      ${(tx.nombres.paire || {}).frictions ? `<p><strong>Ça bouscule :</strong> ${T(tx.nombres.paire.frictions)}</p>` : ''}
      ${(tx.nombres.paire || {}).conditions ? `<p><strong>Pour que ça marche :</strong> ${T(tx.nombres.paire.conditions)}</p>` : ''}
      ${(tx.nombres.harmonique || {}).note ? `<p class="quoi">${T(tx.nombres.harmonique.note)}</p>` : ''}`,
  })}</div>`;

  /* Votre nombre commun — le composé (Millman) : le « vous » vu par les
     nombres, à côté du croisement. Somme des deux directions de fond, réduite. */
  if (tx.nombres.composite) {
    const cn = tx.nombres.composite;
    html += `<div class="jour-groupe">${tiroir({
      nom: 'Votre nombre commun', resume: cn.en_bref || '',
      corps: `
        <p class="quoi">Votre lien forme une troisième présence, avec son propre
          chemin. Ce nombre naît de la somme de vos deux directions de fond.</p>
        ${cn.le_but ? `<p><strong>Ce que ce lien porte :</strong> ${T(cn.le_but)}</p>` : ''}
        ${cn.l_atout ? `<p><strong>Sa force :</strong> ${T(cn.l_atout)}</p>` : ''}
        ${cn.le_piege ? `<p><strong>Son piège :</strong> ${T(cn.le_piege)}</p>` : ''}
        ${cn.la_question ? `<p class="quoi">${T(cn.la_question)}</p>` : ''}`,
    })}</div>`;
  }

  if (tx.elements && tx.elements.length) {
    html += `<div class="jour-groupe">${tiroir({
      nom: 'Vos éléments',
      resume: `${tx.elements.filter(p => p.etat === 'resonance').length} appuis, ${tx.elements.filter(p => p.etat === 'tension').length} reliefs`,
      corps: tx.elements.map(p => `<div class="ligne-rel">${badge(p.etat)} ${T(p.texte)}</div>`).join(''),
    })}</div>`;
  }

  html += `<div class="jour-groupe">${tiroir({
    nom: 'Côté chinois', resume: (tx.chinois.branche || {}).en_bref || '',
    corps: `
      <p>${badge(ax.chinois.etat)} ${T((tx.chinois.branche || {}).texte || '')}</p>
      ${(tx.chinois.element || {}).texte ? `<p class="quoi">${T(tx.chinois.element.texte)}</p>` : ''}`,
  })}</div>`;

  if (tx.synastrie && tx.synastrie.length) {
    const provenance = `<details class="aide" style="margin-top:12px"><summary>D'où vient ceci ?</summary>
      <p>Chaque ligne compare un point du thème de ${T(d.nom_a)} à un point du thème de ${T(d.nom_b)}. Plus l'écart (l'orbe) est petit, plus le lien est net — on montre les plus serrés d'abord.</p>
      <ul style="margin:6px 0 0;padding-left:18px">${tx.synastrie.map(a => `<li style="margin:3px 0">${T(a.detail)}</li>`).join('')}</ul></details>`;
    html += `<div class="jour-groupe">${tiroir({
      nom: 'Entre vos ciels',
      resume: `${tx.synastrie.length} liens serrés entre vos deux thèmes`,
      corps: (tx.synastrie_intro ? `<p class="quoi" style="margin:0 0 10px">${T(tx.synastrie_intro)}</p>` : '')
        + tx.synastrie.map(a => `<div class="ligne-rel">${T(a.texte)}</div>`).join('') + provenance,
    })}</div>`;
  }

  if (tx.composite) {
    const co = tx.composite;
    html += `<div class="jour-groupe">${tiroir({
      nom: 'Le vous', resume: 'Le portrait de votre lien comme troisième présence',
      corps: `
        <p class="quoi">${T(co.cadrage)}</p>
        ${co.luminaires.map(l => `<div class="ligne-rel"><strong>${T(l.amorce)} — ${T(l.signe)} :</strong> ${T((l.fond || {}).resume || '')}</div>`).join('')}
        ${co.aspects.length ? `<p style="margin-top:14px"><strong>${T(co.amorce_aspect)} :</strong></p>
          ${co.aspects.map(a => `<div class="ligne-rel">${T(a.texte)}</div>`).join('')}
          <details class="aide" style="margin-top:8px"><summary>D'où vient ceci ?</summary>
            <p>Le thème du « nous » est le milieu de vos deux thèmes. Ces liens sont ses aspects internes, les plus serrés d'abord.</p>
            <ul style="margin:6px 0 0;padding-left:18px">${co.aspects.map(a => `<li style="margin:3px 0">${T(a.detail)}</li>`).join('')}</ul></details>` : ''}
        ${co.diagnostic ? `<p style="margin-top:14px"><strong>${T(co.diagnostic.amorce)} :</strong> ${T(co.diagnostic.texte)}</p>
          <p class="quoi">${T(co.diagnostic.pied)}</p>` : ''}
        <p class="quoi" style="margin-top:14px">${T(co.pied)}</p>`,
    })}</div>`;
  }

  html += `<div class="carte">
    ${tx.type && tx.type.conseil ? `<p style="font-family:var(--serif);font-size:16px;margin-bottom:10px">${T(tx.type.conseil)}</p>` : ''}
    <p class="quoi">${T((tx.synthese.pied || {}).non_verdict || '')}</p>
  </div>`;
  zone.innerHTML = html;
}
