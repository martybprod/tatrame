$('#nav').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('actif', x === b));
  montrer(b.dataset.vue);
  if (b.dataset.vue === 'relations') vueRelations();
};

function montrer(vue) {
  ['accueil','jour','apercu','portrait','ciel','relations','regles','profils','connexion'].forEach(v =>
    $('#vue-' + v).classList.toggle('cacher', v !== vue));
  // Fondu d'entrée premium (voir .vue-entre) : on retire puis réajoute la
  // classe, avec un reflow forcé entre les deux pour REJOUER l'animation à
  // chaque navigation (sinon le navigateur, voyant la classe déjà là, ne la
  // relance pas).
  const el = $('#vue-' + vue);
  if (el) {
    el.classList.remove('vue-entre');
    void el.offsetWidth;
    el.classList.add('vue-entre');
    fondreImages(el);
  }
  window.scrollTo(0, 0);
}

/* Fait ÉMERGER les images du fond noir au chargement (voir .img-fondu).
   - Cartes du jour : on fond le CONTENEUR .carte-jour (ses images .face/.dos
     gèrent déjà leur opacité pour le flip — on n'y touche pas).
   - Autres images de contenu (vignettes…) : on fond l'image elle-même.
   Idempotent (data-fondu) : rejouer montrer() ne re-déclenche pas un élément
   déjà fondu. Une image déjà en cache (complete) est marquée « chargée »
   immédiatement — le fondu joue quand même, très court, jamais de blocage. */
function fondreImages(racine) {
  if (!racine) return;
  racine.querySelectorAll('.carte-jour').forEach(el => {
    // Une carte déjà DÉVOILÉE (.revelee, ouverte en plein écran) ne doit pas
    // être re-fondue à chaque retour sur l'onglet — sinon elle disparaîtrait
    // brièvement (opacity:0) avant de refondre. On ne fond que la carte au dos
    // encore visible.
    const zone = el.closest('.carte-jour-zone');
    if (zone && zone.classList.contains('revelee')) return;
    preparerFondu(el, el.querySelector('.dos'));
  });
  // .tuto-pwa-img exclues : un mode d'emploi se feuillette VITE — aucun fondu
  // lent, même à la première ouverture (voir ouvrirTutoAjoutEcranAccueil).
  racine.querySelectorAll('img:not(.face):not(.dos):not(.tuto-pwa-img)').forEach(img =>
    preparerFondu(img, img));
}
function preparerFondu(el, imgSurveillee) {
  if (!el || el.dataset.fondu) return;
  el.dataset.fondu = '1';
  el.classList.add('img-fondu');
  const ok = () => el.classList.add('chargee');
  if (imgSurveillee && imgSurveillee.complete && imgSurveillee.naturalWidth) {
    // Déjà en cache : DOUBLE rAF obligatoire — il faut qu'un frame soit PEINT à
    // opacity:0 avant d'ajouter .chargee, sinon le navigateur regroupe les deux
    // dans le même recalcul de style et l'image saute à visible sans fondu (le
    // bug qui rendait l'effet quasi invisible, Martin 2026-08-27).
    requestAnimationFrame(() => requestAnimationFrame(ok));
  } else if (imgSurveillee) {
    imgSurveillee.addEventListener('load', ok, { once: true });
    imgSurveillee.addEventListener('error', ok, { once: true });  // jamais coincé invisible
  } else {
    ok();
  }
}

    <div class="chapo">Content de te revoir</div>
    <p class="quoi" style="margin:-2px 0 12px">Ton profil existe déjà, mais cet
      appareil ne le reconnaît plus (nouveau navigateur, ou données effacées).
      Entre ton nom et ton mot de passe pour le retrouver.</p>
    <label>Prénoms et nom</label>
    <input id="cx-nom" placeholder="Marie Claire Tremblay" autocomplete="username" value="${T(dernierNom)}">
    <label>Mot de passe</label>
    <input id="cx-mdp" type="password" placeholder="Ton mot de passe" autocomplete="current-password">
    <button class="bouton" id="cx-valider">Se connecter</button>
    <button class="bouton discret" id="cx-creer">Créer un nouveau profil à la place</button>
    <div id="cx-erreur" class="avis cacher" style="margin-top:14px"></div>
  </div>`;
  montrer('connexion');

  const err = m => { $('#cx-erreur').innerHTML = m; $('#cx-erreur').classList.remove('cacher'); };
  $('#cx-creer').onclick = () => { editionDe = null; ouvrirFormulaire(); };
  const valider = async () => {
    const nom = $('#cx-nom').value.trim();
    const mdp = $('#cx-mdp').value;
    if (!nom || !mdp) return err('Nom et mot de passe requis.');
    const r = await (await fetch('/api/connexion', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({nom, mot_de_passe: mdp}),
    })).json();
    if (r.erreur) return err(T(r.erreur));
    profilId = r.profil;
    localStorage.setItem('align.profil', profilId);
    localStorage.setItem('align.nomAffiche', nom);
    await demarrer();
  };
  $('#cx-valider').onclick = valider;
  $('#cx-mdp').addEventListener('keydown', e => { if (e.key === 'Enter') valider(); });
}

/* ═══════════════════════════════════════════════════════════
   PREMIER MOT DE PASSE — juste après la création d'un profil, invite à en
   choisir un (flux bêta) + l'installation PWA (voir GUIDE_PRATIQUE_UX_UI /
   plan de rétention iOS : sans écran d'accueil, Safari peut purger les
   données après quelques jours d'inactivité).
   ═══════════════════════════════════════════════════════════ */
function vueChoisirMotDePasse() {
  $('#vue-accueil').innerHTML = `<div class="carte">
    <div class="chapo">Protège ton profil</div>
    <p class="quoi" style="margin:-2px 0 12px">Choisis un mot de passe — libre,
      celui que tu veux — pour retrouver ton profil sur cet appareil ou un autre.</p>
    <label>Mot de passe</label>
    <input id="mdp-nouveau" type="password" placeholder="Ton mot de passe" autocomplete="new-password">
    <button class="bouton" id="mdp-valider">Continuer</button>
    <div id="mdp-erreur" class="avis cacher" style="margin-top:14px"></div>
  </div>`;
  montrer('accueil');
  const err = m => { $('#mdp-erreur').innerHTML = m; $('#mdp-erreur').classList.remove('cacher'); };
  $('#mdp-valider').onclick = async () => {
    const mdp = $('#mdp-nouveau').value;
    if (!mdp) return err('Le mot de passe ne peut pas être vide.');
    const r = await (await fetch(`/api/profil/${profilId}/mot-de-passe`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mot_de_passe: mdp}),
    })).json();
    if (r.erreur) return err(T(r.erreur));
    if ('storage' in navigator && navigator.storage.persist) navigator.storage.persist();
    await suiteApresProfil();
  };
}

/* Invite d'installation PWA : Safari iOS exige le geste manuel (partage →
   Sur l'écran d'accueil, aucune API ne peut le déclencher) ; Chrome/Android
   propose parfois `beforeinstallprompt`, capté ici pour un vrai bouton. */
let evenementInstallPWA = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  evenementInstallPWA = e;
});

function inviterInstallationPWA() {
  const dejaInstalle = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (dejaInstalle || localStorage.getItem('align.pwaVue')) return suiteApresProfilFin();
  const fin = () => { localStorage.setItem('align.pwaVue', '1'); suiteApresProfilFin(); };
  const estIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  // iOS/Safari : plus de texte seul (Martin, 2026-08-28) — un vrai tuto en 4
  // images, captures réelles du geste exact. Android/Chrome garde son propre
  // bouton (beforeinstallprompt, capté plus haut).
  if (estIOS) { ouvrirTutoAjoutEcranAccueil(fin); return; }
  $('#vue-accueil').innerHTML = `<div class="carte">
    <div class="chapo">Garde Ta Trame à portée</div>
    <p class="quoi" style="margin:-2px 0 12px">Installe Ta Trame sur ton écran d'accueil pour l'ouvrir comme une vraie app.</p>
    <button class="bouton" id="pwa-installer">Installer</button>
    <button class="bouton discret" id="pwa-plus-tard">Plus tard</button>
  </div>`;
  montrer('accueil');
  $('#pwa-plus-tard').onclick = fin;
  $('#pwa-installer').onclick = async () => {
    if (evenementInstallPWA) { evenementInstallPWA.prompt(); await evenementInstallPWA.userChoice; }
    fin();
  };
}

/* Tuto visuel « Sur l'écran d'accueil » (iOS/Safari, nouveaux comptes
   uniquement — voir inviterInstallationPWA) : 4 captures RÉELLES du geste
   exact (menu ⋯ → Partager → En voir plus → Sur l'écran d'accueil), plutôt
   qu'une phrase seule (Martin, 2026-08-28). Images recadrées/floutées pour
   masquer les contacts personnels visibles dans le partage iOS d'origine. */
const TUTO_PWA_ETAPES = [
  { img: '/static/img/tuto-pwa/1.webp', legende: "Touche le bouton <b>⋯</b> en bas de Safari." },
  { img: '/static/img/tuto-pwa/2.webp', legende: "Choisis <b>Partager</b>." },
  { img: '/static/img/tuto-pwa/3.webp', legende: "Touche <b>En voir plus</b>." },
  { img: '/static/img/tuto-pwa/4.webp', legende: "Puis <b>Sur l'écran d'accueil</b>." },
];
function ouvrirTutoAjoutEcranAccueil(fin) {
  const n = TUTO_PWA_ETAPES.length;
  let etape = 0;
  /* Les 4 images sont rendues DÈS L'OUVERTURE et préchargées : le navigateur
     les charge en parallèle pendant que la 1re est regardée ; naviguer ne
     déclenche AUCUN chargement ni re-rendu — on bascule juste .cacher. C'est
     ce qui rend le défilement instantané (demande de Martin : « il faut que
     ça défile rapidement »). Pas de fondu .img-fondu ici volontairement :
     les transitions lentes du reste de l'app (1,6 s) n'ont pas leur place
     dans un mode d'emploi qu'on feuillette. */
  $('#vue-accueil').innerHTML = `<div class="carte" style="text-align:center">
    <div class="chapo">Garde Ta Trame à portée</div>
    ${TUTO_PWA_ETAPES.map((e, i) => `
      <img class="tuto-pwa-img${i ? ' cacher' : ''}" data-etape="${i}" src="${e.img}"
        alt="Étape ${i + 1} sur ${n} pour ajouter Ta Trame à l'écran d'accueil">`).join('')}
    <p class="quoi" id="tuto-legende" style="margin-bottom:6px">${TUTO_PWA_ETAPES[0].legende}</p>
    <div class="tuto-nav">
      <button class="tuto-nav-b inactif" id="tuto-prec" aria-label="Étape précédente">‹</button>
      <div class="etat neutre" style="margin:0" id="tuto-compteur">1 / ${n}</div>
      <button class="tuto-nav-b" id="tuto-suiv" aria-label="Étape suivante">›</button>
    </div>
    <button class="bouton" id="tuto-terminer">C'est fait !</button>
    <button class="bouton discret" id="pwa-plus-tard">Plus tard</button>
  </div>`;
  montrer('accueil');
  // Préchargement explicite : même si les <img> sont déjà dans le DOM, ceci
  // force le décodage maintenant (utile pour les webp volumineuses).
  TUTO_PWA_ETAPES.forEach(e => { new Image().src = e.img; });

  const maj = () => {
    document.querySelectorAll('.tuto-pwa-img').forEach(img =>
      img.classList.toggle('cacher', +img.dataset.etape !== etape));
    $('#tuto-legende').innerHTML = TUTO_PWA_ETAPES[etape].legende;
    $('#tuto-compteur').textContent = `${etape + 1} / ${n}`;
    $('#tuto-prec').classList.toggle('inactif', etape === 0);
    $('#tuto-suiv').classList.toggle('inactif', etape === n - 1);
  };
  $('#tuto-prec').onclick = () => { if (etape > 0) { etape--; maj(); } };
  $('#tuto-suiv').onclick = () => { if (etape < n - 1) { etape++; maj(); } };
  $('#tuto-terminer').onclick = fin;
  $('#pwa-plus-tard').onclick = fin;
}

/* ═══════════════════════════════════════════════════════════
   ONBOARDING — Configurer tes rappels, juste après le mot de passe. Même
   formulaire que le panneau de réglages (_rappelsFormulaireHTML,
   _enregistrerRappels) — un seul endroit qui sait dessiner ça. Skippable en
   un geste (« Plus tard »), et « Continuer » n'attend jamais l'issue du
   push (permission refusée n'empêche pas d'avancer) : on ne bloque jamais
   l'entrée dans l'app pour ça. ═══════════════════════════════════════════ */
function ouvrirEtapeRappels() {
  $('#vue-accueil').innerHTML = `<div class="carte">
    <div class="chapo">Configurer tes rappels</div>
    <p class="quoi" style="margin:-2px 0 16px">Trois moments possibles, chacun réglable
      séparément — jamais optimisés pour te faire ouvrir l'app plus souvent. Tu pourras
      toujours changer ça plus tard.</p>
    <div id="rr-corps">${_rappelsFormulaireHTML(creneauxParDefaut())}</div>
    <button class="bouton" id="rr-continuer">Continuer</button>
    <button class="bouton discret" id="rr-plus-tard">Plus tard</button>
    <div id="rr-etat" style="margin-top:10px;font-size:13px;color:var(--encre3)"></div>
  </div>`;
  montrer('accueil');
  $('#rr-plus-tard').onclick = inviterInstallationPWA;
  $('#rr-continuer').onclick = async () => {
    $('#rr-continuer').disabled = true;
    $('#rr-etat').textContent = 'Enregistrement…';
    try { await _enregistrerRappels($('#rr-etat')); }
    catch (e) { /* jamais bloquer l'onboarding pour un push raté */ }
    inviterInstallationPWA();
  };
}

async function suiteApresProfil() { ouvrirEtapeRappels(); }
async function suiteApresProfilFin() { await demarrer(); }

/* Naviguer ET mettre l'onglet à jour — sinon un saut depuis l'aperçu laisse
   la barre du haut sur l'ancien onglet, et on ne sait plus où on est. */
function montrerVue(vue) {
  montrer(vue);
  document.querySelectorAll('#nav button').forEach(b =>
    b.classList.toggle('actif', b.dataset.vue === vue));
  journalActivite('nav', vue);   // popularité des sections (tableau de bord admin)
}

/* ── Rappels push : ouvrir la carte visée au clic ──────────────────────────
   Le service worker transmet {carte, domaine, profil} — soit dans l'URL (app
   ouverte à froid depuis la notification), soit par postMessage (app déjà
   vivante). On rouvre la même carte plein écran que partout ailleurs : aucune
   UI neuve, juste un point d'entrée. */
function _lireRappelURL() {
  const p = new URLSearchParams(location.search);
  const carte = p.get('carte');
  return carte ? { carte, domaine: p.get('domaine'), profil: p.get('profil') } : null;
}
function _nettoyerRappelURL() {
  // Sans ça, un rechargement rouvrirait la carte en boucle.
  history.replaceState(null, '', location.pathname);
}
async function ouvrirCartePourRappel(carte, domaine, profil) {
  // Le rappel vise un compte précis : s'il est déverrouillé et différent du
  // courant, on bascule dessus d'abord (sinon on ouvre le compte actuel).
  if (profil && profil !== profilId && profils.find(p => p.id === profil)) {
    profilId = profil;
    localStorage.setItem('align.profil', profilId);
    await chargerJour();
  }
  montrerVue('jour');                 // fond cohérent quand la carte se refermera
  if (carte === 'jour') { montrerAccueilJour(true); return; }
  if (carte === 'domaine' && domaine) {
    const trouve = DOMAINES_JOUR.find(([k]) => k === domaine);
    ouvrirDomainePlein(domaine, trouve ? trouve[1] : domaine);
    return;
  }
  if (carte === 'mediter') {
    // L'onclick de la carte est câblé en setTimeout(0) au rendu du Jour ; on
    // diffère d'un tick pour cliquer une fois le câblage posé.
    setTimeout(() => document.querySelector('#c-mediter .rangee-angle')?.click(), 0);
  }
}

async function demarrer() {
  await chargerProfils();
  // Un rappel peut viser un autre compte déverrouillé que le dernier ouvert.
  const rappel = _lireRappelURL();
  if (rappel && rappel.profil && profils.find(p => p.id === rappel.profil)) {
    profilId = rappel.profil;
    localStorage.setItem('align.profil', profilId);
  }
  if (!profils.find(p => p.id === profilId)) {
    // Un id local qui ne figure plus dans les profils déverrouillés de CETTE
    // session : soit un vrai premier visiteur (localStorage vide → formulaire
    // de création), soit quelqu'un qui avait déjà un compte mais dont la
    // session a expiré/été effacée (cookies, nouvel appareil…) → connexion,
    // jamais un nouveau profil silencieux qui doublonnerait le sien.
    const connuAvant = profilId || localStorage.getItem('align.nomAffiche');
    localStorage.removeItem('align.profil');
    profilId = profils.length ? profils[0].id : null;
    if (profilId) { localStorage.setItem('align.profil', profilId); }
    else if (connuAvant) { vueConnexion(); return; }
  }
  if (!profilId) { ouvrirFormulaire(); return; }
  $('#nav').classList.remove('cacher');
  $('#bouton-regles').classList.remove('cacher');
  $('#bouton-feedback').classList.remove('cacher');
  dessinerPuce();
  journalActivite('ouverture');   // « quand » : début d'une session (tableau de bord)
  journalActivite('nav', 'jour'); // la 1re section vue (montrer(), pas montrerVue())
  vueProfils();
  montrer('jour');
  document.querySelectorAll('#nav button').forEach(x =>
    x.classList.toggle('actif', x.dataset.vue === 'jour'));
  await Promise.all([chargerJour(), chargerApercu(), chargerPortrait(),
                     chargerCiel(), chargerRegles()]);
  // Une fois la vue Jour prête dessous : soit on ouvre la carte d'un rappel
  // (l'app vient d'être ouverte depuis une notification), soit l'écran d'accueil
  // du jour normal (une seule fois par jour — voir montrerAccueilJour).
  if (rappel && rappel.carte) {
    ouvrirCartePourRappel(rappel.carte, rappel.domaine, rappel.profil);
    _nettoyerRappelURL();
  } else {
    montrerAccueilJour();
  }
}

document.querySelectorAll('#nav button[data-vue], #bouton-regles[data-vue]').forEach(b => {
  const ic = ICONES_NAV[b.dataset.vue];
  if (ic) b.insertAdjacentHTML('afterbegin', icono(ic, 19));
});
/* Sorti de #nav (icône seule, en haut à droite) : pas capté par la
   délégation de clic du menu, il rejoue donc le même changement de vue. */
$('#bouton-regles').onclick = () => montrerVue('regles');
$('#bouton-feedback').insertAdjacentHTML('afterbegin', icono(ICONES_NAV.feedback, 18));
$('#bouton-feedback').onclick = ouvrirFeedback;

/* ═══════════════════════════════════════════════════════════
   COMMENTAIRE POUR MARTIN — discret, réutilise le panneau générique
   (#voile/#panneau, déjà utilisé pour les détails). Lisible seulement par
   lui (voir /admin/commentaires, gardé par mot de passe admin).
   ═══════════════════════════════════════════════════════════ */
function ouvrirFeedback() {
  const p = profils.find(x => x.id === profilId);
  $('#panneau').innerHTML = `<div class="panneau-haut">
      <div class="chapo" style="margin-bottom:0">Un commentaire pour Martin</div>
      <button class="fermer" id="fb-fermer">✕</button>
    </div>
    <p class="quoi" style="margin:14px 0 12px">Un bug, une idée, une phrase qui sonne faux —
      tout est bienvenu. Seul Martin peut lire ce que tu écris ici.</p>
    <textarea id="fb-texte" placeholder="Écris ici…" autofocus></textarea>
    <button class="bouton" id="fb-envoyer" style="margin-top:12px">Envoyer</button>
    <div id="fb-etat" style="margin-top:10px;font-size:13px;color:var(--encre3)"></div>`;
  $('#voile').classList.remove('cacher');
  $('#voile').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  $('#fb-fermer').onclick = fermerFeedback;
  $('#fb-envoyer').onclick = async () => {
    const texte = $('#fb-texte').value.trim();
    const etat = $('#fb-etat');
    if (!texte) { etat.textContent = 'Écris quelque chose avant d\'envoyer.'; return; }
    $('#fb-envoyer').disabled = true;
    etat.textContent = 'Envoi…';
    try {
      const r = await (await fetch('/api/commentaire', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({texte, profil: profilId, nom_affiche: p?.nom_affiche || '', vue: document.querySelector('#nav button.actif')?.dataset.vue || ''}),
      })).json();
      if (r.erreur) { etat.textContent = T(r.erreur); $('#fb-envoyer').disabled = false; return; }
      etat.textContent = 'Merci — c\'est envoyé.';
      $('#fb-texte').value = '';
      setTimeout(fermerFeedback, 900);
    } catch (e) {
      etat.textContent = 'La connexion a échoué — réessaie.';
      $('#fb-envoyer').disabled = false;
    }
  };
}
function fermerFeedback() {
  $('#voile').classList.add('cacher');
  document.body.style.overflow = '';
}

(async () => {
  LEX = await (await fetch('/api/lexique')).json();
  await demarrer();
})();
</script>
