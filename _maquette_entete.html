<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
:root{
  --encre:#ece0bd; --encre2:#b3a68a; --encre3:#86795f;
  --papier:#141110; --papier2:#1e1a16; --bord:#372e1e;
  --accent:#d9b95c; --accent-doux:#e9d494;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papier);color:var(--encre);font-family:var(--sans);padding:0 0 40px}
.col{width:390px;display:inline-block;vertical-align:top}
.etq{font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre3);padding:14px 20px 8px;text-align:center}

/* bandeau partagé */
.bandeau{position:relative;overflow:hidden;background:#141110}
.bandeau::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:
    linear-gradient(to bottom, rgba(20,17,16,0) 0%, rgba(20,17,16,.55) 55%, #141110 100%),
    url('/static/img/trame-bandeau.jpg');
  background-position:center 44%;background-size:cover;
}
.contenu{position:relative;z-index:1;padding:22px 20px 0}

.marque{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:24px;letter-spacing:.16em;color:#ece0bd}
.marque-ico{flex:none;color:#e9d494}
.marque-texte::after{content:'';display:block;width:24px;height:1px;background:#e9d494;margin-top:6px}

/* nav (identique dans les deux) */
.nav{display:flex;gap:2px;flex-wrap:wrap;background:var(--papier);padding:14px 20px 10px}
.nav button{background:none;border:0;font:inherit;font-size:11.5px;color:#b3a68a;padding:6px 5px;border-radius:8px;display:flex;align-items:center;gap:3px}
.nav button.actif{color:#f4ecd8;background:rgba(255,255,255,.12)}
.nav .ico{width:14px;height:14px;flex:none;opacity:.85}

/* ══ ANCIEN ══ */
.old .rangee{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.old .outils{display:flex;align-items:center;gap:10px}
.old .btn-ico{background:none;border:0;color:#b3a68a;padding:7px;border-radius:8px;display:flex;cursor:pointer}
.old .pilule{display:flex;align-items:center;gap:8px;background:var(--papier2);border:1px solid var(--bord);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--encre2)}
.old .pilule .fleche{font-size:9px;color:var(--encre3)}
.old .apres-marque{height:96px}

/* ══ NOUVEAU ══ */
.new .rangee{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.new .outils{display:flex;align-items:center;gap:8px}
.new .outil{
  display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
  border-radius:17px;color:#cdbf9a;font-size:13px;cursor:pointer;
  font-family:var(--sans);white-space:nowrap;
}
.new .outil.ico-seule{width:34px;padding:0;justify-content:center}
.new .outil .ico{flex:none}
.new .outil .fleche{font-size:9px;color:var(--encre3);margin-left:1px}
.new .apres-marque{height:66px}
.ico{width:17px;height:17px}
</style></head>
<body>

<!-- ══════ ANCIEN ══════ -->
<div class="col old">
  <div class="etq">Actuel</div>
  <div class="bandeau" style="height:260px">
    <div class="contenu">
      <div class="rangee">
        <div class="marque">
          <svg class="marque-ico" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h16"/><path d="M5 11h3M16 11h3" opacity="0.55"/><path d="M12 5.6V14"/><path d="M12 14l2.1 2.6L12 21l-2.1-4.4Z"/><circle cx="12" cy="4.5" r="1.1" fill="currentColor" stroke="none"/></svg>
          <span class="marque-texte">TA TRAME</span>
        </div>
        <div class="outils">
          <button class="btn-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="4"/><path d="M7 9.6a2.4 2.4 0 1 1-2.4 2.4"/><path d="M7 8h13M7 16h13"/><path d="M20 8c1.2 1.3-1.2 2.7 0 4s-1.2 2.7 0 4"/><path d="M11.5 8v8M15.5 8v8"/></svg></button>
          <button class="btn-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9.5L5 19.8V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z"/><circle cx="8.3" cy="10.8" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="10.8" r="0.9" fill="currentColor" stroke="none"/><circle cx="15.7" cy="10.8" r="0.9" fill="currentColor" stroke="none"/></svg></button>
          <div class="pilule">Martin Boucher <span class="fleche">▼</span></div>
        </div>
      </div>
    </div>
    <div class="apres-marque"></div>
  </div>
  <div class="nav">
    <button class="actif"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M8.1 10.4H15.9M8.1 13.6H15.9"/><path d="M12 2.8V5M12 19v2.2M2.8 12H5M19 12h2.2M5.5 5.5l1.55 1.55M16.95 16.95l1.55 1.55M18.5 5.5l-1.55 1.55M7.05 16.95L5.5 18.5"/></svg>Le Jour</button>
    <button>Tout</button><button>Le Portrait</button><button>Le Ciel</button><button>Relations</button>
  </div>
</div>

<!-- ══════ NOUVEAU ══════ -->
<div class="col new">
  <div class="etq" style="color:var(--accent-doux)">Proposition</div>
  <div class="bandeau" style="height:210px">
    <div class="contenu">
      <div class="rangee">
        <div class="marque">
          <svg class="marque-ico" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h16"/><path d="M5 11h3M16 11h3" opacity="0.55"/><path d="M12 5.6V14"/><path d="M12 14l2.1 2.6L12 21l-2.1-4.4Z"/><circle cx="12" cy="4.5" r="1.1" fill="currentColor" stroke="none"/></svg>
          <span class="marque-texte">TA TRAME</span>
        </div>
      </div>
      <div class="outils" style="justify-content:flex-end;margin-top:16px">
        <button class="outil ico-seule" title="Les Règles"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="4"/><path d="M7 9.6a2.4 2.4 0 1 1-2.4 2.4"/><path d="M7 8h13M7 16h13"/><path d="M20 8c1.2 1.3-1.2 2.7 0 4s-1.2 2.7 0 4"/><path d="M11.5 8v8M15.5 8v8"/></svg></button>
        <button class="outil ico-seule" title="Un commentaire ?"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9.5L5 19.8V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z"/><circle cx="8.3" cy="10.8" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="10.8" r="0.9" fill="currentColor" stroke="none"/><circle cx="15.7" cy="10.8" r="0.9" fill="currentColor" stroke="none"/></svg></button>
        <button class="outil">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg>
          Martin Boucher <span class="fleche">▼</span>
        </button>
      </div>
    </div>
    <div class="apres-marque"></div>
  </div>
  <div class="nav">
    <button class="actif"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M8.1 10.4H15.9M8.1 13.6H15.9"/><path d="M12 2.8V5M12 19v2.2M2.8 12H5M19 12h2.2M5.5 5.5l1.55 1.55M16.95 16.95l1.55 1.55M18.5 5.5l-1.55 1.55M7.05 16.95L5.5 18.5"/></svg>Le Jour</button>
    <button>Tout</button><button>Le Portrait</button><button>Le Ciel</button><button>Relations</button>
  </div>
</div>

</body></html>
