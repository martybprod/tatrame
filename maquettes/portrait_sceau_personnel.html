<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Align — Le sceau personnel sur la Fleur de Vie</title>
<style>
  :root{
    --fond:#120f0b; --carte:#1b1712; --trait:#3a3226;
    --texte:#e9e1d2; --doux:#9a8f78; --accent:#d0a95f;
    --feu:#c86a42; --terre:#88964f; --air:#d8bd70; --eau:#5f8fb0;
    --chaine:#8a7854; --fdv:#7a6a45;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 30%,#191510,#0c0a07 80%);
    color:var(--texte);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;padding:30px 18px 70px}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-weight:500;font-size:23px;margin:0 0 6px;text-align:center}
  .sous{color:var(--doux);font-size:14px;margin:0 0 26px;text-align:center}
  .grille{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .carte{background:var(--carte);border:1px solid var(--trait);border-radius:14px;
    padding:18px 16px;display:flex;flex-direction:column;align-items:center}
  .carte h2{font-weight:500;font-size:16px;margin:0 0 2px}
  .carte .id{color:var(--doux);font-size:12px;margin:0 0 8px}
  .carte svg{display:block;width:100%;height:auto;max-width:340px;
    filter:drop-shadow(0 0 20px rgba(208,169,95,.12))}
  .carte .data{color:var(--doux);font-size:11.5px;margin:10px 2px 0;text-align:center;line-height:1.55}
  .carte .data b{color:var(--accent);font-weight:500}
  .legende{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
    font-size:12px;color:var(--doux);margin:24px 0 0}
  .legende span{display:inline-flex;align-items:center;gap:6px}
  .pastille{width:11px;height:11px;border-radius:50%;display:inline-block}
  .num{font-family:Georgia,serif;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div class="wrap">
  <h1>Le sceau personnel sur la Fleur de Vie</h1>
  <p class="sous">Même système, trois personnes. La Fleur de Vie est commune ; le sceau, la palette, la trame et l'orientation changent pour chacun.</p>
  <div class="grille" id="grille"></div>

  <div class="legende">
    <span><i class="pastille" style="background:var(--feu)"></i>Feu</span>
    <span><i class="pastille" style="background:var(--terre)"></i>Terre</span>
    <span><i class="pastille" style="background:var(--air)"></i>Air</span>
    <span><i class="pastille" style="background:var(--eau)"></i>Eau</span>
    <span><i class="pastille" style="background:var(--accent)"></i>sceau personnel</span>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const add=(p,n,a)=>{const e=el(n,a);p.appendChild(e);return e;};
const C=getComputedStyle(document.documentElement);
const col=n=>C.getPropertyValue('--'+n).trim();
const ELEM={feu:col('feu'),terre:col('terre'),air:col('air'),eau:col('eau')};
const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const elemNombre={1:'feu',2:'eau',3:'feu',4:'air',5:'air',6:'terre',7:'eau',8:'terre',9:'feu'};

// --- 3 profils (données d'exemple ; en prod : du moteur) ---
const profils=[
 {nom:"Martin Boucher", naiss:"14/07/1985", jour:5,mois:7,annee:5,
  cap:8,voix:3,foyer:3,elan:5, counts:{1:1,2:2,3:2,4:1,5:2,6:1,7:0,8:1,9:3}},
 {nom:"Ginette Tremblay", naiss:"03/11/1958", jour:3,mois:11,annee:5,
  cap:1,voix:7,foyer:5,elan:9, counts:{1:0,2:3,3:1,4:2,5:1,6:0,7:2,8:1,9:2}},
 {nom:"Léa Fortin", naiss:"28/02/2000", jour:1,mois:2,annee:2,
  cap:5,voix:9,foyer:1,elan:6, counts:{1:2,2:1,3:0,4:1,5:3,6:2,7:1,8:0,9:1}},
];

const CX=170,CY=170,RQ=150,MAX=3,SPAN=40;

function elementDominant(counts){
  const tot={feu:0,terre:0,air:0,eau:0};
  for(let n=1;n<=9;n++) tot[elemNombre[n]]+=counts[n];
  return Object.entries(tot).sort((a,b)=>b[1]-a[1])[0][0];
}

function folCenters(r){
  const dy=r*Math.sqrt(3)/2, seen=new Set(), list=[];
  for(let row=-6;row<=6;row++) for(let i=-6;i<=6;i++){
    const x=CX+i*r+(row&1?r/2:0), y=CY+row*dy, k=x.toFixed(1)+','+y.toFixed(1);
    if(seen.has(k))continue;seen.add(k);
    if(Math.hypot(x-CX,y-CY)<=2*r+0.5) list.push([x,y]);
  }
  // ordre stable : par distance puis angle -> index reproductible
  list.sort((a,b)=>{const da=Math.hypot(a[0]-CX,a[1]-CY),db=Math.hypot(b[0]-CX,b[1]-CY);
    if(Math.abs(da-db)>0.5)return da-db;
    return Math.atan2(a[1]-CY,a[0]-CX)-Math.atan2(b[1]-CY,b[0]-CX);});
  return list;
}

function render(svg,p){
  const rng=mulberry32(parseInt((p.naiss).replace(/\//g,''),10));
  const dom=elementDominant(p.counts);
  const rot=(p.jour*23)%360;                     // orientation ← Jour
  const defs=add(svg,'defs',{});
  const grad=add(defs,'radialGradient',{id:'c'+p.jour+p.mois});
  add(grad,'stop',{offset:'0%','stop-color':'#f0d493'});add(grad,'stop',{offset:'100%','stop-color':col('accent')});
  const clip=add(defs,'clipPath',{id:'fc'+p.jour+p.mois});add(clip,'circle',{cx:CX,cy:CY,r:164});

  const gBack=add(svg,'g',{transform:`rotate(${rot} ${CX} ${CY})`});
  const gFront=add(svg,'g',{});

  /* ---- Fleur de Vie (commune, dominante) ---- */
  const r=40, centers=folCenters(r);
  const gf=add(gBack,'g',{'clip-path':`url(#fc${p.jour}${p.mois})`});
  centers.forEach(([x,y])=>{const d=Math.hypot(x-CX,y-CY);
    add(gf,'circle',{cx:x,cy:y,r,fill:'none',stroke:col('fdv'),'stroke-width':0.9,opacity:0.75-Math.min(0.5,d/164*0.6)});});
  add(gBack,'circle',{cx:CX,cy:CY,r:164,fill:'none',stroke:col('fdv'),'stroke-width':1.2,opacity:0.8});
  add(gBack,'circle',{cx:CX,cy:CY,r:172,fill:'none',stroke:col('fdv'),'stroke-width':0.7,opacity:0.5});

  /* ---- SCEAU PERSONNEL : relie des cercles de la fleur ← nombres-clés ---- */
  const keys=[p.cap,p.voix,p.foyer,p.elan];
  const idx=keys.map(k=>k%centers.length);
  const pts=idx.map(i=>centers[i]);
  // halo sur les cercles activés
  pts.forEach(([x,y])=>{add(gBack,'circle',{cx:x,cy:y,r,fill:ELEM[dom],'fill-opacity':0.06,stroke:ELEM[dom],'stroke-width':1.1,opacity:0.7});});
  // tracé du sceau
  let d='';pts.forEach(([x,y],i)=>d+=(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ');d+='Z';
  add(gBack,'path',{d,fill:col('accent'),'fill-opacity':0.05,stroke:col('accent'),'stroke-width':1.6,opacity:0.9,'stroke-linejoin':'round'});
  pts.forEach(([x,y])=>add(gBack,'circle',{cx:x,cy:y,r:3,fill:col('accent')}));

  /* ---- LA TRAME (9 qualités) ← counts ---- */
  const R0=36,R1=RQ-12,NR=11, ringR=[...Array(NR)].map((_,k)=>R0+(R1-R0)*k/(NR-1));
  const V=[...Array(9)].map((_,i)=>polar(CX,CY,RQ,i*SPAN));
  // chaîne
  for(let n=1;n<=9;n++){const c0=(n-1)*SPAN;
    for(let w=0;w<4;w++){const ang=c0-SPAN/2+SPAN*(w+0.5)/4,[x,y]=polar(CX,CY,RQ,ang);
      add(gFront,'line',{x1:CX,y1:CY,x2:x,y2:y,stroke:col('chaine'),'stroke-width':0.7,opacity:0.4});}}
  const woven={};
  function weft(k,a0,a1,tint,op){let dd='';for(let a=a0;a<=a1+0.01;a+=2){const rr=ringR[k]+Math.sin(a*0.6+k)*1.1+(rng()*2-1)*0.5;
    const[x,y]=polar(CX,CY,rr,a);dd+=(dd===''?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
    add(gFront,'path',{d:dd,fill:'none',stroke:tint,'stroke-width':2.4,opacity:op,'stroke-linecap':'round'});}
  for(let n=1;n<=9;n++){const c=p.counts[n],e=elemNombre[n],c0=(n-1)*SPAN,a0=c0-SPAN/2+1.5,a1=c0+SPAN/2-1.5;
    let hi=c>0?Math.round((NR-1)*c/MAX):-1;if(c>0)hi=Math.max(1,hi-(rng()<0.5?1:0));woven[n]=hi;
    for(let k=0;k<=hi;k++) weft(k,a0,a1,ELEM[e],0.82-k*0.02);
    for(let k=0;k<=hi;k++) if(k%2===1) weft(k,a0,a1,ELEM[e],0.9);}
  // chantiers : fils libres
  for(let n=1;n<=9;n++){if(p.counts[n]>0)continue;const c0=(n-1)*SPAN,e=elemNombre[n];
    for(let t=0;t<3;t++){const ang=c0-8+t*8;let dd='';
      for(let s=0;s<=6;s++){const[x,y]=polar(CX,CY,R0+s*12,ang+Math.sin(s)*3.2);dd+=(s===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
      add(gFront,'path',{d:dd,fill:'none',stroke:ELEM[e],'stroke-width':1.2,opacity:0.5,'stroke-linecap':'round','stroke-dasharray':'1 4'});}}

  /* ---- ENNÉAGRAMME ← Cap (pas = 2/3/4) ---- */
  const step=2+(p.cap%3);
  (function(){const seen=new Set();
    for(let s=0;s<9;s++){if(seen.has(s))continue;let i=s,pp=[];do{pp.push(i);seen.add(i);i=(i+step)%9;}while(i!==s);
      if(pp.length>2){let d='';pp.forEach((q,j)=>d+=(j===0?'M':'L')+V[q][0]+' '+V[q][1]+' ');d+='Z';
        add(gFront,'path',{d,fill:'none',stroke:col('accent'),'stroke-width':0.9,opacity:0.34,'stroke-linejoin':'round'});}}})();

  /* ---- sommets de qualité ---- */
  for(let n=1;n<=9;n++){const[x,y]=V[n-1],c=p.counts[n],e=elemNombre[n];
    if(c>0){add(gFront,'circle',{cx:x,cy:y,r:8+c*2.2,fill:ELEM[e],'fill-opacity':0.32,stroke:ELEM[e],'stroke-width':1.5});
      const t=el('text',{x,y,class:'num','font-size':12,fill:col('texte')});t.textContent=n;gFront.appendChild(t);}
    else{add(gFront,'circle',{cx:x,cy:y,r:11,fill:col('fond'),stroke:col('feu'),'stroke-width':1.1,'stroke-dasharray':'2 3'});
      const t=el('text',{x,y,class:'num','font-size':12,fill:col('feu')});t.textContent=n;gFront.appendChild(t);}}

  /* ---- cœur : Cap ---- */
  const o=8;
  add(gFront,'circle',{cx:CX-o,cy:CY,r:22,fill:'none',stroke:col('accent'),'stroke-width':0.7,opacity:0.5});
  add(gFront,'circle',{cx:CX+o,cy:CY,r:22,fill:'none',stroke:col('accent'),'stroke-width':0.7,opacity:0.5});
  add(gFront,'circle',{cx:CX,cy:CY,r:19,fill:col('fond'),stroke:col('accent'),'stroke-width':1.4});
  add(gFront,'circle',{cx:CX,cy:CY,r:15,fill:`url(#c${p.jour}${p.mois})`});
  const t=el('text',{x:CX,y:CY,class:'num','font-size':18,fill:col('fond'),'font-weight':600});t.textContent=p.cap;gFront.appendChild(t);
}

const grille=document.getElementById('grille');
profils.forEach(p=>{
  const carte=el('div',{class:'carte'});
  const h=document.createElement('h2');h.textContent=p.nom;carte.appendChild(h);
  const idl=document.createElement('div');idl.className='id';idl.textContent=p.naiss;carte.appendChild(idl);
  const svg=el('svg',{viewBox:'0 0 340 340',role:'img'});carte.appendChild(svg);
  render(svg,p);
  const data=document.createElement('div');data.className='data';
  data.innerHTML=`Cap <b>${p.cap}</b> · Voix <b>${p.voix}</b> · Foyer <b>${p.foyer}</b> · Élan <b>${p.elan}</b><br>élément dominant : <b>${elementDominant(p.counts)}</b> · chantiers : <b>${Object.keys(p.counts).filter(n=>p.counts[n]===0).join(', ')||'aucun'}</b>`;
  carte.appendChild(data);
  grille.appendChild(carte);
});
</script>
</body>
</html>
