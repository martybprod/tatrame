<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Align — Le Grand Métier (Fleur de Vie dominante)</title>
<style>
  :root{
    --fond:#120f0b; --carte:#1b1712; --trait:#3a3226;
    --texte:#e9e1d2; --doux:#9a8f78; --accent:#d0a95f;
    --feu:#c86a42; --terre:#88964f; --air:#d8bd70; --eau:#5f8fb0;
    --chaine:#8a7854; --fdv:#8a7645;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 42%,#1a1610,#0d0b08 78%);
    color:var(--texte);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.55;padding:30px 18px 70px}
  .wrap{max-width:720px;margin:0 auto;text-align:center}
  h1{font-weight:500;font-size:23px;margin:0 0 6px}
  .sous{color:var(--doux);font-size:14px;margin:0 0 4px}
  .exemple{color:var(--doux);font-size:12.5px;margin:0 0 18px;font-style:italic}
  svg{display:block;margin:0 auto;width:100%;height:auto;max-width:560px;
    filter:drop-shadow(0 0 26px rgba(208,169,95,.12))}
  .legende{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
    font-size:12px;color:var(--doux);margin:16px 0 22px}
  .legende span{display:inline-flex;align-items:center;gap:6px}
  .pastille{width:11px;height:11px;border-radius:50%;display:inline-block}
  .num{font-family:Georgia,serif;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div class="wrap">
  <h1>Le Grand Métier — Fleur de Vie dominante</h1>
  <p class="sous">La Fleur de Vie devient l'ossature ; le tissage vient l'habiter.</p>
  <p class="exemple">14/07/1985, « Martin Boucher ». 9 qualités · densité = force · le 7 = maille ouverte.</p>

  <svg id="mandala" viewBox="0 0 560 560" role="img" aria-label="Mandala Fleur de Vie dominante"></svg>

  <div class="legende">
    <span><i class="pastille" style="background:var(--feu)"></i>Feu</span>
    <span><i class="pastille" style="background:var(--terre)"></i>Terre</span>
    <span><i class="pastille" style="background:var(--air)"></i>Air</span>
    <span><i class="pastille" style="background:var(--eau)"></i>Eau</span>
    <span><i class="pastille" style="background:var(--accent)"></i>structure</span>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const add=(p,n,a)=>{const e=el(n,a);p.appendChild(e);return e;};
const C=getComputedStyle(document.documentElement);
const col=n=>C.getPropertyValue('--'+n).trim();
const ELEM={feu:col('feu'),terre:col('terre'),air:col('air'),eau:col('eau')};
const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry32(19850714);
const jit=(a=1)=>(R()*2-1)*a;

const svg=document.getElementById('mandala');
const CX=280,CY=280;
const elemNombre={1:'feu',2:'eau',3:'feu',4:'air',5:'air',6:'terre',7:'eau',8:'terre',9:'feu'};
const counts={1:1,2:2,3:2,4:1,5:2,6:1,7:0,8:1,9:3};
const MAX=3, SPAN=40, RQ=176;

const defs=add(svg,'defs',{});
const grad=add(defs,'radialGradient',{id:'coeur'});
add(grad,'stop',{offset:'0%','stop-color':'#f0d493'});add(grad,'stop',{offset:'100%','stop-color':col('accent')});
const clip=add(defs,'clipPath',{id:'fdvClip'});add(clip,'circle',{cx:CX,cy:CY,r:236});
// léger flottement organique appliqué au tissu
const filt=add(defs,'filter',{id:'fiber',x:'-5%',y:'-5%',width:'110%',height:'110%'});
add(filt,'feTurbulence',{type:'turbulence',baseFrequency:'0.85 0.03',numOctaves:2,seed:7,result:'n'});
add(filt,'feDisplacementMap',{in:'SourceGraphic',in2:'n',scale:2.4});

const gBack=add(svg,'g',{}), gFond=add(svg,'g',{}),
      gTissu=add(svg,'g',{filter:'url(#fiber)'}), gEnnea=add(svg,'g',{}), gAvant=add(svg,'g',{});

/* ===== ④ FLEUR DE VIE DOMINANTE ===== */
(function(){
  const g=add(gBack,'g',{'clip-path':'url(#fdvClip)'});
  const r=46, dy=r*Math.sqrt(3)/2, clipR=236;
  const seen=new Set();
  for(let row=-8;row<=8;row++){
    for(let i=-8;i<=8;i++){
      const x=CX + i*r + (row&1? r/2:0), y=CY + row*dy;
      const key=x.toFixed(1)+','+y.toFixed(1); if(seen.has(key))continue; seen.add(key);
      if(Math.hypot(x-CX,y-CY) <= clipR + r){
        // intensité qui décroît vers le bord -> la fleur "rayonne" du centre
        const d=Math.hypot(x-CX,y-CY);
        const op = 0.85 - Math.min(0.55, d/clipR*0.6);
        add(g,'circle',{cx:x,cy:y,r,fill:'none',stroke:col('fdv'),'stroke-width':1.0,opacity:op});
      }
    }
  }
  // cercles de bornage bien présents
  add(gBack,'circle',{cx:CX,cy:CY,r:236,fill:'none',stroke:col('fdv'),'stroke-width':1.3,opacity:0.8});
  add(gBack,'circle',{cx:CX,cy:CY,r:246,fill:'none',stroke:col('fdv'),'stroke-width':0.9,opacity:0.55});
})();

/* ===== ⑤ bordure + marqueurs (lotus retiré : la fleur suffit) ===== */
for(let q=1;q<=9;q++){const[x,y]=polar(CX,CY,236,(q-1)*SPAN);
  add(gFond,'circle',{cx:x,cy:y,r:3,fill:col('accent'),opacity:0.85});}

/* ===== ② LE TISSU (un peu allégé pour laisser respirer la fleur) ===== */
const R0=40, R1=RQ-14, NR=12;
const ringR=[...Array(NR)].map((_,k)=>R0+(R1-R0)*k/(NR-1));
const warpsPerSec=4, warpAngles=[];
for(let n=1;n<=9;n++){const c0=(n-1)*SPAN;
  for(let w=0;w<warpsPerSec;w++){const ang=c0-SPAN/2+SPAN*(w+0.5)/warpsPerSec;
    warpAngles.push({ang,n});const[x,y]=polar(CX,CY,RQ,ang);
    add(gTissu,'line',{x1:CX,y1:CY,x2:x,y2:y,stroke:col('chaine'),'stroke-width':0.9,opacity:0.45});}}
function weft(k,a0,a1,tint,op){let d='';const step=2.0;
  for(let a=a0;a<=a1+0.01;a+=step){const rr=ringR[k]+Math.sin(a*0.6+k)*1.2+jit(0.5);
    const[x,y]=polar(CX,CY,rr,a);d+=(d===''?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
  add(gTissu,'path',{d,fill:'none',stroke:tint,'stroke-width':2.6,opacity:op,'stroke-linecap':'round'});}
const woven={};
for(let n=1;n<=9;n++){const c=counts[n],e=elemNombre[n],c0=(n-1)*SPAN,a0=c0-SPAN/2+1.5,a1=c0+SPAN/2-1.5;
  let hi=c>0?Math.round((NR-1)*c/MAX):-1; if(c>0)hi=Math.max(1,hi-(R()<0.5?1:0)); woven[n]=hi;
  for(let k=0;k<=hi;k++) weft(k,a0,a1,ELEM[e],0.8-k*0.015);}
warpAngles.forEach(({ang,n})=>{const hi=woven[n];if(hi<0)return;const[x,y]=polar(CX,CY,ringR[hi],ang);
  add(gTissu,'line',{x1:CX,y1:CY,x2:x,y2:y,stroke:col('chaine'),'stroke-width':0.9,opacity:0.6});});
for(let n=1;n<=9;n++){const c=counts[n],e=elemNombre[n],c0=(n-1)*SPAN,a0=c0-SPAN/2+1.5,a1=c0+SPAN/2-1.5,hi=woven[n];
  for(let k=0;k<=hi;k++) if(k%2===1) weft(k,a0,a1,ELEM[e],0.88);}
for(let n=1;n<=9;n++){if(counts[n]>0)continue;const c0=(n-1)*SPAN,e=elemNombre[n];
  for(let t=0;t<3;t++){const ang=c0-8+t*8;let d='';
    for(let s=0;s<=7;s++){const[x,y]=polar(CX,CY,R0+s*13,ang+Math.sin(s)*3.4+jit(1));d+=(s===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
    add(gTissu,'path',{d,fill:'none',stroke:ELEM[e],'stroke-width':1.3,opacity:0.5,'stroke-linecap':'round','stroke-dasharray':'1 4'});}}

/* ===== ③ ENNÉAGRAMME (discret, pour ne pas voler la vedette à la fleur) ===== */
const V=[...Array(9)].map((_,i)=>polar(CX,CY,RQ,i*SPAN));
function polygonPath(step){const paths=[],seen=new Set();
  for(let s=0;s<9;s++){if(seen.has(s))continue;let idx=s,pts=[];
    do{pts.push(idx);seen.add(idx);idx=(idx+step)%9;}while(idx!==s);
    if(pts.length>2)paths.push(pts);}return paths;}
function drawCompound(step,tint,w,op){polygonPath(step).forEach(pts=>{let d='';
  pts.forEach((p,i)=>{d+=(i===0?'M':'L')+V[p][0]+' '+V[p][1]+' ';});d+='Z';
  add(gEnnea,'path',{d,fill:'none',stroke:tint,'stroke-width':w,opacity:op,'stroke-linejoin':'round'});});}
drawCompound(3,col('accent'),1.1,0.4);
drawCompound(2,col('accent'),0.7,0.22);

/* ===== sommets ===== */
for(let n=1;n<=9;n++){const[x,y]=V[n-1],c=counts[n],e=elemNombre[n];
  if(c>0){add(gAvant,'circle',{cx:x,cy:y,r:9+c*2.4,fill:ELEM[e],'fill-opacity':0.35,stroke:ELEM[e],'stroke-width':1.6});
    const t=el('text',{x,y,class:'num','font-size':13,fill:col('texte')});t.textContent=n;gAvant.appendChild(t);}
  else{add(gAvant,'circle',{cx:x,cy:y,r:12,fill:col('fond'),stroke:col('feu'),'stroke-width':1.2,'stroke-dasharray':'2 3'});
    const t=el('text',{x,y,class:'num','font-size':13,fill:col('feu')});t.textContent=n;gAvant.appendChild(t);
    const tl=el('text',{x,y:y-19,'text-anchor':'middle','font-size':8.5,fill:col('feu'),'font-family':'sans-serif'});tl.textContent='à tisser';gAvant.appendChild(tl);}}

/* ===== ① CŒUR ===== */
(function(){const o=9;
  add(gAvant,'circle',{cx:CX-o,cy:CY,r:26,fill:'none',stroke:col('accent'),'stroke-width':0.8,opacity:0.55});
  add(gAvant,'circle',{cx:CX+o,cy:CY,r:26,fill:'none',stroke:col('accent'),'stroke-width':0.8,opacity:0.55});
  add(gAvant,'circle',{cx:CX,cy:CY,r:22,fill:col('fond'),stroke:col('accent'),'stroke-width':1.5});
  add(gAvant,'circle',{cx:CX,cy:CY,r:17,fill:'url(#coeur)'});
  const t=el('text',{x:CX,y:CY,class:'num','font-size':20,fill:col('fond'),'font-weight':600});t.textContent=8;gAvant.appendChild(t);})();
</script>
</body>
</html>
