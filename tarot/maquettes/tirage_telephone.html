<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — tirage téléphone</title>
<style>
/* Maquette statique : aucune modification de l'app. Couleurs reprises de static/css/app.css */
:root {
  --fond: #131019; --fond-profond: #0d0a12; --encre: #ece7dc; --brume: #9a92a6;
  --or: #c9a55c; --or-doux: rgba(201,165,92,.38); --or-fil: rgba(201,165,92,.22);
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
body { background: #07050a; color: var(--encre); font-family: var(--serif);
  display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 40px; min-height: 100vh; }

.regie { font-family: var(--sans); font-size: 12px; color: var(--brume); text-align: center; max-width: 420px; line-height: 1.5; }
.regie button { border: 1px solid var(--or-fil); border-radius: 20px; padding: 5px 12px; margin: 6px 3px 0; color: var(--encre); }
.regie button.actif { border-color: var(--or); color: var(--or); }

/* ── Cadre téléphone ── */
.tel { width: 375px; max-width: 100%; height: 760px; border-radius: 38px; border: 1px solid #2a2433;
  background: radial-gradient(120% 90% at 50% 0%, rgba(201,165,92,.06), transparent 55%), var(--fond);
  position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.ecran { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 46px 16px 18px;
  transition: opacity .5s ease, transform .5s ease; }
.ecran.cache { opacity: 0; pointer-events: none; transform: translateY(12px); }

/* En-tête replié pendant le tirage */
.mini-entete { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans);
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--brume); }
.mini-entete b { font-family: var(--serif); font-size: 17px; letter-spacing: .02em; text-transform: none; color: var(--encre); font-weight: normal; }

/* ── Plan miniature ── */
.plan { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.bande { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.bande-titre { font-family: var(--sans); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--brume); transition: color .3s; }
.bande.en-cours .bande-titre { color: var(--or); }
.cases { display: flex; gap: 8px; }
.case { width: 30px; height: 52px; border: 1px dashed var(--or-fil); border-radius: 4px; position: relative; overflow: hidden; transition: border-color .3s; }
.case img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.3); transition: all .45s ease; }
.case.remplie { border: 1px solid var(--or-doux); }
.case.remplie img { opacity: 1; transform: none; }
.case.suivante { border: 1px solid var(--or); animation: pouls 1.6s ease-in-out infinite; }
@keyframes pouls { 50% { box-shadow: 0 0 0 4px rgba(201,165,92,.15); } }
.bande.cle .case { width: 34px; height: 59px; }

.compteur { margin-top: auto; text-align: center; }
.compteur .nb { font-family: var(--sans); font-size: 11px; letter-spacing: .14em; color: var(--brume); }
.compteur .pos { font-size: 19px; font-style: italic; margin-top: 4px; min-height: 26px; }
.consigne { font-family: var(--sans); font-size: 11px; color: var(--brume); text-align: center; margin-top: 4px; }

/* ── Ruban : une seule rangée, 79 cartes, sans défilement ── */
.ruban { position: relative; width: 100%; height: 112px; margin-top: 18px; touch-action: none; cursor: grab; }
.ruban .c { position: absolute; bottom: 8px; width: 34px; height: 60px; border-radius: 3px;
  background: url(../static/img/dos.png) center/cover, #2a2140; box-shadow: -1px 0 2px rgba(0,0,0,.55);
  transition: transform .14s ease-out, opacity .3s; will-change: transform; }
.ruban .c.partie { opacity: 0; transform: translateY(-60px) !important; pointer-events: none; }
.ruban .c.focus { box-shadow: 0 0 0 1px var(--or), 0 6px 14px rgba(0,0,0,.6); }

/* ── Lecture ── */
.vues { display: flex; justify-content: center; gap: 4px; margin-top: 14px; font-family: var(--sans); font-size: 12px; }
.vues button { padding: 6px 14px; border-radius: 16px; color: var(--brume); border: 1px solid transparent; }
.vues button.actif { color: var(--or); border-color: var(--or-doux); }
.grille-sel { text-align: center; font-family: var(--sans); font-size: 10px; color: var(--brume); margin-top: 6px; letter-spacing: .08em; }
.vue { flex: 1; overflow-y: auto; margin-top: 12px; display: none; scrollbar-width: none; }
.vue.actif { display: flex; flex-direction: column; }

/* Récit */
.recit-carte { width: 170px; aspect-ratio: 300/527; margin: 4px auto 0; border-radius: 8px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.6), 0 0 0 1px var(--or-fil); }
.recit-carte img { width: 100%; height: 100%; object-fit: cover; }
.recit-temps { text-align: center; font-family: var(--sans); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--or); margin-top: 14px; }
.recit-pos { text-align: center; font-size: 20px; font-style: italic; margin-top: 4px; }
.recit-nom { text-align: center; font-family: var(--sans); font-size: 11px; color: var(--brume); margin-top: 2px; }
.recit-texte { font-size: 14px; line-height: 1.55; margin-top: 12px; color: #d8d2c6; }
.recit-nav { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; font-family: var(--sans); font-size: 12px; color: var(--brume); }
.points { display: flex; gap: 5px; }
.points i { width: 5px; height: 5px; border-radius: 50%; background: var(--or-fil); }
.points i.actif { background: var(--or); }

/* Ensemble */
.ens { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ens .rang { display: flex; gap: 10px; }
.ens .k { width: 62px; aspect-ratio: 300/527; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 1px var(--or-fil); position: relative; }
.ens .k img { width: 100%; height: 100%; object-fit: cover; }
.ens .k.sel { box-shadow: 0 0 0 2px var(--or); }
.ens .etiq { font-family: var(--sans); font-size: 8.5px; text-align: center; color: var(--brume); width: 62px; margin-top: 3px; line-height: 1.2; }
.feuille { position: absolute; left: 0; right: 0; bottom: 0; background: var(--fond-profond); border-top: 1px solid var(--or-fil);
  border-radius: 18px 18px 0 0; padding: 10px 20px 26px; transform: translateY(105%); transition: transform .35s ease; }
.feuille.ouverte { transform: none; }
.feuille .poignee { width: 36px; height: 4px; border-radius: 2px; background: var(--or-fil); margin: 0 auto 10px; }

/* Liens */
.liens { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lien-bande { width: 100%; border: 1px solid var(--or-fil); border-radius: 12px; padding: 10px; display: flex; gap: 10px; align-items: center; }
.lien-bande .mini { display: flex; gap: 4px; }
.lien-bande .mini img { width: 30px; aspect-ratio: 300/527; object-fit: cover; border-radius: 3px; }
.lien-bande p { font-size: 12.5px; line-height: 1.4; color: #d8d2c6; }
.lien-bande p b { display: block; font-family: var(--sans); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--or); font-weight: normal; margin-bottom: 2px; }
.fil { width: 1px; height: 14px; background: var(--or-doux); }
.centre { text-align: center; border: 1px solid var(--or); border-radius: 14px; padding: 12px; width: 100%; }
.centre img { width: 56px; border-radius: 4px; }
.centre p { font-size: 13px; font-style: italic; margin-top: 6px; }
</style>
</head>
<body>

<div class="regie">
  Maquette statique — rien n'est branché à l'app. Glisse le doigt (ou la souris) sur le ruban, lâche pour piger.
  <div>
    <button id="r-pilote">Ruban : 10 cartes (pilote)</button>
    <button id="r-complet" class="actif">Ruban : 79 cartes</button>
    <button id="r-auto">Remplir d'un coup</button>
    <button id="r-reset">Recommencer</button>
  </div>
</div>

<div class="tel">

  <!-- ═══ Phase 1 : tirage ═══ -->
  <section class="ecran" id="e-tirage">
    <div class="mini-entete"><b>Tarot</b><span>Neuf + une</span></div>
    <div class="plan" id="plan"></div>
    <div class="compteur">
      <div class="nb" id="nb">0 / 10</div>
      <div class="pos" id="pos"></div>
    </div>
    <div class="ruban" id="ruban"></div>
    <p class="consigne">Glisse sur le paquet · lâche pour piger</p>
  </section>

  <!-- ═══ Phase 2 : lecture ═══ -->
  <section class="ecran cache" id="e-lecture">
    <div class="mini-entete"><b>Tarot</b><span>La lecture</span></div>
    <div class="vues" role="tablist">
      <button data-v="recit" class="actif">Récit</button>
      <button data-v="ensemble">Ensemble</button>
      <button data-v="liens">Liens</button>
    </div>
    <p class="grille-sel">Grille : Les trois temps ▾</p>

    <div class="vue actif" id="v-recit">
      <div class="recit-carte"><img id="rc-img" alt=""></div>
      <p class="recit-temps" id="rc-temps"></p>
      <p class="recit-pos" id="rc-pos"></p>
      <p class="recit-nom" id="rc-nom"></p>
      <p class="recit-texte" id="rc-texte"></p>
      <div class="recit-nav"><button id="rc-prec">‹ Précédente</button><div class="points" id="rc-points"></div><button id="rc-suiv">Suivante ›</button></div>
    </div>

    <div class="vue" id="v-ensemble"><div class="ens" id="ens"></div></div>

    <div class="vue" id="v-liens"><div class="liens" id="liens"></div></div>

    <div class="feuille" id="feuille"><div class="poignee"></div>
      <p class="recit-temps" id="f-temps" style="margin-top:0"></p>
      <p class="recit-pos" id="f-pos"></p>
      <p class="recit-texte" id="f-texte"></p>
    </div>
  </section>
</div>

<script>
const IMG = "../static/img/cartes/";
const NOMS = [];
["major_00","major_01","major_02","major_03","major_04","major_05","major_06","major_07","major_08","major_09","major_10",
 "major_11","major_12","major_13","major_14","major_15","major_16","major_17","major_18","major_19","major_20","major_21","master"]
 .forEach(n => NOMS.push(n));
["air","eau","feu","terre"].forEach(s => ["as","02","03","04","05","06","07","08","09","10","page","chevalier","reine","roi"].forEach(v => NOMS.push(s+"_"+v)));
const joli = n => n.replace("major_","Arcane ").replace("master","Le Maître").replace("_"," · ");

const TEMPS = [
  { t: "Premier temps — le visible", court: "Le visible" },
  { t: "Deuxième temps — le latent", court: "Le latent" },
  { t: "Troisième temps — la résolution", court: "La résolution" },
];
const POS = ["Ce que j'amène", "Ce qui se joue", "Ce que je peux déposer"];
const POSITIONS = [];
TEMPS.forEach((T, b) => POS.forEach(p => POSITIONS.push({ bande: b, temps: T.court, pos: p })));
POSITIONS.push({ bande: 3, temps: "La clé", pos: "Ce qui relie tout" });
const TEXTE = "Texte d'exemple. Ici viendrait la lecture de la carte dans cette position : ce qu'elle éclaire, la question qu'elle pose, sans rien prédire.";

let tirees = [], taille = 79;
const $ = id => document.getElementById(id);

/* ── Plan miniature ── */
function dessinerPlan() {
  const plan = $("plan"); plan.innerHTML = "";
  [0,1,2,3].forEach(b => {
    const bande = document.createElement("div");
    bande.className = "bande" + (b === 3 ? " cle" : "");
    bande.dataset.b = b;
    bande.innerHTML = `<span class="bande-titre">${b < 3 ? TEMPS[b].court : "La clé"}</span><div class="cases"></div>`;
    POSITIONS.forEach((p, i) => { if (p.bande === b) bande.querySelector(".cases").insertAdjacentHTML("beforeend", `<div class="case" data-i="${i}"><img alt=""></div>`); });
    plan.appendChild(bande);
  });
  majPlan();
}
function majPlan() {
  const n = tirees.length;
  document.querySelectorAll(".case").forEach(c => {
    const i = +c.dataset.i;
    c.classList.toggle("remplie", i < n);
    c.classList.toggle("suivante", i === n);
    if (i < n) c.querySelector("img").src = IMG + tirees[i] + ".jpg";
  });
  document.querySelectorAll(".bande").forEach(b => b.classList.toggle("en-cours", n < 10 && POSITIONS[n].bande === +b.dataset.b));
  $("nb").textContent = n + " / 10";
  $("pos").textContent = n < 10 ? POSITIONS[n].temps + " · " + POSITIONS[n].pos : "";
}

/* ── Ruban : une rangée, pas calculé pour tenir dans la largeur ── */
let cartes = [], pas = 0, focus = -1;
function dessinerRuban() {
  const r = $("ruban"); r.innerHTML = ""; cartes = [];
  const w = r.clientWidth, l = 34;
  pas = (w - l) / (taille - 1);
  for (let i = 0; i < taille; i++) {
    const c = document.createElement("div");
    c.className = "c"; c.style.left = (i * pas) + "px"; c.style.zIndex = i;
    r.appendChild(c); cartes.push(c);
  }
}
function indexSous(x) {
  const r = $("ruban").getBoundingClientRect();
  let i = Math.round((x - r.left - 17) / pas);
  i = Math.max(0, Math.min(taille - 1, i));
  // saute les cartes déjà parties : prend la plus proche encore là
  for (let d = 0; d < taille; d++) {
    if (cartes[i + d] && !cartes[i + d].classList.contains("partie")) return i + d;
    if (cartes[i - d] && !cartes[i - d].classList.contains("partie")) return i - d;
  }
  return -1;
}
function loupe(i) {
  focus = i;
  cartes.forEach((c, j) => {
    if (c.classList.contains("partie")) return;
    const d = Math.abs(j - i);
    const lev = i < 0 ? 0 : d === 0 ? 34 : d <= 6 ? 22 * (1 - d / 7) : 0;
    const s = d === 0 && i >= 0 ? 1.18 : 1;
    c.style.transform = `translateY(${-lev}px) scale(${s})`;
    c.style.zIndex = d === 0 && i >= 0 ? 500 : j;
    c.classList.toggle("focus", d === 0 && i >= 0);
  });
}
function piger() {
  if (focus < 0 || tirees.length >= 10) return;
  cartes[focus].classList.add("partie");
  let nom; do { nom = NOMS[Math.floor(Math.random() * NOMS.length)]; } while (tirees.includes(nom));
  tirees.push(nom); loupe(-1); majPlan();
  if (tirees.length === 10) setTimeout(versLecture, 900);
}
const ruban = $("ruban");
ruban.addEventListener("pointerdown", e => { ruban.setPointerCapture(e.pointerId); loupe(indexSous(e.clientX)); });
ruban.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "mouse") loupe(indexSous(e.clientX)); });
ruban.addEventListener("pointerup", piger);
ruban.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") loupe(-1); });

/* ── Lecture ── */
let ir = 0;
function versLecture() {
  $("e-tirage").classList.add("cache"); $("e-lecture").classList.remove("cache");
  ir = 0; recit(); ensemble(); liens();
}
function recit() {
  const p = POSITIONS[ir];
  $("rc-img").src = IMG + tirees[ir] + ".jpg";
  $("rc-temps").textContent = p.bande < 3 ? TEMPS[p.bande].t : "La carte-clé";
  $("rc-pos").textContent = p.pos;
  $("rc-nom").textContent = joli(tirees[ir]);
  $("rc-texte").textContent = TEXTE;
  $("rc-points").innerHTML = POSITIONS.map((_, i) => `<i class="${i === ir ? "actif" : ""}"></i>`).join("");
}
$("rc-prec").onclick = () => { ir = (ir + 9) % 10; recit(); };
$("rc-suiv").onclick = () => { ir = (ir + 1) % 10; recit(); };
let dx = null;
$("v-recit").addEventListener("pointerdown", e => dx = e.clientX);
$("v-recit").addEventListener("pointerup", e => { if (dx !== null && Math.abs(e.clientX - dx) > 40) { ir = (ir + (e.clientX < dx ? 1 : 9)) % 10; recit(); } dx = null; });

function ensemble() {
  const box = $("ens"); box.innerHTML = "";
  [0,1,2,3].forEach(b => {
    const rang = document.createElement("div"); rang.className = "rang";
    POSITIONS.forEach((p, i) => { if (p.bande === b) rang.insertAdjacentHTML("beforeend",
      `<div><div class="k" data-i="${i}"><img src="${IMG + tirees[i]}.jpg" alt=""></div><p class="etiq">${p.pos}</p></div>`); });
    box.appendChild(rang);
  });
  box.querySelectorAll(".k").forEach(k => k.onclick = () => {
    box.querySelectorAll(".k").forEach(x => x.classList.toggle("sel", x === k));
    const p = POSITIONS[+k.dataset.i];
    $("f-temps").textContent = (p.bande < 3 ? TEMPS[p.bande].court : "La clé") + " · " + joli(tirees[+k.dataset.i]);
    $("f-pos").textContent = p.pos; $("f-texte").textContent = TEXTE;
    $("feuille").classList.add("ouverte");
  });
}
$("feuille").onclick = () => $("feuille").classList.remove("ouverte");

function liens() {
  const box = $("liens"); box.innerHTML = "";
  const SENS = ["Ce qui se voit déjà, plan par plan.", "Ce qui travaille dessous, sans être nommé.", "Ce qui peut se dénouer."];
  [0,1,2].forEach(b => {
    box.insertAdjacentHTML("beforeend", `<div class="lien-bande"><div class="mini">${[0,1,2].map(k => `<img src="${IMG + tirees[b*3+k]}.jpg" alt="">`).join("")}</div><p><b>${TEMPS[b].court}</b>${SENS[b]}</p></div>`);
    box.insertAdjacentHTML("beforeend", `<div class="fil"></div>`);
    if (b === 1) box.insertAdjacentHTML("beforeend", `<div class="centre"><img src="${IMG + tirees[9]}.jpg" alt=""><p>La clé relie le latent à la résolution — percée et clôture seraient mises en avant ici.</p></div><div class="fil"></div>`);
  });
  box.lastChild.remove();
}
document.querySelectorAll(".vues button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".vues button").forEach(x => x.classList.toggle("actif", x === b));
  document.querySelectorAll(".vue").forEach(v => v.classList.toggle("actif", v.id === "v-" + b.dataset.v));
  $("feuille").classList.remove("ouverte");
});

/* ── Régie ── */
function reset() {
  tirees = []; $("e-lecture").classList.add("cache"); $("e-tirage").classList.remove("cache");
  $("feuille").classList.remove("ouverte"); dessinerPlan(); dessinerRuban();
}
function regle(n, id) { taille = n; document.querySelectorAll("#r-pilote,#r-complet").forEach(b => b.classList.toggle("actif", b.id === id)); reset(); }
$("r-pilote").onclick = () => regle(10, "r-pilote");
$("r-complet").onclick = () => regle(79, "r-complet");
$("r-reset").onclick = reset;
$("r-auto").onclick = () => { while (tirees.length < 10) { focus = indexSous(Math.random() * 400 + 200); if (focus < 0) break; piger(); } };
reset();
</script>
</body>
</html>
