<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Édition de l'album · Tarot</title>
<meta name="robots" content="noindex">
<style>
:root{
  --encre:#ece0bd; --encre2:#b3a68a; --accent:#d9b95c;
  --papier:#141110; --papier2:#1e1a16; --bord:#372e1e;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--papier); color:var(--encre);
  font-family:var(--sans); line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:22px;
}
.carte{
  background:var(--papier2); border:1px solid var(--bord);
  border-radius:var(--r); padding:34px 30px; width:100%; max-width:420px;
}
.petit{
  color:var(--accent); letter-spacing:.3em; text-transform:uppercase;
  font-size:11px; margin-bottom:14px;
}
h1{font-weight:400; font-size:22px; margin-bottom:8px}
.note{color:var(--encre2); font-size:13.5px; margin-bottom:22px}
label{display:block; font-size:13px; color:var(--encre2); margin:14px 0 6px}
input[type=password]{
  width:100%; padding:11px 13px; border-radius:10px;
  border:1px solid var(--bord); background:var(--papier); color:var(--encre);
  font-size:15px;
}
button{
  margin-top:20px; width:100%; padding:12px;
  border-radius:10px; border:1px solid var(--accent);
  background:var(--accent); color:var(--papier);
  font-size:15px; cursor:pointer;
}
button:hover{filter:brightness(1.08)}
.erreur{
  margin-top:16px; padding:10px 12px; border-radius:10px;
  border:1px solid #7a4040; color:#e2a9a9; background:#2a1a1a; font-size:13.5px;
}
a{color:var(--accent); font-size:13px; display:inline-block; margin-top:18px}
</style>
</head>
<body>
<div class="carte">
  <div class="petit">Tarot · édition</div>
  <h1>Mot de passe de l'album</h1>
  <p class="note">L'album se consulte librement. L'édition des textes est
    gardée par ce mot de passe (variable <code>TAROT_ALBUM_MDP</code> de
    l'environnement).</p>
  {% if erreur %}<div class="erreur">{{ erreur }}</div>{% endif %}
  <form method="post" action="/album/connexion">
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" name="mdp" autofocus autocomplete="current-password">
    <button type="submit">Entrer dans l'édition</button>
  </form>
  <a href="{{ url_for('album') }}">Retour à l'album sans éditer</a>
</div>
</body>
</html>
