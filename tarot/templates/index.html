<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarot — le tirage</title>
<link rel="stylesheet" href="css/app.css?v=60">
</head>
<body class="accueil{% if embed %} embed{% endif %}">

<header class="entete">
  <p class="surtitre" id="surtitre-jeu">Le jeu des 79</p>
  <h1 class="marque">Tarot</h1>
  <p class="devise">Une carte est un miroir, pas une promesse.</p>
</header>

<main class="scene">

  <!-- L'entrée : les tirages rangés par ce qu'on vient chercher (rempli par le JS) -->
  <section id="catalogue" class="catalogue" aria-labelledby="cat-titre">
    <h2 class="cat-titre" id="cat-titre">Que viens-tu chercher ?</h2>
    <div id="cat-etageres"></div>
  </section>

  <!-- La barre d'un tirage : revenir, le nom, la méthode -->
  <div id="barre-tirage" class="barre-tirage" hidden>
    <button id="retour-tirages" class="retour-tirages" type="button"><span aria-hidden="true">‹</span> Tirages</button>
    <p class="barre-nom"><span id="barre-nom"></span><small id="barre-sous"></small></p>
    <button id="barre-info" class="barre-info" type="button" aria-label="La méthode complète de ce tirage" aria-expanded="false">i</button>
  </div>

  <div id="ped-zone" class="ped-zone"><div id="ped-contenu"></div></div>

  <!-- Avant de piger : comment (Trois cartes) ou quelle lecture (La croix) -->
  <div id="bascule" class="bascule invisibles" role="tablist"></div>

  <!-- Trois cartes : la grille se choisit dès l'ouverture (Martin, 2026-11-16) —
       une ligne, les quatre grilles dans le tiroir -->
  <button id="grille-avant" class="relire grille-avant invisibles" type="button" aria-haspopup="dialog">
    <span>Grille de lecture<small id="grille-avant-sous"></small></span><span class="relire-fleche" aria-hidden="true">›</span>
  </button>

  <div id="vues" class="vues invisibles" role="tablist" aria-label="Façon de lire">
    <button class="vue-bouton" data-vue="recit" role="tab" type="button">Récit</button>
    <button class="vue-bouton actif" data-vue="ensemble" role="tab" type="button">Ensemble</button>
    <button class="vue-bouton" data-vue="liens" role="tab" type="button">Liens</button>
  </div>

  <div id="slots" class="slots invisibles" aria-live="polite"></div>

  <p id="compteur-tirage" class="compteur-tirage invisibles" aria-live="polite"></p>

  <section id="vue-recit" class="vue-recit invisibles" aria-label="La lecture, carte par carte"></section>

  <section id="vue-liens" class="vue-liens invisibles" aria-label="Les liens entre les cartes"></section>

  <div id="eventail" class="eventail" aria-label="Éventail de cartes, touchez-en une"></div>

  <section id="choix" class="choix-zone invisibles" aria-label="Tirage au choix">
    <p class="choix-consigne" id="choix-consigne"></p>
    <p class="choix-compteur" id="choix-compteur"></p>
    <div class="choix-mur" id="choix-mur"></div>
    <div class="choix-actions">
      <button id="choix-eliminer" class="bouton-discret invisible" type="button">Éliminer</button>
      <button id="choix-lire" class="bouton-discret" type="button" disabled>Lire ces trois cartes</button>
    </div>
    <details class="choix-methode">
      <summary>Comment choisir</summary>
      <div id="choix-methode"></div>
    </details>
  </section>

  <div id="lecture" class="lecture invisibles"></div>

  <!-- Après la lecture : relire la même donne sous une autre grille -->
  <button id="relire" class="relire invisibles" type="button" aria-haspopup="dialog">
    <span>Relire autrement<small id="relire-sous"></small></span><span class="relire-fleche" aria-hidden="true">›</span>
  </button>

  <div class="actions">
    <button id="replier" class="bouton-discret invisible" type="button">Mélanger les cartes</button>
  </div>

</main>

<footer class="pied">
  <p id="pied-texte">79 cartes · aucune prédiction</p>
</footer>

<div id="plein" class="plein invisible" aria-hidden="true">
  <button class="plein-fermer" type="button" aria-label="Fermer">✕</button>
  <div class="plein-corps">
    <img class="plein-img" src="" alt="">
    <div class="plein-texte">
      <p class="plein-nom"></p>
      <p class="plein-meta"></p>
      <div class="plein-sections"></div>
    </div>
  </div>
</div>

<div class="feuille-voile" id="feuille-relire" hidden>
  <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="feuille-titre">
    <p class="feuille-titre" id="feuille-titre">Relire la même donne</p>
    <p class="feuille-quoi">Les cartes ne bougent pas ; seule la question change.</p>
    <div id="feuille-options"></div>
  </div>
</div>

<div class="detail-position" id="detail-position" hidden>
  <div class="dp-carte">
    <button class="fermer-position" id="fermer-position" aria-label="Fermer">×</button>
    <h3 id="dp-titre"></h3>
    <div id="dp-corps"></div>
  </div>
</div>

<script>window.DOS_URL = "img/dos.png?v={{ version_dos }}";</script>
<script src="js/tirage.js?v=57"></script>
</body>
</html>
